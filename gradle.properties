# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache for every
# loader plugin used by PackForge.
org.gradle.configuration-cache=false

# Default target used by root aliases and direct platform builds.
packforge_target=mc26_1_to_26_2

# Mod properties
mod_version=1.3.1
maven_group=com.teenkung
