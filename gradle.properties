# Gradle memory, concurrency, and caching.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=true
# Source templates are maintained manually; Stonecutter only generates build outputs.
dev.kikugie.stonecutter.hard_mode=true

# Full builds pass strict configuration-cache checks, but Loom rewrites its
# shared layered-mappings artifact and prevents stable cache reuse.
org.gradle.configuration-cache=false

# Default target used by buildTarget, client and benchmark aliases.
packforge_target=mc26_1_to_26_2

# Release artifact coordinates.
mod_version=1.4.1
maven_group=com.teenkung
