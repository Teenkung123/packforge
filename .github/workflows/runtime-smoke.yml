name: Runtime client smoke

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Generate registry matrices
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.generate.outputs.targets }}
      smoke: ${{ steps.generate.outputs.smoke }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Mojang stable release ledger
        shell: pwsh
        run: ./scripts/Verify-Mojang-ReleaseSequence.ps1

      - name: Generate build and exact-release matrices from registry
        id: generate
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              build_kind=representative-build
              smoke_kind=representative-smoke
              ;;
            push)
              build_kind=expanded-build
              smoke_kind=expanded-smoke
              ;;
            schedule|workflow_dispatch)
              build_kind=build
              smoke_kind=smoke
              ;;
            *)
              echo "Unsupported workflow event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          echo "tier=$build_kind/$smoke_kind"
          echo "targets=$(python scripts/Generate-CiMatrix.py "$build_kind")" >> "$GITHUB_OUTPUT"
          echo "smoke=$(python scripts/Generate-CiMatrix.py "$smoke_kind")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }} artifact bundle
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up build Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Restore Gradle and Mavenizer caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            platform/forge/.gradle/mavenizer
          key: packforge-runtime-smoke-${{ runner.os }}-all-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            packforge-runtime-smoke-${{ runner.os }}-all-

      - name: Build and verify target artifacts
        run: |
          chmod +x gradlew
          ./gradlew buildTarget -Ppackforge_target=${{ matrix.target }} --no-daemon --stacktrace

      - name: Upload verified target artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: packforge-${{ matrix.target }}
          path: build/libs/packforge-*.jar
          if-no-files-found: error

  smoke:
    name: ${{ matrix.release }} / ${{ matrix.platform }} / ${{ matrix.target }}
    needs: [matrix, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.smoke) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download verified target artifact bundle
        uses: actions/download-artifact@v4
        with:
          name: packforge-${{ matrix.target }}
          path: build/libs

      - name: Verify target artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name 'packforge-*.jar' -printf '%f\n' | sort)
          if [[ "${#artifacts[@]}" -lt 1 ]]; then
            echo "No downloaded artifacts found for ${{ matrix.target }}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi

      - name: Set up target Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore target-scoped runtime cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            platform/forge/.gradle/mavenizer
          key: packforge-smoke-${{ runner.os }}-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.minecraft_version || matrix.forge_version || matrix.neoforge_version || 'registry' }}-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            packforge-smoke-${{ runner.os }}-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.minecraft_version || matrix.forge_version || matrix.neoforge_version || 'registry' }}-

      - name: Run exact-release loader smoke
        env:
          PACKFORGE_FORGE_VERSION_OVERRIDE: ${{ matrix.forge_version }}
          PACKFORGE_MINECRAFT_VERSION_OVERRIDE: ${{ matrix.minecraft_version }}
          PACKFORGE_NEOFORGE_VERSION_OVERRIDE: ${{ matrix.neoforge_version }}
          PACKFORGE_ARTIFACT_SMOKE: ${{ matrix.artifact_smoke }}
          PACKFORGE_ARTIFACT_INPUT_DIR: build/libs
        run: |
          # ForgeGradle cannot load the final SRG artifact in its Mojmap userdev
          # runtime; its final-artifact acceptance is kept in the Windows
          # production harness and the exact source smoke remains required here.
          chmod +x gradlew scripts/smoke-client.sh
          ./scripts/smoke-client.sh "${{ matrix.platform }}" "${{ matrix.target }}" 900

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.minecraft_version || matrix.forge_version || matrix.neoforge_version || 'registry' }}
          path: |
            platform/${{ matrix.platform }}/run/${{ matrix.target }}/logs/latest.log
            platform/${{ matrix.platform }}/run/${{ matrix.target }}/logs/packforge-smoke-gradle.log
          if-no-files-found: warn

  benchmark:
    name: 1.21.1 Fabric release benchmark
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'performance'))
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore benchmark cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: packforge-benchmark-${{ runner.os }}-mc1_21_1-fabric-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            packforge-benchmark-${{ runner.os }}-mc1_21_1-fabric-

      - name: Enforce warm, cold, and resource-equivalence gates
        run: |
          chmod +x gradlew scripts/smoke-client.sh scripts/benchmark-client.sh
          ./scripts/benchmark-client.sh fabric mc1_21_1 build/runtime-benchmark/mc1_21_1-fabric 900

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-mc1_21_1-fabric
          path: |
            build/runtime-benchmark/mc1_21_1-fabric
            platform/fabric/run/mc1_21_1/logs/latest.log
            platform/fabric/run/mc1_21_1/logs/packforge-smoke-gradle.log
          if-no-files-found: warn
