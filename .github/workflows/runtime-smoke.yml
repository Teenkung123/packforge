name: Runtime client smoke

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry_matrix:
    name: Derive registry runtime matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      target_matrix: ${{ steps.matrix.outputs.target_matrix }}
      runtime_matrix: ${{ steps.matrix.outputs.runtime_matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Derive canonical target and runtime checks
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          target_matrix="$(python scripts/prepare-modrinth-release.py --matrix targets)"
          runtime_matrix="$(python scripts/prepare-modrinth-release.py --matrix runtime)"
          printf 'target_matrix=%s\n' "$target_matrix" >> "$GITHUB_OUTPUT"
          printf 'runtime_matrix=%s\n' "$runtime_matrix" >> "$GITHUB_OUTPUT"

  build-targets:
    name: Build smoke artifacts / ${{ matrix.target }}
    needs: registry_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.registry_matrix.outputs.target_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Restore target build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/nodes/forge/*/minecraftforge/forgegradle/mavenizer
          key: packforge-nodes-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle') }}
          restore-keys: |
            packforge-nodes-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Build, test, and verify target artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x gradlew
          ./gradlew :buildTarget -Ppackforge_target="$TARGET" --configure-on-demand --no-daemon --stacktrace

      - name: Upload verified target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packforge-smoke-target-${{ matrix.target }}
          path: build/libs/packforge-*.jar
          compression-level: 0
          if-no-files-found: error

  build:
    name: Assemble exact smoke artifact bundle
    needs: build-targets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download verified target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packforge-smoke-target-*
          merge-multiple: true
          path: build/libs

      - name: Verify complete artifact inventory without rebuilding loaders
        run: |
          chmod +x gradlew
          ./gradlew :verifyExistingArtifacts --configure-on-demand --no-daemon --stacktrace

      - name: Write exact release SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name 'packforge-*.jar' -printf '%f\n' | sort)
          expected_count="$(python scripts/prepare-modrinth-release.py --count-only)"
          if [[ "${#artifacts[@]}" -ne "$expected_count" ]]; then
            echo "Expected exactly $expected_count registry-derived release artifacts, found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          (
            cd build/libs
            sha256sum "${artifacts[@]}" > SHA256SUMS
          )
          checksum_count="$(wc -l < build/libs/SHA256SUMS)"
          if [[ "$checksum_count" -ne "$expected_count" ]]; then
            echo "Expected $expected_count checksum rows, found $checksum_count."
            exit 1
          fi

      - name: Upload verified artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: packforge-all-supported
          compression-level: 0
          path: |
            build/libs/packforge-*.jar
            build/libs/SHA256SUMS
          if-no-files-found: error

  smoke:
    name: ${{ matrix.target }} / ${{ matrix.platform }} / ${{ matrix.runtime_label }}
    needs: [build, registry_matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.registry_matrix.outputs.runtime_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download verified artifact bundle
        uses: actions/download-artifact@v4
        with:
          name: packforge-all-supported
          path: build/libs

      - name: Verify exact release SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/SHA256SUMS
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name 'packforge-*.jar' -printf '%f\n' | sort)
          expected_count="$(python scripts/prepare-modrinth-release.py --count-only)"
          if [[ "${#artifacts[@]}" -ne "$expected_count" ]]; then
            echo "Expected exactly $expected_count registry-derived downloaded artifacts, found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          (
            cd build/libs
            sha256sum -c SHA256SUMS
          )

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore Forge game assets
        if: matrix.platform == 'forge' && matrix.target != 'mc1_20_1'
        uses: actions/cache@v4
        with:
          path: ~/.minecraft/assets
          key: packforge-forge-assets-v1-${{ runner.os }}-${{ matrix.target }}-${{ matrix.forge_version || 'registry' }}
          restore-keys: |
            packforge-forge-assets-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Restore target-scoped runtime cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/nodes/forge/*/minecraftforge/forgegradle/mavenizer
          key: packforge-nodes-v1-smoke-${{ runner.os }}-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.runtime_label }}-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle') }}
          # Override cells must not reuse registry-version transformed game classes.
          restore-keys: |
            packforge-nodes-v1-smoke-${{ runner.os }}-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.runtime_label }}-
            ${{ !matrix.minecraft_version && !matrix.forge_version && !matrix.neoforge_version && format('packforge-nodes-v1-{0}-{1}-', runner.os, matrix.target) || '' }}

      - name: Configure headless Forge launch
        if: matrix.platform == 'forge' && matrix.target != 'mc1_20_1'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "platform/forge/run/$TARGET/config"
          printf 'earlyWindowControl = false\n' > "platform/forge/run/$TARGET/config/fml.toml"

      - name: Run loader smoke (packaged official-mapped NeoForge/mc26 Fabric; source legacy Fabric/all Forge; exact legacy Fabric final-JAR acceptance via production harness)
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
          RUNTIME_TARGET: ${{ matrix.target }}
          RUNTIME_TIMEOUT: "900"
          PACKFORGE_FORGE_VERSION_OVERRIDE: ${{ matrix.forge_version }}
          PACKFORGE_MINECRAFT_VERSION_OVERRIDE: ${{ matrix.minecraft_version }}
          PACKFORGE_NEOFORGE_VERSION_OVERRIDE: ${{ matrix.neoforge_version }}
          PACKFORGE_ARTIFACT_SMOKE: ${{ matrix.artifact_smoke }}
          PACKFORGE_ARTIFACT_INPUT_DIR: build/libs
        run: |
          # Packaged smoke is limited to official-mapped NeoForge and mc26 Fabric.
          # Legacy Fabric and all Forge use source mode here; exact legacy Fabric
          # final-JAR acceptance uses the production harness.
          chmod +x gradlew scripts/smoke-client.sh
          ./scripts/smoke-client.sh "$RUNTIME_PLATFORM" "$RUNTIME_TARGET" "$RUNTIME_TIMEOUT"

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.runtime_label }}
          path: |
            platform/${{ matrix.platform }}/run/${{ matrix.target }}/logs/latest.log
            platform/${{ matrix.platform }}/run/${{ matrix.target }}/logs/packforge-smoke-gradle.log
          if-no-files-found: warn

  benchmark:
    name: 1.21.1 Fabric release benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore benchmark cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: packforge-nodes-v1-benchmark-${{ runner.os }}-mc1_21_1-fabric-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle') }}
          restore-keys: |
            packforge-nodes-v1-benchmark-${{ runner.os }}-mc1_21_1-fabric-
            packforge-nodes-v1-${{ runner.os }}-mc1_21_1-

      - name: Enforce warm, cold, and resource-equivalence gates
        run: |
          chmod +x gradlew scripts/smoke-client.sh scripts/benchmark-client.sh
          ./scripts/benchmark-client.sh fabric mc1_21_1 build/runtime-benchmark/mc1_21_1-fabric 900

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-mc1_21_1-fabric
          path: |
            build/runtime-benchmark/mc1_21_1-fabric
            platform/fabric/run/mc1_21_1/logs/latest.log
            platform/fabric/run/mc1_21_1/logs/packforge-smoke-gradle.log
          if-no-files-found: warn
