name: Publish to Modrinth

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Base PackForge version from gradle.properties
        required: true
        default: "1.3.4"
      changelog:
        description: Release notes shown on Modrinth
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build all supported artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate requested version
        shell: bash
        run: |
          configured_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$configured_version" != "${{ inputs.release_version }}" ]]; then
            echo "Requested version ${{ inputs.release_version }} does not match gradle.properties ($configured_version)."
            exit 1
          fi

      - name: Restore Gradle and Mavenizer caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            platform/forge/.gradle/mavenizer
          key: packforge-publish-${{ runner.os }}-all-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            packforge-publish-${{ runner.os }}-all-

      - name: Build, test, and verify all artifacts
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew buildAllSupported verifyAllArtifacts --no-daemon --stacktrace; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Build failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Build attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Write exact release SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name 'packforge-*.jar' -printf '%f\n' | sort)
          if [[ "${#artifacts[@]}" -ne 17 ]]; then
            echo "Expected exactly 17 release artifacts, found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          (
            cd build/libs
            sha256sum "${artifacts[@]}" > SHA256SUMS
          )
          checksum_count="$(wc -l < build/libs/SHA256SUMS)"
          if [[ "$checksum_count" -ne 17 ]]; then
            echo "Expected 17 checksum rows, found $checksum_count."
            exit 1
          fi

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packforge-all-supported
          path: |
            build/libs/packforge-*.jar
            build/libs/SHA256SUMS
          if-no-files-found: error

  runtime-smoke:
    name: Runtime smoke ${{ matrix.target }} / ${{ matrix.platform }} / ${{ matrix.forge_version || 'registry' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: mc26_1_to_26_2, platform: fabric }
          - { target: mc26_1_to_26_2, platform: forge }
          - { target: mc26_1_to_26_2, platform: neoforge }
          - { target: mc1_21_1, platform: fabric }
          - { target: mc1_21_1, platform: forge }
          - { target: mc1_21_1, platform: neoforge }
          - { target: mc1_21_4, platform: fabric }
          - { target: mc1_21_4, platform: forge }
          - { target: mc1_21_4, platform: neoforge }
          - { target: mc1_21_8, platform: fabric }
          - { target: mc1_21_8, platform: forge }
          - { target: mc1_21_8, platform: neoforge }
          - { target: mc1_21_11, platform: fabric }
          - { target: mc1_21_11, platform: forge }
          - { target: mc1_21_11, platform: neoforge }
          - { target: mc1_20_1, platform: fabric }
          - { target: mc1_20_1, platform: forge }
          - { target: mc1_20_1, platform: forge, forge_version: "1.20.1-47.4.22" }

    steps:
      - uses: actions/checkout@v4

      - name: Download verified artifact bundle
        uses: actions/download-artifact@v4
        with:
          name: packforge-all-supported
          path: build/libs

      - name: Verify exact release SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/SHA256SUMS
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name 'packforge-*.jar' -printf '%f\n' | sort)
          if [[ "${#artifacts[@]}" -ne 17 ]]; then
            echo "Expected exactly 17 downloaded artifacts, found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          (
            cd build/libs
            sha256sum -c SHA256SUMS
          )

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install virtual display controls
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool openbox

      - name: Restore target-scoped runtime cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            platform/forge/.gradle/mavenizer
          key: packforge-publish-smoke-${{ runner.os }}-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.forge_version || 'registry' }}-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            packforge-publish-smoke-${{ runner.os }}-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.forge_version || 'registry' }}-

      - name: Run loader smoke (packaged official-mapped NeoForge/mc26 Fabric; source legacy Fabric/all Forge; exact legacy Fabric final-JAR acceptance via production harness)
        env:
          PACKFORGE_FORGE_VERSION_OVERRIDE: ${{ matrix.forge_version }}
          PACKFORGE_ARTIFACT_SMOKE: ${{ matrix.platform == 'neoforge' || (matrix.platform == 'fabric' && matrix.target == 'mc26_1_to_26_2') }}
          PACKFORGE_ARTIFACT_INPUT_DIR: build/libs
        run: |
          # Packaged smoke is limited to official-mapped NeoForge and mc26 Fabric.
          # Legacy Fabric and all Forge use source mode here; exact legacy Fabric
          # final-JAR acceptance uses the production harness.
          chmod +x gradlew scripts/smoke-client.sh
          ./scripts/smoke-client.sh "${{ matrix.platform }}" "${{ matrix.target }}" 900

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-smoke-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.forge_version || 'registry' }}
          path: |
            platform/${{ matrix.platform }}/run/${{ matrix.target }}/logs/latest.log
            platform/${{ matrix.platform }}/run/${{ matrix.target }}/logs/packforge-smoke-gradle.log
          if-no-files-found: warn

  publish:
    name: Publish ${{ matrix.loader }} ${{ matrix.minecraft }} (${{ matrix.release_type }})
    needs: [build, runtime-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - { loader: fabric, minecraft: 26.1-26.2, versions: "26.1\n26.1.1\n26.1.2\n26.2", version_suffix: "", release_type: release, featured: "true" }
          - { loader: forge, minecraft: 26.1-26.2, versions: "26.1\n26.1.1\n26.1.2\n26.2", version_suffix: "", release_type: release, featured: "true" }
          - { loader: neoforge, minecraft: 26.1-26.2, versions: "26.1\n26.1.1\n26.1.2\n26.2", version_suffix: "", release_type: release, featured: "true" }
          - { loader: fabric, minecraft: 1.21.11, versions: "1.21.11", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: forge, minecraft: 1.21.11, versions: "1.21.11", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: neoforge, minecraft: 1.21.11, versions: "1.21.11", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: fabric, minecraft: 1.21.8, versions: "1.21.8", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: forge, minecraft: 1.21.8, versions: "1.21.8", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: neoforge, minecraft: 1.21.8, versions: "1.21.8", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: fabric, minecraft: 1.21.4, versions: "1.21.4", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: forge, minecraft: 1.21.4, versions: "1.21.4", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: neoforge, minecraft: 1.21.4, versions: "1.21.4", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: fabric, minecraft: 1.21.1, versions: "1.21.1", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: forge, minecraft: 1.21.1, versions: "1.21.1", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: neoforge, minecraft: 1.21.1, versions: "1.21.1", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: fabric, minecraft: 1.20.1, versions: "1.20.1", version_suffix: "-beta.2", release_type: beta, featured: "false" }
          - { loader: forge, minecraft: 1.20.1, versions: "1.20.1", version_suffix: "-beta.2", release_type: beta, featured: "false" }

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: packforge-all-supported
          path: build/libs

      - name: Verify downloaded release SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/SHA256SUMS
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name 'packforge-*.jar' -printf '%f\n' | sort)
          if [[ "${#artifacts[@]}" -ne 17 ]]; then
            echo "Expected exactly 17 downloaded artifacts, found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          (
            cd build/libs
            sha256sum -c SHA256SUMS
          )

      - name: Prepare Modrinth version metadata
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          VERSION_SUFFIX: ${{ matrix.version_suffix }}
          RELEASE_TYPE: ${{ matrix.release_type }}
          FEATURED: ${{ matrix.featured }}
          LOADER: ${{ matrix.loader }}
          MINECRAFT_ARTIFACT: ${{ matrix.minecraft }}
          GAME_VERSIONS: ${{ matrix.versions }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          version="${RELEASE_VERSION}${VERSION_SUFFIX}"
          file="build/libs/packforge-${LOADER}-${version}-mc${MINECRAFT_ARTIFACT}.jar"
          if [[ ! -f "$file" ]]; then
            echo "Expected artifact not found: $file"
            find build/libs -maxdepth 1 -type f -print
            exit 1
          fi

          export PUBLISH_VERSION="$version"
          export PUBLISH_ARTIFACT="$file"
          python - <<'PY'
          import json
          import os
          import zipfile

          version = os.environ["PUBLISH_VERSION"]
          dependencies = []
          if os.environ["LOADER"] == "fabric":
              with zipfile.ZipFile(os.environ["PUBLISH_ARTIFACT"]) as artifact:
                  fabric_metadata = json.loads(artifact.read("fabric.mod.json"))

              required_mods = set(fabric_metadata.get("depends", {})) - {
                  "fabricloader",
                  "minecraft",
                  "java",
              }
              unsupported_required = required_mods - {"fabric-api"}
              if unsupported_required:
                  raise SystemExit(
                      "Unmapped required Fabric dependencies: "
                      + ", ".join(sorted(unsupported_required))
                  )
              if "fabric-api" in required_mods:
                  dependencies.append({
                      "project_id": "P7dR8mSH",
                      "dependency_type": "required",
                  })

              suggested_mods = set(fabric_metadata.get("suggests", {}))
              unsupported_suggested = suggested_mods - {"modmenu"}
              if unsupported_suggested:
                  raise SystemExit(
                      "Unmapped optional Fabric dependencies: "
                      + ", ".join(sorted(unsupported_suggested))
                  )
              if "modmenu" in suggested_mods:
                  dependencies.append({
                      "project_id": "mOgUt4GM",
                      "dependency_type": "optional",
                  })

          metadata = {
              "name": f"PackForge - Optimized Resource Pack Loading Time {version}",
              "version_number": version,
              "changelog": os.environ["CHANGELOG"],
              "dependencies": dependencies,
              "game_versions": os.environ["GAME_VERSIONS"].splitlines(),
              "version_type": os.environ["RELEASE_TYPE"],
              "loaders": [os.environ["LOADER"]],
              "featured": os.environ["FEATURED"] == "true",
              "status": "listed",
              "project_id": "NimDX7iQ",
              "file_parts": ["artifact"],
              "primary_file": "artifact",
              "environment": "client_only",
          }
          with open("modrinth-version.json", "w", encoding="utf-8") as output:
              json.dump(metadata, output, ensure_ascii=False)
          PY

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Check for an existing identical version
        id: existing
        shell: bash
        env:
          ARTIFACT_FILE: ${{ steps.release.outputs.file }}
          PUBLISH_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TYPE: ${{ matrix.release_type }}
          FEATURED: ${{ matrix.featured }}
          LOADER: ${{ matrix.loader }}
          GAME_VERSIONS: ${{ matrix.versions }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          artifact = pathlib.Path(os.environ["ARTIFACT_FILE"])
          request = urllib.request.Request(
              "https://api.modrinth.com/v2/project/NimDX7iQ/version",
              headers={"User-Agent": "Teenkung123/PackForge-GitHub-Actions/1.0"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              versions = json.load(response)

          matches = []
          for version in versions:
              for remote_file in version.get("files", []):
                  if remote_file.get("filename") == artifact.name:
                      matches.append((version, remote_file))

          if len(matches) > 1:
              raise SystemExit(f"Multiple existing Modrinth versions contain {artifact.name}")

          found = bool(matches)
          if found:
              version, remote_file = matches[0]
              digest = hashlib.sha512(artifact.read_bytes()).hexdigest()
              expected_games = set(os.environ["GAME_VERSIONS"].splitlines())
              expected_changelog = os.environ["CHANGELOG"].replace("\r\n", "\n").strip()
              actual_changelog = (version.get("changelog") or "").replace("\r\n", "\n").strip()
              checks = {
                  "SHA-512": remote_file.get("hashes", {}).get("sha512") == digest,
                  "version number": version.get("version_number") == os.environ["PUBLISH_VERSION"],
                  "release type": version.get("version_type") == os.environ["RELEASE_TYPE"],
                  "featured flag": version.get("featured") == (os.environ["FEATURED"] == "true"),
                  "loader": set(version.get("loaders", [])) == {os.environ["LOADER"]},
                  "game versions": set(version.get("game_versions", [])) == expected_games,
                  "changelog": actual_changelog == expected_changelog,
              }
              failures = [name for name, passed in checks.items() if not passed]
              if failures:
                  raise SystemExit(
                      f"Existing {artifact.name} differs in: {', '.join(failures)}"
                  )
              print(f"Identical Modrinth version already exists: {version['id']}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"found={'true' if found else 'false'}\n")
          PY

      - name: Publish through the Modrinth API
        if: steps.existing.outputs.found != 'true'
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          ARTIFACT_FILE: ${{ steps.release.outputs.file }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "The MODRINTH_TOKEN repository secret is not configured."
            exit 1
          fi

          http_status="$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --output modrinth-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "User-Agent: Teenkung123/PackForge-GitHub-Actions/1.0" \
            --form 'data=@modrinth-version.json;type=application/json' \
            --form "artifact=@${ARTIFACT_FILE};type=application/java-archive" \
            'https://api.modrinth.com/v2/version')"

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "Modrinth API returned HTTP $http_status:"
            python -m json.tool modrinth-response.json || sed -n '1,120p' modrinth-response.json
            exit 1
          fi

          python - <<'PY'
          import json

          with open("modrinth-response.json", encoding="utf-8") as response_file:
              response = json.load(response_file)
          files = ", ".join(file["filename"] for file in response.get("files", []))
          print(f"Published Modrinth version {response['id']}: {files}")
          PY
