name: Publish to Modrinth

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Base PackForge version from gradle.properties
        required: true
        default: "1.4"
      changelog:
        description: Release notes shown on Modrinth
        required: true
        type: string
      publish_confirmation:
        description: Set true only after reviewing the generated release manifest and approving publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release_matrix:
    name: Derive registry release matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      publish_matrix: ${{ steps.matrix.outputs.publish_matrix }}
      runtime_matrix: ${{ steps.matrix.outputs.runtime_matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Read canonical registry matrix
        id: matrix
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          configured_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$configured_version" != "$RELEASE_VERSION" ]]; then
            echo "Requested version $RELEASE_VERSION does not match gradle.properties ($configured_version)."
            exit 1
          fi
          publish_matrix="$(python scripts/prepare-modrinth-release.py --release-version "$RELEASE_VERSION" --matrix publish)"
          runtime_matrix="$(python scripts/prepare-modrinth-release.py --release-version "$RELEASE_VERSION" --matrix runtime)"
          printf 'publish_matrix=%s\n' "$publish_matrix" >> "$GITHUB_OUTPUT"
          printf 'runtime_matrix=%s\n' "$runtime_matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build all supported artifacts
    needs: release_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate requested version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          configured_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$configured_version" != "$RELEASE_VERSION" ]]; then
            echo "Requested version $RELEASE_VERSION does not match gradle.properties ($configured_version)."
            exit 1
          fi

      - name: Restore Gradle and Mavenizer caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/nodes/forge/*/minecraftforge/forgegradle/mavenizer
          key: packforge-nodes-v1-publish-${{ runner.os }}-all-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle') }}
          restore-keys: |
            packforge-nodes-v1-publish-${{ runner.os }}-all-

      - name: Build, test, and verify all artifacts
        run: |
          python -m unittest discover -s scripts -p 'test_prepare_modrinth_release.py' -v
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew buildAllSupported --no-daemon --stacktrace; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Build failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Build attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Validate registry-derived release manifest and size gates
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: python scripts/prepare-modrinth-release.py --check --release-version "$RELEASE_VERSION" --changelog "$CHANGELOG" --write-preview build/release-preview

      - name: Write exact release SHA256SUMS
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name 'packforge-*.jar' -printf '%f\n' | sort)
          expected_count="$(python scripts/prepare-modrinth-release.py --release-version "$RELEASE_VERSION" --count-only)"
          if [[ "${#artifacts[@]}" -ne "$expected_count" ]]; then
            echo "Expected exactly $expected_count registry-derived release artifacts, found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          (
            cd build/libs
            sha256sum "${artifacts[@]}" > SHA256SUMS
          )
          checksum_count="$(wc -l < build/libs/SHA256SUMS)"
          if [[ "$checksum_count" -ne "$expected_count" ]]; then
            echo "Expected $expected_count registry-derived checksum rows, found $checksum_count."
            exit 1
          fi

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packforge-all-supported
          path: |
            build/libs/packforge-*.jar
            build/libs/SHA256SUMS
          if-no-files-found: error

      - name: Upload release preview
        uses: actions/upload-artifact@v4
        with:
          name: packforge-release-preview
          path: |
            build/release-preview/modrinth-release-manifest.json
            build/release-preview/modrinth-release-plan.md
          if-no-files-found: error

  runtime-smoke:
    name: Runtime smoke ${{ matrix.target }} / ${{ matrix.platform }} / ${{ matrix.runtime_label }}
    needs: [release_matrix, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release_matrix.outputs.runtime_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download verified artifact bundle
        uses: actions/download-artifact@v4
        with:
          name: packforge-all-supported
          path: build/libs

      - name: Verify exact release SHA256SUMS
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          test -f build/libs/SHA256SUMS
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name 'packforge-*.jar' -printf '%f\n' | sort)
          expected_count="$(python scripts/prepare-modrinth-release.py --release-version "$RELEASE_VERSION" --count-only)"
          if [[ "${#artifacts[@]}" -ne "$expected_count" ]]; then
            echo "Expected exactly $expected_count registry-derived downloaded artifacts, found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          (
            cd build/libs
            sha256sum -c SHA256SUMS
          )

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore target-scoped runtime cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/nodes/forge/*/minecraftforge/forgegradle/mavenizer
          key: packforge-nodes-v1-publish-smoke-${{ runner.os }}-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.runtime_label }}-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle') }}
          restore-keys: |
            packforge-nodes-v1-publish-smoke-${{ runner.os }}-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.runtime_label }}-

      - name: Run loader smoke (packaged official-mapped NeoForge/mc26 Fabric; source legacy Fabric/all Forge; exact legacy Fabric final-JAR acceptance via production harness)
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
          RUNTIME_TARGET: ${{ matrix.target }}
          RUNTIME_TIMEOUT: "900"
          PACKFORGE_FORGE_VERSION_OVERRIDE: ${{ matrix.forge_version }}
          PACKFORGE_MINECRAFT_VERSION_OVERRIDE: ${{ matrix.minecraft_version }}
          PACKFORGE_NEOFORGE_VERSION_OVERRIDE: ${{ matrix.neoforge_version }}
          PACKFORGE_ARTIFACT_SMOKE: ${{ matrix.artifact_smoke }}
          PACKFORGE_ARTIFACT_INPUT_DIR: build/libs
        run: |
          # Packaged smoke is limited to official-mapped NeoForge and mc26 Fabric.
          # Legacy Fabric and all Forge use source mode here; exact legacy Fabric
          # final-JAR acceptance uses the production harness.
          chmod +x gradlew scripts/smoke-client.sh
          ./scripts/smoke-client.sh "$RUNTIME_PLATFORM" "$RUNTIME_TARGET" "$RUNTIME_TIMEOUT"

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-smoke-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.runtime_label }}
          path: |
            platform/${{ matrix.platform }}/run/${{ matrix.target }}/logs/latest.log
            platform/${{ matrix.platform }}/run/${{ matrix.target }}/logs/packforge-smoke-gradle.log
          if-no-files-found: warn

  benchmark:
    name: 1.21.1 Fabric release benchmark
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore benchmark cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: packforge-nodes-v1-publish-benchmark-${{ runner.os }}-mc1_21_1-fabric-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle') }}
          restore-keys: |
            packforge-nodes-v1-publish-benchmark-${{ runner.os }}-mc1_21_1-fabric-

      - name: Enforce warm, cold, and resource-equivalence gates
        run: |
          chmod +x gradlew scripts/smoke-client.sh scripts/benchmark-client.sh
          ./scripts/benchmark-client.sh fabric mc1_21_1 build/runtime-benchmark/mc1_21_1-fabric 900

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-benchmark-mc1_21_1-fabric
          path: |
            build/runtime-benchmark/mc1_21_1-fabric
            platform/fabric/run/mc1_21_1/logs/latest.log
            platform/fabric/run/mc1_21_1/logs/packforge-smoke-gradle.log
          if-no-files-found: warn

  publish:
    name: Publish ${{ matrix.loader }} ${{ matrix.minecraft }} (${{ matrix.release_type }})
    if: ${{ inputs.publish_confirmation == true }}
    needs: [release_matrix, build, runtime-smoke, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.release_matrix.outputs.publish_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: packforge-all-supported
          path: build/libs

      - name: Verify downloaded release SHA256SUMS
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          test -f build/libs/SHA256SUMS
          mapfile -t artifacts < <(find build/libs -maxdepth 1 -type f -name 'packforge-*.jar' -printf '%f\n' | sort)
          expected_count="$(python scripts/prepare-modrinth-release.py --release-version "$RELEASE_VERSION" --count-only)"
          if [[ "${#artifacts[@]}" -ne "$expected_count" ]]; then
            echo "Expected exactly $expected_count registry-derived downloaded artifacts, found ${#artifacts[@]}."
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
          (
            cd build/libs
            sha256sum -c SHA256SUMS
          )

      - name: Prepare Modrinth version metadata
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          VERSION_SUFFIX: ${{ matrix.version_suffix }}
          LOADER: ${{ matrix.loader }}
          MINECRAFT_ARTIFACT: ${{ matrix.minecraft }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}${VERSION_SUFFIX}"
          file="build/libs/packforge-${LOADER}-${version}-mc${MINECRAFT_ARTIFACT}.jar"
          if [[ ! -f "$file" ]]; then
            echo "Expected artifact not found: $file"
            find build/libs -maxdepth 1 -type f -print
            exit 1
          fi

          python scripts/prepare-modrinth-release.py \
            --release-version "$RELEASE_VERSION" \
            --artifact "$file" \
            --write-payload modrinth-version.json \
            --changelog "$CHANGELOG"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Check for an existing identical version
        id: existing
        shell: bash
        env:
          ARTIFACT_FILE: ${{ steps.release.outputs.file }}
          PAYLOAD_FILE: modrinth-version.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          artifact = pathlib.Path(os.environ["ARTIFACT_FILE"])
          with open(os.environ["PAYLOAD_FILE"], encoding="utf-8") as payload_file:
              expected = json.load(payload_file)
          request = urllib.request.Request(
              "https://api.modrinth.com/v2/project/NimDX7iQ/version",
              headers={"User-Agent": "Teenkung123/PackForge-GitHub-Actions/1.0"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              versions = json.load(response)

          matches = []
          for version in versions:
              for remote_file in version.get("files", []):
                  if remote_file.get("filename") == artifact.name:
                      matches.append((version, remote_file))

          if len(matches) > 1:
              raise SystemExit(f"Multiple existing Modrinth versions contain {artifact.name}")

          found = bool(matches)
          if found:
              version, remote_file = matches[0]
              artifact_bytes = artifact.read_bytes()
              expected_changelog = (expected.get("changelog") or "").replace("\r\n", "\n").strip()
              actual_changelog = (version.get("changelog") or "").replace("\r\n", "\n").strip()
              checks = {
                  "name": version.get("name") == expected.get("name"),
                  "version number": version.get("version_number") == expected.get("version_number"),
                  "dependencies": version.get("dependencies", []) == expected.get("dependencies", []),
                  "release type": version.get("version_type") == expected.get("version_type"),
                  "featured flag": version.get("featured") == expected.get("featured"),
                  "loader": version.get("loaders", []) == expected.get("loaders", []),
                  "game versions": set(version.get("game_versions", [])) == set(expected.get("game_versions", [])),
                  "status": version.get("status") == expected.get("status"),
                  "project": version.get("project_id") == expected.get("project_id"),
                  "environment": version.get("environment") == expected.get("environment"),
                  "primary file": version.get("primary_file") == expected.get("primary_file"),
                  "changelog": actual_changelog == expected_changelog,
                  "filename": remote_file.get("filename") == artifact.name,
                  "size": remote_file.get("size") == len(artifact_bytes),
                  "SHA-1": remote_file.get("hashes", {}).get("sha1") == hashlib.sha1(artifact_bytes).hexdigest(),
                  "SHA-512": remote_file.get("hashes", {}).get("sha512") == hashlib.sha512(artifact_bytes).hexdigest(),
              }
              failures = [name for name, passed in checks.items() if not passed]
              if failures:
                  raise SystemExit(
                      f"Existing {artifact.name} differs in: {', '.join(failures)}"
                  )
              print(f"Identical Modrinth version already exists: {version['id']}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"found={'true' if found else 'false'}\n")
          PY

      - name: Publish through the Modrinth API
        if: steps.existing.outputs.found != 'true'
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          ARTIFACT_FILE: ${{ steps.release.outputs.file }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "The MODRINTH_TOKEN repository secret is not configured."
            exit 1
          fi

          http_status="$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --output modrinth-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "User-Agent: Teenkung123/PackForge-GitHub-Actions/1.0" \
            --form 'data=@modrinth-version.json;type=application/json' \
            --form "artifact=@${ARTIFACT_FILE};type=application/java-archive" \
            'https://api.modrinth.com/v2/version')"

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "Modrinth API returned HTTP $http_status:"
            python -m json.tool modrinth-response.json || sed -n '1,120p' modrinth-response.json
            exit 1
          fi

          python - <<'PY'
          import json

          with open("modrinth-response.json", encoding="utf-8") as response_file:
              response = json.load(response_file)
          files = ", ".join(file["filename"] for file in response.get("files", []))
          print(f"Published Modrinth version {response['id']}: {files}")
          PY
