name: Publish to Modrinth

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Base PackForge version from gradle.properties
        required: true
        default: "1.3.2"
      changelog:
        description: Release notes shown on Modrinth
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build stable 26.1-26.2 artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate requested version
        shell: bash
        run: |
          configured_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$configured_version" != "${{ inputs.release_version }}" ]]; then
            echo "Requested version ${{ inputs.release_version }} does not match gradle.properties ($configured_version)."
            exit 1
          fi

      - name: Restore target-scoped Gradle and Mavenizer caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            platform/forge/.gradle/mavenizer
          key: packforge-publish-${{ runner.os }}-mc26_1_to_26_2-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            packforge-publish-${{ runner.os }}-mc26_1_to_26_2-

      - name: Build, test, and verify target artifacts
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew buildTarget -Ppackforge_target=mc26_1_to_26_2 --no-daemon --stacktrace; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Build failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Build attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packforge-mc26_1_to_26_2
          path: build/libs/packforge-*.jar
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.loader }} ${{ matrix.minecraft }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - { loader: fabric, minecraft: 26.1-26.2, versions: "26.1\n26.1.1\n26.1.2\n26.2" }
          - { loader: forge, minecraft: 26.1-26.2, versions: "26.1\n26.1.1\n26.1.2\n26.2" }
          - { loader: neoforge, minecraft: 26.1-26.2, versions: "26.1\n26.1.1\n26.1.2\n26.2" }

    steps:
      - name: Download stable artifacts
        uses: actions/download-artifact@v4
        with:
          name: packforge-mc26_1_to_26_2
          path: build/libs

      - name: Prepare Modrinth version metadata
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          LOADER: ${{ matrix.loader }}
          MINECRAFT_ARTIFACT: ${{ matrix.minecraft }}
          GAME_VERSIONS: ${{ matrix.versions }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          version="$RELEASE_VERSION"
          file="build/libs/packforge-${LOADER}-${version}-mc${MINECRAFT_ARTIFACT}.jar"
          if [[ ! -f "$file" ]]; then
            echo "Expected artifact not found: $file"
            find build/libs -maxdepth 1 -type f -print
            exit 1
          fi

          export PUBLISH_VERSION="$version"
          python - <<'PY'
          import json
          import os

          version = os.environ["PUBLISH_VERSION"]
          metadata = {
              "name": f"PackForge - Optimized Resource Pack Loading Time {version}",
              "version_number": version,
              "changelog": os.environ["CHANGELOG"],
              "dependencies": [],
              "game_versions": os.environ["GAME_VERSIONS"].splitlines(),
              "version_type": "release",
              "loaders": [os.environ["LOADER"]],
              "featured": True,
              "status": "listed",
              "project_id": "NimDX7iQ",
              "file_parts": ["artifact"],
              "primary_file": "artifact",
              "environment": "client_only",
          }
          with open("modrinth-version.json", "w", encoding="utf-8") as output:
              json.dump(metadata, output, ensure_ascii=False)
          PY

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Publish through the Modrinth API
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          ARTIFACT_FILE: ${{ steps.release.outputs.file }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "The MODRINTH_TOKEN repository secret is not configured."
            exit 1
          fi

          http_status="$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --output modrinth-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "User-Agent: Teenkung123/PackForge-GitHub-Actions/1.0" \
            --form 'data=@modrinth-version.json;type=application/json' \
            --form "artifact=@${ARTIFACT_FILE};type=application/java-archive" \
            'https://api.modrinth.com/v2/version')"

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "Modrinth API returned HTTP $http_status:"
            python -m json.tool modrinth-response.json || sed -n '1,120p' modrinth-response.json
            exit 1
          fi

          python - <<'PY'
          import json

          with open("modrinth-response.json", encoding="utf-8") as response_file:
              response = json.load(response_file)
          files = ", ".join(file["filename"] for file in response.get("files", []))
          print(f"Published Modrinth version {response['id']}: {files}")
          PY
