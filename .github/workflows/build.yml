name: Build supported targets

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry_matrix:
    name: Derive registry target matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      target_matrix: ${{ steps.matrix.outputs.target_matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate release tooling and derive targets
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_prepare_modrinth_release.py' -v
          target_matrix="$(python scripts/prepare-modrinth-release.py --matrix targets)"
          printf 'target_matrix=%s\n' "$target_matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: registry_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.registry_matrix.outputs.target_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Restore target-scoped Gradle and Mavenizer caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/nodes/forge/*/minecraftforge/forgegradle/mavenizer
          key: packforge-nodes-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle') }}
          restore-keys: |
            packforge-nodes-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Build, test, and verify exact artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew :buildTarget -Ppackforge_target="$TARGET" --configure-on-demand --no-daemon --stacktrace; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Build failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Build attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packforge-${{ matrix.target }}
          path: build/libs/packforge-*.jar
          if-no-files-found: error

  windows-handle-unit:
    name: Windows ZIP handle release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Run close, rename, and delete test on Windows
        shell: pwsh
        run: .\gradlew.bat :common:test --tests com.teenkung.packforge.loader.ZipReadPoolTest --configure-on-demand --no-daemon --stacktrace
