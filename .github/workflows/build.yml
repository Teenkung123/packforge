name: Build supported targets

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - mc26_1_to_26_2
          - mc1_21_1
          - mc1_21_4
          - mc1_21_8
          - mc1_21_11
          - mc1_20_1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Restore target-scoped Gradle and Mavenizer caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            platform/forge/.gradle/mavenizer
          key: packforge-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('gradle/minecraft-targets.json', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            packforge-${{ runner.os }}-${{ matrix.target }}-

      - name: Build, test, and verify exact artifacts
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew buildTarget -Ppackforge_target=${{ matrix.target }} --no-daemon --stacktrace; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Build failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Build attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packforge-${{ matrix.target }}
          path: build/libs/packforge-*.jar
          if-no-files-found: error

  windows-handle-unit:
    name: Windows ZIP handle release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Run close, rename, and delete test on Windows
        shell: pwsh
        run: .\gradlew.bat -p platform/fabric -Ppackforge_target=mc1_21_1 test --tests com.teenkung.packforge.loader.ZipReadPoolTest --no-daemon --stacktrace
