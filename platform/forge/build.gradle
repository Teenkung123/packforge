plugins {
	id "java"
	id "net.minecraftforge.gradle" version "7.0.25"
	id "net.minecraftforge.jarjar" version "0.2.3"
	id "net.minecraftforge.renamer" version "1.1.5"
}

ext.packforgePlatformId = "forge"
apply from: "../../gradle/packforge-target.gradle"

version = packforgeModVersion
group = packforgeMavenGroup

def target = packforgeTarget
def loaderConfig = packforgePlatform
def javaTarget = target.javaVersion as int
def mainMixinConfig = target.mixinConfigs.main.toString()
def clientMixinConfig = target.mixinConfigs.client.toString()
def needsLegacyRuntimeRemap = target.minecraftVersion == "1.20.1"
def needsLegacyJoptSimpleModule = target.key in ["mc1_21_1", "mc1_21_4"]
def legacyMixinRefmap = "packforge.refmap.json"
def artifactSmoke = providers.gradleProperty("packforge_artifact_smoke").map(Boolean::parseBoolean).orElse(false).get()
if (artifactSmoke) {
	throw new GradleException("Forge production artifacts use SRG names and cannot run in ForgeGradle's Mojmap userdev namespace. Use scripts/Smoke-Forge-Production.ps1 for final-JAR validation.")
}
def forgeRuntimeVersionOverride = providers.gradleProperty("packforge_forge_version_override").orNull
def forgeDependencyVersion = forgeRuntimeVersionOverride ?: loaderConfig.version.toString()

layout.buildDirectory.set(file("build/${target.key}"))

jarJar.register()

base {
	archivesName = "packforge"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaTarget)
	}
	sourceCompatibility = JavaVersion.toVersion(javaTarget)
	targetCompatibility = JavaVersion.toVersion(javaTarget)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaTarget
	options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

tasks.register("benchmarkPackIndex", JavaExec) {
	group = "verification"
	description = "Runs the deterministic, non-gating PackIndex microbenchmark."
	dependsOn tasks.named("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.teenkung.packforge.loader.PackIndexBenchmark"
	args layout.buildDirectory.dir("benchmark").get().asFile.absolutePath,
		java.util.Base64.encoder.encodeToString(groovy.json.JsonOutput.toJson(packforgeBuildPackMetadata(true)).getBytes("UTF-8"))
}

minecraft {
	mappings channel: "official", version: target.minecraftVersion
	dependency "net.minecraftforge:forge:${forgeDependencyVersion}"

	runs {
		client {
			workingDir = file("run/${target.key}")
			client = true
			if (!needsLegacyRuntimeRemap) {
				args "--mixin.config=${mainMixinConfig}", "--mixin.config=${clientMixinConfig}"
			}
			systemProperties = [
				"forge.logging.console.level": "debug"
			]

			mods {
				packforge {
					source sourceSets.main
				}
			}
		}
	}
}

repositories {
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	minecraft.mavenizer(repositories)
	mavenCentral()
}

def mainJavaDirs = [
	new File(packforgeCommonRoot, "src/main/java"),
	new File(packforgeCommonRoot, "src/client/java"),
	new File(packforgeAdapterCommonRoot, "src/main/java"),
	new File(packforgeAdapterCommonRoot, "src/client/java"),
	file("src/main/java"),
	file("src/client/java"),
	new File(packforgeAdapterPlatformRoot, "src/main/java"),
	new File(packforgeAdapterPlatformRoot, "src/client/java")
]
if (target.key in ["mc1_20_5", "mc1_20_6"]) {
	mainJavaDirs.add(2, new File(packforgeRepositoryRoot, "versions/${target.sourceFamily}/common/src/client/java"))
}
if (target.key in ["mc1_20_5", "mc1_20_6", "mc1_21_1", "mc1_21_4", "mc1_21_8"]) {
	mainJavaDirs.add(2, new File(packforgeRepositoryRoot, "versions/mc1_21_shared/common/src/client/java"))
}
if (target.key in ["mc1_20_5", "mc1_20_6", "mc1_21_1", "mc1_21_4", "mc1_21_8"]) {
	mainJavaDirs.add(1, new File(packforgeRepositoryRoot, "versions/mc1_21_shared/common/src/main/java"))
}
def mainJavaSources = mainJavaDirs.collect { root ->
	if (target.key in ["mc1_20_2", "mc1_20_3", "mc1_20_4"] && root.canonicalFile.toPath().startsWith(packforgeAdapterCommonRoot.canonicalFile.toPath())) {
		return fileTree(root) {
			exclude "com/teenkung/packforge/mixin/loader/FilePackResourcesMixin.java"
			exclude "com/teenkung/packforge/mixin/observe/ReloadableResourceManagerMixin.java"
			exclude "com/teenkung/packforge/client/atlas/BoundedSpriteDecode.java"
			exclude "com/teenkung/packforge/client/mixin/atlas/SpriteLoaderMixin.java"
		}
	}
	if (target.key in ["mc1_20_5", "mc1_20_6"] && root.canonicalFile.toPath().startsWith(packforgeAdapterCommonRoot.canonicalFile.toPath())) {
		return fileTree(root) {
			exclude "com/teenkung/packforge/client/mixin/config/PackSelectionScreenMixin.java"
		}
	}
	if (target.key in ["mc1_20_5", "mc1_20_6"] && root.canonicalFile.toPath().startsWith(file("${packforgeRepositoryRoot}/versions/mc1_21_shared/common/src/client/java").canonicalFile.toPath())) {
		return fileTree(root) {
			exclude "com/teenkung/packforge/client/mixin/config/PackSelectionScreenMixin.java"
		}
	}
	return fileTree(root)
}
if (target.key in ["mc1_20_2", "mc1_20_3", "mc1_20_4"]) {
	def sharedRoot = new File(packforgeRepositoryRoot, "versions/mc1_21_shared/common/src/main/java")
	mainJavaSources.add(fileTree(sharedRoot) {
		include "com/teenkung/packforge/mixin/loader/FilePackResourcesMixin.java"
		include "com/teenkung/packforge/mixin/loader/SharedZipFileAccessMixin.java"
		include "com/teenkung/packforge/mixin/observe/ReloadableResourceManagerMixin.java"
	})
	def sharedClientRoot = new File(packforgeRepositoryRoot, "versions/mc1_21_shared/common/src/client/java")
	mainJavaSources.add(fileTree(sharedClientRoot) {
		include "com/teenkung/packforge/client/atlas/BoundedSpriteDecode.java"
		include "com/teenkung/packforge/client/mixin/atlas/SpriteLoaderMixin.java"
	})
	def targetRoot = new File(packforgeRepositoryRoot, "versions/${target.sourceFamily}/common/src/main/java")
	mainJavaSources.add(fileTree(targetRoot) {
		include "com/teenkung/packforge/mixin/loader/FilePackResourcesArchiveMixin.java"
	})
}
def mainResourceDirs = [
	new File(packforgeCommonRoot, "src/main/resources"),
	new File(packforgeCommonRoot, "src/client/resources"),
	new File(packforgeAdapterCommonRoot, "src/main/resources"),
	new File(packforgeAdapterCommonRoot, "src/client/resources"),
	file("src/main/resources"),
	file("src/client/resources"),
	new File(packforgeAdapterPlatformRoot, "src/main/resources"),
	new File(packforgeAdapterPlatformRoot, "src/client/resources")
]
if (target.key in ["mc1_20_2", "mc1_20_3", "mc1_20_4"]) {
	mainResourceDirs.add(2, new File(packforgeRepositoryRoot, "versions/${target.sourceFamily}/common/src/main/resources"))
}
if (target.key in ["mc1_20_5", "mc1_20_6"]) {
	mainResourceDirs.add(2, new File(packforgeRepositoryRoot, "versions/${target.sourceFamily}/common/src/main/resources"))
}
def testJavaDirs = [
	new File(packforgeCommonRoot, "src/test/java"),
	new File(packforgeAdapterCommonRoot, "src/test/java"),
	file("src/test/java"),
	new File(packforgeAdapterPlatformRoot, "src/test/java")
]
def testResourceDirs = [
	new File(packforgeCommonRoot, "src/test/resources"),
	new File(packforgeAdapterCommonRoot, "src/test/resources"),
	file("src/test/resources"),
	new File(packforgeAdapterPlatformRoot, "src/test/resources")
]
def testJavaSources = testJavaDirs.collect { root ->
	if (target.key in ["mc1_20_5", "mc1_20_6"] && root.canonicalFile.toPath().startsWith(packforgeAdapterPlatformRoot.canonicalFile.toPath())) {
		return fileTree(root) {
			exclude "com/teenkung/packforge/client/font/FontBitmapProviderCacheTest.java"
			exclude "com/teenkung/packforge/client/font/FontSelectionRegistryTest.java"
		}
	}
	return fileTree(root)
}

sourceSets {
	main {
		java.setSrcDirs(target.key in ["mc1_20_2", "mc1_20_3", "mc1_20_4", "mc1_20_5", "mc1_20_6"] ? [] : mainJavaDirs)
		resources {
			setSrcDirs(mainResourceDirs)
			exclude "fabric.mod.json"
			exclude "packforge.accesswidener"
			exclude "META-INF/accesstransformer.cfg"
		}
		output.resourcesDir = layout.buildDirectory.dir("classes/java/main").get().asFile
	}
	test {
		java.setSrcDirs(testJavaDirs)
		resources.setSrcDirs(testResourceDirs)
	}
}

tasks.named("compileJava", JavaCompile) {
	setSource(files(mainJavaSources))
}

tasks.named("compileTestJava", JavaCompile) {
	setSource(files(testJavaSources))
}

dependencies {
	implementation minecraft.dependency
	if (needsLegacyJoptSimpleModule) {
		runtimeOnly "net.sf.jopt-simple:jopt-simple:5.0.4"
	}
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${packforgeMixinExtrasVersion}"))
	if (needsLegacyRuntimeRemap) {
		annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
	}
	implementation(jarJar("io.github.llamalad7:mixinextras-forge:${packforgeMixinExtrasVersion}")) {
		transitive = false
		jarJar.configure(it) {
			version = packforgeMixinExtrasVersion
		}
	}

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.apache.commons:commons-compress:1.27.1"
	testImplementation "com.google.code.gson:gson:2.11.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

if (needsLegacyJoptSimpleModule) {
	configurations.named("runtimeClasspath") {
		resolutionStrategy.force "net.sf.jopt-simple:jopt-simple:5.0.4"
	}
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	exclude "pack.mcmeta"
	inputs.file packforgeRegistryFile
	inputs.property "legacyMixinRefmap", needsLegacyRuntimeRemap ? legacyMixinRefmap : ""
	def properties = [
		"version": project.version,
		"minecraft_version_range": loaderConfig.minecraftVersionRange,
		"forge_version_range": loaderConfig.versionRange,
		"main_mixin_config": mainMixinConfig,
		"client_mixin_config": clientMixinConfig,
		"mixin_compatibility": target.mixinCompatibility
	]
	inputs.properties properties
	filesMatching("META-INF/mods.toml") {
		expand properties
	}
	filesMatching([mainMixinConfig, clientMixinConfig]) {
		expand properties
	}
	doLast {
		packforgeWriteGeneratedResources(destinationDir)
		if (needsLegacyRuntimeRemap) {
			[mainMixinConfig, clientMixinConfig].each { mixinPath ->
				def mixinFile = new File(destinationDir, mixinPath)
				def mixin = new groovy.json.JsonSlurper().parse(mixinFile)
				mixin.refmap = legacyMixinRefmap
				mixinFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mixin)) + System.lineSeparator(), "UTF-8")
			}
		}
	}
}

jar {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	archiveFileName = "packforge-forge-${project.version}-mc${target.artifactMinecraft}-slim.jar"
	manifest {
		attributes(["MixinConfigs": "${mainMixinConfig},${clientMixinConfig}"])
	}
}

tasks.named("jarJar") {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	archiveFileName = needsLegacyRuntimeRemap
		? "packforge-forge-${project.version}-mc${target.artifactMinecraft}-named.jar"
		: "packforge-forge-${project.version}-mc${target.artifactMinecraft}.jar"
}

if (needsLegacyRuntimeRemap) {
	renamer.enableMixinRefmaps {
		config mainMixinConfig
		config clientMixinConfig
		refMap = legacyMixinRefmap
	}
	renamer.mappings(minecraft.dependency.toSrg)
	def renamePackForgeJar = renamer.classes("renamePackForgeJar", tasks.named("jarJar", Jar)) {
		mappings renamer.mixin.generatedMappings
		output.set(layout.buildDirectory.file("libs/packforge-forge-${project.version}-mc${target.artifactMinecraft}.jar"))
	}
	tasks.named("assemble") {
		dependsOn renamePackForgeJar
	}
}

tasks.named("sourcesJar") {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	archiveFileName = "packforge-forge-${project.version}-mc${target.artifactMinecraft}-sources.jar"
}
