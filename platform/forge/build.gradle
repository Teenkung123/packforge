plugins {
	id "java"
	id "net.minecraftforge.gradle" version "7.0.25"
}

def rootProperties = new Properties()
file("../../gradle.properties").withInputStream { rootProperties.load(it) }
def rootProperty = { String name -> project.findProperty(name) ?: rootProperties.getProperty(name) }

version = rootProperty("mod_version")
group = rootProperty("maven_group")
def javaTarget = (rootProperty("java_version") as int)
def targetKey = rootProperty("packforge_mc_key") ?: "mc${rootProperty("minecraft_version").replace(".", "_")}"
def targetMinecraft = rootProperty("packforge_mc_target") ?: rootProperty("minecraft_version")
def versionSourceDir = file("../../versions/${targetKey}/src")
def minecraftVersionRange = rootProperty("minecraft_version_range") ?: "[${targetMinecraft},)"
def forgeVersionRange = rootProperty("forge_version_range") ?: "[60.0.0,)"

base {
	archivesName = "packforge"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaTarget)
	}
	sourceCompatibility = JavaVersion.toVersion(javaTarget)
	targetCompatibility = JavaVersion.toVersion(javaTarget)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaTarget
}

minecraft {
	mappings channel: "official", version: rootProperty("minecraft_version")
	dependency "net.minecraftforge:forge:${rootProperty("forge_version")}"

	runs {
		client {
			workingDir = file("run")
			client = true
			systemProperties = [
				"forge.logging.console.level": "debug"
			]

			mods {
				packforge {
					source sourceSets.main
				}
			}
		}
	}
}

repositories {
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	minecraft.mavenizer(repositories)
	mavenCentral()
}

sourceSets {
	main {
		java {
			srcDir "../../common/src/main/java"
			srcDir "../../common/src/client/java"
			srcDir "${versionSourceDir}/main/java"
			srcDir "${versionSourceDir}/client/java"
			srcDir "src/main/java"
		}
		resources {
			setSrcDirs([])
			srcDir "../../common/src/main/resources"
			srcDir "../../common/src/client/resources"
			srcDir "${versionSourceDir}/main/resources"
			srcDir "${versionSourceDir}/client/resources"
			srcDir "src/main/resources"
			exclude "fabric.mod.json"
			exclude "packforge.accesswidener"
			exclude "META-INF/accesstransformer.cfg"
		}
		output.resourcesDir = layout.buildDirectory.dir("classes/java/main").get().asFile
	}
}

tasks.named("compileJava", JavaCompile) {
	source = fileTree("../../common/src/main/java") +
		fileTree("../../common/src/client/java") +
		fileTree("${versionSourceDir}/main/java") +
		fileTree("${versionSourceDir}/client/java") +
		fileTree("src/main/java")
}

dependencies {
	implementation minecraft.dependency
}

processResources {
	def properties = [
		"version": project.version,
		"minecraft_version_range": minecraftVersionRange,
		"forge_version_range": forgeVersionRange
	]
	inputs.properties properties
	filesMatching("META-INF/mods.toml") {
		expand properties
	}
}

jar {
	archiveFileName = "packforge-forge-${project.version}-mc${targetMinecraft}.jar"
	manifest {
		attributes([
			"MixinConfigs": "packforge.fabric.mixins.json,packforge.fabric.client.mixins.json"
		])
	}
}

tasks.named("sourcesJar") {
	archiveFileName = "packforge-forge-${project.version}-mc${targetMinecraft}-sources.jar"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
