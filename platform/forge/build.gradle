plugins {
	id 'java'
	alias(libs.plugins.forgegradle)
	alias(libs.plugins.forge.jarjar)
}
apply from: rootProject.file('gradle/node.gradle')
def target = packforgeTarget
def loader = packforgePlatform
def mixinExtras = rootProject.packforgeRegistry.mixinExtrasVersion
def needsJopt = target.key in ['mc1_21_1', 'mc1_21_4']
// Forge discovers a development mod as one module. Merge compiled outputs only
// for launches, avoiding cross-project classpath resolution and split packages.
def developmentMod = tasks.register('prepareDevelopmentMod', Sync) {
	from sourceSets.main.output, project(':common').sourceSets.main.output
	into layout.buildDirectory.dir('developmentMod')
	duplicatesStrategy = DuplicatesStrategy.FAIL
}
def commonJar = project(':common').tasks.named('jar').flatMap { it.archiveFile }
sourceSets.main.runtimeClasspath = configurations.runtimeClasspath.minus(files(commonJar)).plus(files(developmentMod))
def developmentSources = sourceSets.create('developmentMod') {
	java.setSrcDirs([])
	resources.setSrcDirs([])
	output.classesDirs.setFrom(developmentMod)
	output.resourcesDir = null
	compileClasspath = files()
	runtimeClasspath = output
	annotationProcessorPath = files()
}
jarJar.register()
minecraft {
	mappings channel: 'official', version: target.minecraftVersion
	dependency "net.minecraftforge:forge:${packforgeRuntimeVersion('packforge_forge_version_override', loader.version)}"
	runs {
		client {
			workingDir = packforgeRunDirectory
			client = true
			args "--mixin.config=${target.mixinConfigs.main}", "--mixin.config=${target.mixinConfigs.client}"
			systemProperties = ['forge.logging.console.level': 'debug']
			environment 'MOD_CLASSES', '{source_roots}'
			mods {
				packforge {
					source developmentSources
				}
			}
		}
	}
}
repositories {
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	minecraft.mavenizer(repositories)
}
sourceSets.main.resources.exclude 'META-INF/accesstransformer.cfg'
dependencies {
	implementation minecraft.dependency
	if (needsJopt) runtimeOnly 'net.sf.jopt-simple:jopt-simple:5.0.4'
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinExtras}"))
	implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinExtras}")) {
		transitive = false
		jarJar.configure(it) { version = mixinExtras }
	}
}
if (needsJopt) configurations.runtimeClasspath.resolutionStrategy.force 'net.sf.jopt-simple:jopt-simple:5.0.4'
tasks.named('jar', Jar) {
	archiveFileName = packforgeArtifactName.replace('.jar', '-slim.jar')
	manifest.attributes(['MixinConfigs': "${target.mixinConfigs.main},${target.mixinConfigs.client}"])
}
tasks.named('jarJar', Jar) { archiveFileName = packforgeArtifactName }
tasks.named('assemble') { dependsOn tasks.named('jarJar') }
ext.packforgeArtifact = tasks.named('jarJar').flatMap { it.archiveFile }
if (packforgeArtifactSmoke) {
	throw new GradleException('Use scripts/Smoke-Forge-Production.ps1 for final-JAR validation in the production namespace.')
}
