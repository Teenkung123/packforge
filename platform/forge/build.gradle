plugins {
	id 'java'
	alias(libs.plugins.forgegradle)
	alias(libs.plugins.forge.jarjar)
}
apply from: rootProject.file('gradle/node.gradle')
def target = packforgeTarget
def platformConfig = packforgePlatform
def mixinExtrasPolicy = packforgeMixinExtras
def mixinExtrasVersion = mixinExtrasPolicy.version
def needsJoptSimple = target.key in ['mc1_21_1', 'mc1_21_4']
// Forge discovers a development mod as one module. Merge compiled outputs only
// for launches, avoiding cross-project classpath resolution and split packages.
def developmentMod = tasks.register('prepareDevelopmentMod', Sync) {
	from sourceSets.main.output, project(':common').sourceSets.main.output
	into layout.buildDirectory.dir('developmentMod')
	duplicatesStrategy = DuplicatesStrategy.FAIL
}
def commonJar = project(':common').tasks.named('jar').flatMap { it.archiveFile }
sourceSets.main.runtimeClasspath = configurations.runtimeClasspath.minus(files(commonJar)).plus(files(developmentMod))
def developmentSources = sourceSets.create('developmentMod') {
	java.setSrcDirs([])
	resources.setSrcDirs([])
	output.classesDirs.setFrom(developmentMod)
	// Resources are already merged here. IDEA's dependency model requires a
	// non-null output; Gradle and Forge deduplicate the shared output directory.
	output.resourcesDir = developmentMod.map { it.destinationDir }
	compileClasspath = files()
	runtimeClasspath = output
	annotationProcessorPath = files()
}
jarJar.register()
minecraft {
	mappings channel: 'official', version: target.minecraftVersion
	dependency "net.minecraftforge:forge:${packforgeRuntimeVersion('packforge_forge_version_override', platformConfig.version)}"
	runs {
		client {
			workingDir = packforgeRunDirectory
			client = true
			args "--mixin.config=${target.mixinConfigs.main}", "--mixin.config=${target.mixinConfigs.client}"
			systemProperties = ['forge.logging.console.level': 'debug']
			environment 'MOD_CLASSES', '{source_roots}'
			mods {
				packforge {
					source developmentSources
				}
			}
		}
	}
}
repositories {
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	minecraft.mavenizer(repositories)
}
sourceSets.main.resources.exclude 'META-INF/accesstransformer.cfg'
dependencies {
	implementation minecraft.dependency
	if (needsJoptSimple) {
		runtimeOnly 'net.sf.jopt-simple:jopt-simple:5.0.4'
	}
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinExtrasVersion}"))
	runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixinExtrasVersion}"
	jarJar("io.github.llamalad7:mixinextras-forge:${mixinExtrasVersion}:${mixinExtrasPolicy.classifier}") {
		transitive = false
		jarJar.configure(it) {
			version = mixinExtrasVersion
		}
	}
}
if (needsJoptSimple) {
	configurations.runtimeClasspath.resolutionStrategy.force 'net.sf.jopt-simple:jopt-simple:5.0.4'
}
tasks.named('jar', Jar) {
	archiveFileName = packforgeArtifactName.replace('.jar', '-slim.jar')
	manifest.attributes(['MixinConfigs': "${target.mixinConfigs.main},${target.mixinConfigs.client}"])
}
def releaseJar = tasks.named('jarJar', Jar) {
	archiveFileName = packforgeArtifactName
}
tasks.named('assemble') {
	dependsOn releaseJar
}
ext.packforgeArtifact = releaseJar.flatMap { it.archiveFile }

// Local benchmark tooling is optional and is not part of a clean checkout.
def benchmarkObserver = rootProject.file('gradle/benchmark-observer.gradle')
if (benchmarkObserver.isFile()) {
	apply from: benchmarkObserver
}
