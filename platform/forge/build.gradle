plugins {
	id "java"
	id "net.minecraftforge.gradle" version "7.0.25"
	id "net.minecraftforge.jarjar" version "0.2.3"
	id "net.minecraftforge.renamer" version "1.1.5"
}

def physicalPlatformRoot = project.buildFile.parentFile.canonicalFile
def physicalRepositoryRoot = physicalPlatformRoot.parentFile.parentFile.canonicalFile
def stonecutterDirectNode = rootProject != project
if (stonecutterDirectNode) {
	def pathSegments = project.path.tokenize(':')
	if (pathSegments != ['forge', project.name]) {
		throw new GradleException("Direct Forge build script requires a :forge:<target> Stonecutter leaf; found '${project.path}'.")
	}
	if (rootProject.projectDir.canonicalFile != physicalRepositoryRoot) {
		throw new GradleException("Direct Forge node repository mismatch: root=${rootProject.projectDir}, physical=${physicalRepositoryRoot}.")
	}
	def currentTargetKey = stonecutter.current.project.toString()
	if (currentTargetKey != project.name) {
		throw new GradleException("Direct Forge node target mismatch: path=${project.name}, Stonecutter=${currentTargetKey}.")
	}
	ext.packforgeRepositoryRootOverride = physicalRepositoryRoot
	ext.packforgeTargetKeyOverride = currentTargetKey
}

ext.packforgePlatformId = "forge"
ext.packforgePlatformSourceRoot = physicalPlatformRoot
apply from: new File(physicalRepositoryRoot, "gradle/packforge-target.gradle")

version = packforgeModVersion
group = packforgeMavenGroup

def target = packforgeTarget
def loaderConfig = packforgePlatform
def javaTarget = target.javaVersion as int
def usesPlatformMixinConfigs = loaderConfig.mixinConfigs != null
def mainMixinConfig = packforgeMixinConfigs.main.toString()
def clientMixinConfig = packforgeMixinConfigs.client.toString()
def needsLegacyRuntimeRemap = target.minecraftVersion in ["1.20.1", "1.20.2", "1.20.3", "1.20.4"]
def joptSimpleRuntimeVersion = loaderConfig.joptSimpleRuntimeVersion?.toString()
def legacyMixinRefmap = "packforge.refmap.json"
def artifactSmoke = providers.gradleProperty("packforge_artifact_smoke").map(Boolean::parseBoolean).orElse(false).get()
if (artifactSmoke) {
	throw new GradleException("Forge production artifacts use SRG names and cannot run in ForgeGradle's Mojmap userdev namespace. Use scripts/Smoke-Forge-Production.ps1 for final-JAR validation.")
}
def forgeRuntimeVersionOverride = providers.gradleProperty("packforge_forge_version_override").orNull
def forgeDependencyVersion = forgeRuntimeVersionOverride ?: loaderConfig.version.toString()

layout.buildDirectory.set(file("build/${target.key}"))

jarJar.register()

base {
	archivesName = "packforge"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaTarget)
	}
	sourceCompatibility = JavaVersion.toVersion(javaTarget)
	targetCompatibility = JavaVersion.toVersion(javaTarget)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaTarget
	options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

tasks.register("benchmarkPackIndex", JavaExec) {
	group = "verification"
	description = "Runs the deterministic, non-gating PackIndex microbenchmark."
	dependsOn tasks.named("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.teenkung.packforge.loader.PackIndexBenchmark"
	args layout.buildDirectory.dir("benchmark").get().asFile.absolutePath,
		java.util.Base64.encoder.encodeToString(groovy.json.JsonOutput.toJson(packforgeBuildPackMetadata(true)).getBytes("UTF-8"))
}

minecraft {
	mappings channel: "official", version: target.minecraftVersion
	dependency "net.minecraftforge:forge:${forgeDependencyVersion}"

	runs {
		client {
			workingDir = file("run/${target.key}")
			client = true
			if (!needsLegacyRuntimeRemap) {
				args "--mixin.config=${mainMixinConfig}", "--mixin.config=${clientMixinConfig}"
			}
			systemProperties = [
				"forge.logging.console.level": "debug"
			]

			mods {
				packforge {
					source sourceSets.main
				}
			}
		}
	}
}

repositories {
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	minecraft.mavenizer(repositories)
	mavenCentral()
}

ext.packforgeSourceSelection = [
	layout: "combined",
	sharedMainJavaSources: packforgeSharedMainJavaSources,
	sharedClientJavaSources: packforgeSharedClientJavaSources
]
apply from: new File(packforgeRepositoryRoot, "gradle/packforge-source-selection.gradle")
def selectedSources = packforgeSelectedSources

sourceSets {
	main {
		java.setSrcDirs(selectedSources.mainJavaSourceDirsEnabled ? selectedSources.mainJavaDirs : [])
		resources {
			setSrcDirs(selectedSources.mainResourceDirs)
			exclude "fabric.mod.json"
			if (usesPlatformMixinConfigs) {
				exclude "packforge.fabric*.json"
			}
			exclude "packforge.accesswidener"
			exclude "META-INF/accesstransformer.cfg"
		}
		output.resourcesDir = layout.buildDirectory.dir("classes/java/main").get().asFile
	}
	test {
		java.setSrcDirs(selectedSources.testJavaDirs)
		resources.setSrcDirs(selectedSources.testResourceDirs)
	}
}

tasks.named("compileJava", JavaCompile) {
	setSource(files(selectedSources.mainJavaSources))
}

tasks.named("compileTestJava", JavaCompile) {
	setSource(files(selectedSources.testJavaSources))
}

dependencies {
	implementation minecraft.dependency
	if (joptSimpleRuntimeVersion != null) {
		runtimeOnly "net.sf.jopt-simple:jopt-simple:${joptSimpleRuntimeVersion}"
	}
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${packforgeMixinExtrasVersion}"))
	if (needsLegacyRuntimeRemap) {
		annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
	}
	implementation(jarJar("io.github.llamalad7:mixinextras-forge:${packforgeMixinExtrasVersion}:${packforgeMixinExtrasClassifier}")) {
		transitive = false
		jarJar.configure(it) {
			version = packforgeMixinExtrasVersion
		}
	}

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.apache.commons:commons-compress:1.27.1"
	testImplementation "com.google.code.gson:gson:2.11.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

if (joptSimpleRuntimeVersion != null) {
	configurations.named("runtimeClasspath") {
		resolutionStrategy.force "net.sf.jopt-simple:jopt-simple:${joptSimpleRuntimeVersion}"
	}
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	exclude "pack.mcmeta"
	if (usesPlatformMixinConfigs) {
		exclude "packforge.fabric*.json"
	}
	inputs.file packforgeRegistryFile
	inputs.property "legacyMixinRefmap", needsLegacyRuntimeRemap ? legacyMixinRefmap : ""
	def properties = [
		"version": project.version,
		"minecraft_version_range": loaderConfig.minecraftVersionRange,
		"forge_version_range": loaderConfig.versionRange,
		"main_mixin_config": mainMixinConfig,
		"client_mixin_config": clientMixinConfig,
		"mixin_compatibility": packforgeMixinCompatibility
	]
	inputs.properties properties
	filesMatching("META-INF/mods.toml") {
		expand properties
	}
	filesMatching([mainMixinConfig, clientMixinConfig]) {
		expand properties
	}
	doLast {
		packforgeWriteGeneratedResources(destinationDir)
		if (needsLegacyRuntimeRemap) {
			[mainMixinConfig, clientMixinConfig].each { mixinPath ->
				def mixinFile = new File(destinationDir, mixinPath)
				def mixin = new groovy.json.JsonSlurper().parse(mixinFile)
				mixin.refmap = legacyMixinRefmap
				mixinFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mixin)) + System.lineSeparator(), "UTF-8")
			}
		}
	}
}

jar {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	archiveFileName = "packforge-forge-${project.version}-mc${packforgeArtifactMinecraft}-slim.jar"
	manifest {
		attributes(["MixinConfigs": "${mainMixinConfig},${clientMixinConfig}"])
	}
}

tasks.named("jarJar") {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	archiveFileName = needsLegacyRuntimeRemap
		? "packforge-forge-${project.version}-mc${packforgeArtifactMinecraft}-named.jar"
		: "packforge-forge-${project.version}-mc${packforgeArtifactMinecraft}.jar"
}

if (needsLegacyRuntimeRemap) {
	renamer.enableMixinRefmaps {
		config mainMixinConfig
		config clientMixinConfig
		refMap = legacyMixinRefmap
	}
	renamer.mappings(minecraft.dependency.toSrg)
	def renamePackForgeJar = renamer.classes("renamePackForgeJar", tasks.named("jarJar", Jar)) {
		mappings renamer.mixin.generatedMappings
		output.set(layout.buildDirectory.file("libs/packforge-forge-${project.version}-mc${packforgeArtifactMinecraft}.jar"))
	}
	tasks.named("assemble") {
		dependsOn renamePackForgeJar
	}
}

tasks.named("sourcesJar") {
	archiveFileName = "packforge-forge-${project.version}-mc${packforgeArtifactMinecraft}-sources.jar"
}

if (stonecutterDirectNode) {
	// Retain Phase D's nested build only as an explicit rollback/parity oracle.
	// The authoritative direct task below depends solely on Forge's final packaging task.
	apply from: new File(packforgeRepositoryRoot, "stonecutter-build.gradle")

	def expectedDirectArtifactName = "packforge-forge-${project.version}-mc${packforgeArtifactMinecraft}.jar"
	def finalDistributionTask = needsLegacyRuntimeRemap
		? tasks.named("renamePackForgeJar")
		: tasks.named("jarJar")
	def directArtifact = layout.buildDirectory.file("libs/${expectedDirectArtifactName}")
	def delegatedArtifactForParity = new File(
		packforgePlatformSourceRoot,
		"build/${target.key}/libs/${expectedDirectArtifactName}"
	)

	ext.packforgeStonecutterDirectParity = [
		loaderId: "Forge",
		artifactProvider: directArtifact,
		expectedArtifactName: expectedDirectArtifactName,
		delegatedArtifact: delegatedArtifactForParity,
		directBuildDependencies: [finalDistributionTask],
		finalArtifactTask: finalDistributionTask,
		delegatedBuildTaskName: "buildStonecutterDelegatedNode",
		loaderSpecificChecks: { File directFile, Map<String, List<String>> ignoredEntries ->
			def zip = new java.util.zip.ZipFile(directFile)
			try {
				def readEntryText = { String path ->
					def entry = zip.getEntry(path)
					if (entry == null) {
						throw new GradleException("Direct Forge artifact is missing required entry '${path}'.")
					}
					zip.getInputStream(entry).withCloseable { input -> input.getText("UTF-8") }
				}

				def modsToml = readEntryText("META-INF/mods.toml")
				def capabilities = new Properties()
				new ByteArrayInputStream(readEntryText("packforge-capabilities.properties").getBytes("ISO-8859-1")).withCloseable { input ->
					capabilities.load(input)
				}
				def mainMixin = new groovy.json.JsonSlurper().parseText(readEntryText(mainMixinConfig))
				def clientMixin = new groovy.json.JsonSlurper().parseText(readEntryText(clientMixinConfig))
				if (!modsToml.contains('modId="packforge"')
					|| !modsToml.contains("version=\"${project.version}\"")
					|| !modsToml.contains("versionRange=\"${loaderConfig.versionRange}\"")
					|| !modsToml.contains("versionRange=\"${loaderConfig.minecraftVersionRange}\"")
					|| capabilities.getProperty("target") != target.key.toString()
					|| capabilities.getProperty("minecraft") != packforgeArtifactMinecraft) {
					throw new GradleException("Direct Forge artifact metadata does not match registry target '${target.key}'.")
				}

				if (needsLegacyRuntimeRemap) {
					def legacyRefmaps = [mainMixin, clientMixin].collect { mixin ->
						if (mixin.refmap != legacyMixinRefmap) {
							throw new GradleException("Direct Forge legacy mixin config has incorrect refmap '${mixin.refmap}'.")
						}
						def refmapText = readEntryText(legacyMixinRefmap)
						def intermediarySelector = refmapText =~ /\b(?:method|field)_[0-9]+\b/
						if (intermediarySelector.find()) {
							throw new GradleException("Direct Forge legacy refmap retains intermediary selector '${intermediarySelector.group()}'.")
						}
						new groovy.json.JsonSlurper().parseText(refmapText)
					}
					def legacyMappings = legacyRefmaps.collect { it.mappings ?: [:] }.inject([:]) { merged, mappings ->
						merged.putAll(mappings as Map)
						merged
					}
					def reloadMappings = legacyMappings["com/teenkung/packforge/mixin/observe/SimpleReloadInstanceMixin"] as Map
					def remappedStateFactoryHook = reloadMappings?.find { selector, mapped ->
						selector.toString().startsWith("Lnet/minecraft/server/packs/resources/SimpleReloadInstance\$StateFactory;create(")
							&& mapped.toString().contains(";m_")
					}
					def spriteMappings = legacyMappings["com/teenkung/packforge/client/mixin/atlas/SpriteLoaderMixin"] as Map
					def remappedAtlasHook = spriteMappings?.find { selector, mapped ->
						def selectorName = selector.toString()
						(selectorName == "loadAndStitch" || selectorName.startsWith("loadAndStitch("))
							&& mapped.toString().contains(";m_")
					}?.value?.toString()
					if (remappedStateFactoryHook == null
						|| !reloadMappings.containsKey("<init>")
						|| remappedAtlasHook == null) {
						throw new GradleException("Direct Forge legacy artifact is missing required remapped Mixin structural hooks.")
					}
				} else if (mainMixin.refmap != null
					|| clientMixin.refmap != null
					|| zip.getEntry(legacyMixinRefmap) != null) {
					throw new GradleException("Direct Forge modern artifact unexpectedly contains legacy Mixin refmap metadata.")
				}
			} finally {
				zip.close()
			}
		}
	]
	apply from: new File(packforgeRepositoryRoot, "gradle/packforge-stonecutter-direct.gradle")
	apply from: new File(packforgeRepositoryRoot, "gradle/packforge-stonecutter-direct-parity.gradle")
}
