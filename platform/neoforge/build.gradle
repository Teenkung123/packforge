plugins {
	id "java"
	id "net.neoforged.moddev" version "2.0.141"
}

version = "1.1.0"
group = "com.teenkung"

base {
	archivesName = "packforge"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

sourceSets {
	main {
		java {
			srcDir "../../src/main/java"
			srcDir "../../src/client/java"
			srcDir "src/main/java"
		}
		resources {
			setSrcDirs([])
			srcDir "../../src/main/resources"
			srcDir "../../src/client/resources"
			srcDir "src/main/resources"
			exclude "fabric.mod.json"
			exclude "packforge.accesswidener"
		}
	}
}

tasks.named("compileJava", JavaCompile) {
	source = fileTree("../../src/main/java") {
		exclude "com/teenkung/packforge/fabric/**"
	} + fileTree("../../src/client/java") {
		exclude "com/teenkung/packforge/fabric/**"
		exclude "com/teenkung/packforge/client/config/PackForgeModMenuApi.java"
		exclude "com/teenkung/packforge/client/atlas/CappedSpriteResourceLoader.java"
	} + fileTree("src/main/java")
}

neoForge {
	version = "26.1.0.19-beta"
	validateAccessTransformers = false

	mods {
		packforge {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

jar {
	archiveFileName = "packforge-neoforge-${project.version}.jar"
}

tasks.named("sourcesJar") {
	archiveFileName = "packforge-neoforge-${project.version}-sources.jar"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
