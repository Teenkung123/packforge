plugins {
	id 'java'
	alias(libs.plugins.moddev)
}
apply from: rootProject.file('gradle/node.gradle')
def target = packforgeTarget
def platformConfig = packforgePlatform
def mixinExtrasPolicy = packforgeMixinExtras
def mixinExtrasVersion = mixinExtrasPolicy.version
neoForge {
	version = packforgeRuntimeVersion('packforge_neoforge_version_override', platformConfig.version)
	// Plain adapter tests need the same patched Minecraft API as production compilation.
	if (target.apiAdapter == 'mc26') {
		addModdingDependenciesTo(sourceSets.test)
	}
	validateAccessTransformers = false
	runs {
		client {
			client()
			gameDirectory = packforgeRunDirectory
			systemProperty 'forge.logging.console.level', 'debug'
			ideName = "NeoForge ${target.minecraftVersion} Client"
		}
	}
	mods {
		packforge {
			sourceSet sourceSets.main
			sourceSet project(':common').sourceSets.main
		}
	}
}
dependencies {
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinExtrasVersion}"))
	if (mixinExtrasPolicy.provider == 'bundled') {
		jarJar("io.github.llamalad7:mixinextras-neoforge:${mixinExtrasVersion}:${mixinExtrasPolicy.classifier}") {
			version {
				strictly "[${mixinExtrasVersion}]"
				prefer mixinExtrasVersion
			}
		}
	}
}
ext.packforgeArtifact = tasks.named('jar').flatMap { it.archiveFile }

// Local benchmark tooling is optional and is not part of a clean checkout.
def benchmarkObserver = rootProject.file('gradle/benchmark-observer.gradle')
if (benchmarkObserver.isFile()) {
	apply from: benchmarkObserver
}
