plugins {
	id "java"
	id "net.neoforged.moddev" version "2.0.141"
}

def rootProperties = new Properties()
file("../../gradle.properties").withInputStream { rootProperties.load(it) }
def rootProperty = { String name -> rootProperties.getProperty(name) ?: project.findProperty(name) }

version = rootProperty("mod_version")
group = rootProperty("maven_group")
def javaTarget = (rootProperty("java_version") as int)

base {
	archivesName = "packforge"
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaTarget)
	targetCompatibility = JavaVersion.toVersion(javaTarget)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaTarget
}

sourceSets {
	main {
		java {
			srcDir "../../common/src/main/java"
			srcDir "../../common/src/client/java"
			srcDir "src/main/java"
		}
		resources {
			setSrcDirs([])
			srcDir "../../common/src/main/resources"
			srcDir "../../common/src/client/resources"
			srcDir "src/main/resources"
			exclude "fabric.mod.json"
			exclude "packforge.accesswidener"
		}
	}
}

tasks.named("compileJava", JavaCompile) {
	source = fileTree("../../common/src/main/java") + fileTree("../../common/src/client/java") + fileTree("src/main/java")
}

neoForge {
	version = rootProperty("neoforge_version")
	validateAccessTransformers = false

	runs {
		client {
			client()
			gameDirectory = project.file("run")
			systemProperty "forge.logging.console.level", "debug"
			ideName = "NeoForge Client"
		}
	}

	mods {
		packforge {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

jar {
	archiveFileName = "packforge-neoforge-${project.version}.jar"
}

tasks.named("sourcesJar") {
	archiveFileName = "packforge-neoforge-${project.version}-sources.jar"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
