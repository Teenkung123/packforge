plugins {
	id "java"
	id "net.neoforged.moddev" version "2.0.143" apply false
	id "net.neoforged.gradle.userdev" version "7.1.38" apply false
}

// A direct Stonecutter leaf evaluates this physical loader script from a
// generated :neoforge:<target> project.  Keep the standalone platform project
// unchanged, but bind direct leaves back to the real repository and sources.
def physicalPlatformRoot = project.buildFile.parentFile.canonicalFile
def physicalRepositoryRoot = physicalPlatformRoot.parentFile.parentFile.canonicalFile
def stonecutterDirectNode = rootProject != project
if (stonecutterDirectNode) {
	def pathSegments = project.path.tokenize(':')
	if (pathSegments != ['neoforge', project.name]) {
		throw new GradleException("Direct NeoForge build script requires a :neoforge:<target> Stonecutter leaf; found '${project.path}'.")
	}
	if (rootProject.projectDir.canonicalFile != physicalRepositoryRoot) {
		throw new GradleException("Direct NeoForge node repository mismatch: root=${rootProject.projectDir}, physical=${physicalRepositoryRoot}.")
	}
	def currentTargetKey = stonecutter.current.project.toString()
	if (currentTargetKey != project.name) {
		throw new GradleException("Direct NeoForge node target mismatch: path=${project.name}, Stonecutter=${currentTargetKey}.")
	}
	ext.packforgeRepositoryRootOverride = physicalRepositoryRoot
	ext.packforgeTargetKeyOverride = currentTargetKey
}

ext.packforgePlatformId = "neoforge"
ext.packforgePlatformSourceRoot = physicalPlatformRoot
apply from: new File(physicalRepositoryRoot, "gradle/packforge-target.gradle")

version = packforgeModVersion
group = packforgeMavenGroup

def target = packforgeTarget
def legacyNeoGradle = target.key in ["mc1_20_2", "mc1_20_3", "mc1_20_4"]
def neoGradleModern = target.key == "mc26_1_to_26_2"
def usesNeoGradle = legacyNeoGradle || neoGradleModern
apply plugin: usesNeoGradle ? "net.neoforged.gradle.userdev" : "net.neoforged.moddev"
def loaderConfig = packforgePlatform
def javaTarget = target.javaVersion as int
def mainMixinConfig = packforgeMixinConfigs.main.toString()
def clientMixinConfig = packforgeMixinConfigs.client.toString()
def artifactSmoke = providers.gradleProperty("packforge_artifact_smoke").map(Boolean::parseBoolean).orElse(false).get()
def neoForgeRuntimeVersionOverride = providers.gradleProperty("packforge_neoforge_version_override").orNull
def neoForgeDependencyVersion = neoForgeRuntimeVersionOverride ?: loaderConfig.version.toString()
def metadataDescriptor = legacyNeoGradle ? "META-INF/mods.toml" : "META-INF/neoforge.mods.toml"

layout.buildDirectory.set(file("build/${target.key}"))

base {
	archivesName = "packforge"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaTarget)
	}
	sourceCompatibility = JavaVersion.toVersion(javaTarget)
	targetCompatibility = JavaVersion.toVersion(javaTarget)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaTarget
	options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

tasks.register("benchmarkPackIndex", JavaExec) {
	group = "verification"
	description = "Runs the deterministic, non-gating PackIndex microbenchmark."
	dependsOn tasks.named("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.teenkung.packforge.loader.PackIndexBenchmark"
	args layout.buildDirectory.dir("benchmark").get().asFile.absolutePath,
		java.util.Base64.encoder.encodeToString(groovy.json.JsonOutput.toJson(packforgeBuildPackMetadata(true)).getBytes("UTF-8"))
}

ext.packforgeSourceSelection = [
	layout: "combined",
	sharedMainJavaSources: packforgeSharedMainJavaSources,
	sharedClientJavaSources: packforgeSharedClientJavaSources
]
apply from: new File(packforgeRepositoryRoot, "gradle/packforge-source-selection.gradle")
def selectedSources = packforgeSelectedSources

sourceSets {
	main {
		java.setSrcDirs(selectedSources.mainJavaSourceDirsEnabled ? selectedSources.mainJavaDirs : [])
		resources {
			setSrcDirs(selectedSources.mainResourceDirs)
			exclude "fabric.mod.json"
			exclude "packforge.accesswidener"
		}
	}
	test {
		java.setSrcDirs(selectedSources.testJavaDirs)
		resources.setSrcDirs(selectedSources.testResourceDirs)
	}
}

tasks.named("compileJava", JavaCompile) {
	setSource(files(selectedSources.mainJavaSources))
}

tasks.named("compileTestJava", JavaCompile) {
	setSource(files(selectedSources.testJavaSources))
}

if (usesNeoGradle) {
	runs {
		configureEach {
			workingDirectory = project.file("run/${target.key}")
			systemProperty "forge.logging.console.level", "debug"
			if (!artifactSmoke) {
				modSource sourceSets.main
			}
		}
		client {
			client()
		}
	}
} else {
	neoForge {
		version = neoForgeDependencyVersion
		validateAccessTransformers = false

		runs {
			client {
				client()
				gameDirectory = project.file("run/${target.key}")
				systemProperty "forge.logging.console.level", "debug"
				ideName = "NeoForge ${target.minecraftVersion} Client"
			}
		}

		if (!artifactSmoke) {
			mods {
				packforge {
					sourceSet sourceSets.main
				}
			}
		}
	}
}

repositories {
	mavenCentral()
}

// NeoGradle's NeoForge 20.6 dependency graph includes net.minecraftforge:unsafe,
// whose historical runtime POM requests Log4j 2.11.+.  NeoForged Releases
// currently serves an empty metadata document for that range, so pin only that
// transitive request to the final 2.11.x release; NeoForge's declared Log4j
// 2.22.1 dependency remains untouched.
configurations.configureEach {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == "org.apache.logging.log4j"
			&& details.requested.version == "2.11.+") {
			details.useVersion("2.11.2")
		}
	}
}

dependencies {
	if (usesNeoGradle) {
		implementation "net.neoforged:neoforge:${neoForgeDependencyVersion}"
	}
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${packforgeMixinExtrasVersion}"))
	jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:${packforgeMixinExtrasVersion}:${packforgeMixinExtrasClassifier}")) {
		version {
			strictly "[${packforgeMixinExtrasVersion}]"
			prefer packforgeMixinExtrasVersion
		}
	}

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.apache.commons:commons-compress:1.27.1"
	testImplementation "com.google.code.gson:gson:2.11.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testRuntimeOnly "org.slf4j:slf4j-simple:2.0.17"
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	exclude "pack.mcmeta"
	inputs.file packforgeRegistryFile
	def properties = [
		"version": project.version,
		"minecraft_version_range": loaderConfig.minecraftVersionRange,
		"neoforge_version_range": loaderConfig.versionRange,
		"main_mixin_config": mainMixinConfig,
		"client_mixin_config": clientMixinConfig,
		"mixin_compatibility": packforgeMixinCompatibility
	]
	inputs.properties properties
	if (legacyNeoGradle) {
		exclude "META-INF/neoforge.mods.toml"
	} else {
		exclude "META-INF/mods.toml"
	}
	filesMatching(metadataDescriptor) {
		expand properties
	}
	filesMatching([mainMixinConfig, clientMixinConfig]) {
		expand properties
	}
	doLast {
		packforgeWriteGeneratedResources(destinationDir)
	}
}

jar {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	archiveFileName = "packforge-neoforge-${project.version}-mc${packforgeArtifactMinecraft}.jar"
}

if (usesNeoGradle) {
	tasks.named("jar") {
		archiveFileName = "packforge-neoforge-${project.version}-mc${packforgeArtifactMinecraft}-slim.jar"
	}
	tasks.named("jarJar") {
		archiveFileName = "packforge-neoforge-${project.version}-mc${packforgeArtifactMinecraft}.jar"
	}
}

tasks.named("sourcesJar") {
	archiveFileName = "packforge-neoforge-${project.version}-mc${packforgeArtifactMinecraft}-sources.jar"
}

if (stonecutterDirectNode) {
	// Preserve Phase D's nested build as a rollback/parity oracle.  Direct
	// aggregate builds depend only on the node task configured below.
	apply from: new File(packforgeRepositoryRoot, "stonecutter-build.gradle")

	def expectedDirectArtifactName = "packforge-neoforge-${project.version}-mc${packforgeArtifactMinecraft}.jar"
	// UserDev families package embedded dependencies through jarJar; ModDev
	// packages its production artifact through jar.  The selected task is the
	// sole direct artifact authority for its Stonecutter leaf.
	def finalArtifactTask = usesNeoGradle ? tasks.named('jarJar') : tasks.named('jar')
	def directArtifact = finalArtifactTask.flatMap { task -> task.archiveFile }
	def delegatedArtifactForParity = new File(
		packforgePlatformSourceRoot,
		"build/${target.key}/libs/${expectedDirectArtifactName}"
	)
	ext.packforgeStonecutterDirectParity = [
		loaderId: 'NeoForge',
		artifactProvider: directArtifact,
		expectedArtifactName: expectedDirectArtifactName,
		delegatedArtifact: delegatedArtifactForParity,
		directBuildDependencies: [finalArtifactTask],
		finalArtifactTask: finalArtifactTask,
		delegatedBuildTaskName: 'buildStonecutterDelegatedNode',
		loaderSpecificChecks: { File directFile, Map<String, List<String>> ignoredEntries ->
			def zip = new java.util.zip.ZipFile(directFile)
			try {
				def metadataEntry = zip.getEntry(metadataDescriptor)
				def capabilitiesEntry = zip.getEntry('packforge-capabilities.properties')
				def requiredEntries = [metadataEntry, capabilitiesEntry, zip.getEntry(mainMixinConfig), zip.getEntry(clientMixinConfig)]
				if (requiredEntries.any { entry -> entry == null }) {
					throw new GradleException('Direct NeoForge artifact is missing required metadata, mixin, or capabilities entries.')
				}
				def metadataText = zip.getInputStream(metadataEntry).getText('UTF-8')
				def capabilities = new Properties()
				zip.getInputStream(capabilitiesEntry).withCloseable { input -> capabilities.load(input) }
				if (!metadataText.contains('modId="packforge"')
					|| !metadataText.contains("version=\"${project.version}\"")
					|| !metadataText.contains("${loaderConfig.minecraftVersionRange}")
					|| !metadataText.contains("${loaderConfig.versionRange}")
					|| capabilities.getProperty('target') != target.key.toString()
					|| capabilities.getProperty('minecraft') != packforgeArtifactMinecraft) {
					throw new GradleException("Direct NeoForge artifact metadata does not match registry target '${target.key}'.")
				}
			} finally {
				zip.close()
			}
		}
	]
	apply from: new File(packforgeRepositoryRoot, 'gradle/packforge-stonecutter-direct.gradle')
	apply from: new File(packforgeRepositoryRoot, 'gradle/packforge-stonecutter-direct-parity.gradle')
}
