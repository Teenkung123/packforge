plugins {
	id 'java'
	alias(libs.plugins.moddev)
}
apply from: rootProject.file('gradle/node.gradle')
def target = packforgeTarget
def loader = packforgePlatform
def mixinExtras = rootProject.packforgeRegistry.mixinExtrasVersion
def smoke = packforgeArtifactSmoke
neoForge {
	version = packforgeRuntimeVersion('packforge_neoforge_version_override', loader.version)
	validateAccessTransformers = false
	runs {
		client {
			client()
			gameDirectory = packforgeRunDirectory
			systemProperty 'forge.logging.console.level', 'debug'
			ideName = "NeoForge ${target.minecraftVersion} Client"
		}
	}
	if (!smoke) {
		mods {
			packforge {
				sourceSet sourceSets.main
				sourceSet project(':common').sourceSets.main
			}
		}
	}
}
dependencies {
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinExtras}"))
	jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:${mixinExtras}")) {
		version { strictly "[${mixinExtras}]"; prefer mixinExtras }
	}
}
ext.packforgeArtifact = tasks.named('jar').flatMap { it.archiveFile }
