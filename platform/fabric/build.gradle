import groovy.json.JsonSlurper

plugins {
	id "fabric-loom" apply false
	id "net.fabricmc.fabric-loom" apply false
	id "maven-publish"
}

def physicalPlatformRoot = project.buildFile.parentFile.canonicalFile
def physicalRepositoryRoot = physicalPlatformRoot.parentFile.parentFile.canonicalFile
def stonecutterDirectNode = rootProject != project
if (stonecutterDirectNode) {
	def pathSegments = project.path.tokenize(':')
	if (pathSegments != ['fabric', project.name]) {
		throw new GradleException("Direct Fabric build script requires a :fabric:<target> Stonecutter leaf; found '${project.path}'.")
	}
	if (rootProject.projectDir.canonicalFile != physicalRepositoryRoot) {
		throw new GradleException("Direct Fabric node repository mismatch: root=${rootProject.projectDir}, physical=${physicalRepositoryRoot}.")
	}
	def currentTargetKey = stonecutter.current.project.toString()
	if (currentTargetKey != project.name) {
		throw new GradleException("Direct Fabric node target mismatch: path=${project.name}, Stonecutter=${currentTargetKey}.")
	}
	ext.packforgeRepositoryRootOverride = physicalRepositoryRoot
	ext.packforgeTargetKeyOverride = currentTargetKey
}

ext.packforgePlatformId = "fabric"
ext.packforgePlatformSourceRoot = physicalPlatformRoot
apply from: new File(physicalRepositoryRoot, "gradle/packforge-target.gradle")
apply plugin: packforgePlatform.mappingMode == "named" ? "fabric-loom" : "net.fabricmc.fabric-loom"

version = packforgeModVersion
group = packforgeMavenGroup

def target = packforgeTarget
def loaderConfig = packforgePlatform
def javaTarget = target.javaVersion as int
def accessWidenerFile = new File(packforgeRepositoryRoot, loaderConfig.accessWidener.toString())
def mainMixinConfig = packforgeMixinConfigs.main.toString()
def clientMixinConfig = packforgeMixinConfigs.client.toString()
def artifactSmoke = providers.gradleProperty("packforge_artifact_smoke").map(Boolean::parseBoolean).orElse(false).get()
def minecraftRuntimeVersionOverride = providers.gradleProperty("packforge_minecraft_version_override").orNull
def minecraftDependencyVersion = minecraftRuntimeVersionOverride ?: target.minecraftVersion.toString()

layout.buildDirectory.set(file("build/${target.key}"))

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = accessWidenerFile

	if (!artifactSmoke) {
		mods {
			"packforge" {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}

	runs {
		client {
			runDir("run/${target.key}")
		}
	}
}

ext.packforgeSourceSelection = [
	layout: "split",
	sharedMainJavaSources: packforgeSharedMainJavaSources,
	sharedClientJavaSources: packforgeSharedClientJavaSources
]
apply from: new File(packforgeRepositoryRoot, "gradle/packforge-source-selection.gradle")
def selectedSources = packforgeSelectedSources
def selectedMainJavaSources = files(selectedSources.mainJavaSources)
def compileMainJavaSources = selectedMainJavaSources
def legacyNativeSources = [] as Set
def legacySharedZipSource = stonecutterDirectNode
	? new File(physicalRepositoryRoot, "versions/shared/common/src/main/java/com/teenkung/packforge/mixin/loader/SharedZipFileAccessMixin.java").canonicalFile
	: null
def generatedSharedZipSource = stonecutterDirectNode
	? stonecutter.tasks.generatedSourcesDir.file("main/java/com/teenkung/packforge/mixin/loader/SharedZipFileAccessMixin.java").get().asFile.canonicalFile
	: null
def nativeSharedZipActive = false
if (stonecutterDirectNode) {
	legacyNativeSources = [
		new File(physicalRepositoryRoot, "versions/shared/common/src/main/java/com/teenkung/packforge/mixin/loader/FilePackResourcesArchiveMixin.java").canonicalFile,
		new File(physicalRepositoryRoot, "versions/mc1_21_shared/common/src/main/java/com/teenkung/packforge/mixin/loader/FilePackResourcesArchiveMixin.java").canonicalFile,
		legacySharedZipSource
	] as Set
	nativeSharedZipActive = selectedMainJavaSources.files.any { source -> source.canonicalFile == legacySharedZipSource }
	compileMainJavaSources = files(
		selectedMainJavaSources.filter { source -> source.canonicalFile !in legacyNativeSources },
		// Stonecutter 0.9.7 auto-configures every SourceSet, including main.
		stonecutter.tasks.generatedSourcesDir.dir("main/java")
	)
}

sourceSets {
	main {
		java.setSrcDirs(selectedSources.mainJavaSourceDirsEnabled ? selectedSources.mainJavaDirs : [])
		if (stonecutterDirectNode) {
			java.srcDir(stonecutter.tasks.generatedSourcesDir.dir("main/java"))
		}
		resources.setSrcDirs(selectedSources.mainResourceDirs)
	}
	client {
		java.setSrcDirs(selectedSources.clientJavaSourceDirsEnabled ? selectedSources.clientJavaDirs : [])
		resources.setSrcDirs(selectedSources.clientResourceDirs)
	}
	test {
		java.setSrcDirs(selectedSources.testJavaDirs)
		resources.setSrcDirs(selectedSources.testResourceDirs)
	}
}

tasks.named("compileJava", JavaCompile) {
	if (stonecutterDirectNode) {
		dependsOn(stonecutter.tasks.generate["main"])
	}
	setSource(compileMainJavaSources)
}

tasks.named("compileClientJava", JavaCompile) {
	setSource(files(selectedSources.clientJavaSources))
}

tasks.named("compileTestJava", JavaCompile) {
	setSource(files(selectedSources.testJavaSources))
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftDependencyVersion}"
	// Fabric Loader supplies Mixin at runtime for official-mapped targets too;
	// keep its public plugin API available to the early compatibility plugin.
	compileOnly "net.fabricmc:sponge-mixin:${packforgeRegistry.fabricMixinVersion}"
	add("clientCompileOnly", "net.fabricmc:sponge-mixin:${packforgeRegistry.fabricMixinVersion}")
	if (loaderConfig.mappingMode == "named") {
		mappings loom.officialMojangMappings()
	}
	if (loaderConfig.mappingMode == "named") {
		modImplementation "net.fabricmc:fabric-loader:${loaderConfig.loaderVersion}"
	} else {
		implementation "net.fabricmc:fabric-loader:${loaderConfig.loaderVersion}"
		["asm", "asm-analysis", "asm-commons", "asm-tree", "asm-util"].each { module ->
			runtimeOnly "org.ow2.asm:${module}:${packforgeRegistry.fabricAsmVersion}"
		}
		runtimeOnly "net.fabricmc:sponge-mixin:${packforgeRegistry.fabricMixinVersion}"
	}
	// Loom/Fabric API can inject compile-time interfaces into Minecraft classes.
	// Keep those types available to javac without making Fabric API a runtime dependency.
	if (!artifactSmoke && loaderConfig.fabricApiVersion != null) {
		compileOnly "net.fabricmc.fabric-api:fabric-api:${loaderConfig.fabricApiVersion}"
	}
	if (loaderConfig.modMenuEntrypoint) {
		if (loaderConfig.mappingMode == "named") {
			// Legacy Mod Menu artifacts publish their API in intermediary mappings.
			// Route them through classic Loom so its Screen parameter is remapped to
			// the Mojang names this project uses at compile time.
			modCompileOnly "maven.modrinth:modmenu:${loaderConfig.modMenuVersion}"
		} else {
			// Modern Loom resolves the current Mod Menu artifact in its native
			// mapping namespace and does not expose the legacy modCompileOnly DSL.
			compileOnly "maven.modrinth:modmenu:${loaderConfig.modMenuVersion}"
			if (!artifactSmoke) {
				// Keep optional integrations available to local client runs without
				// exporting either dependency to PackForge consumers.
				add("localRuntime", "net.fabricmc.fabric-api:fabric-api:${loaderConfig.fabricApiVersion}")
				add("localRuntime", "maven.modrinth:modmenu:${loaderConfig.modMenuVersion}")
			}
		}
	}

	implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${packforgeMixinExtrasVersion}"))
	include "io.github.llamalad7:mixinextras-fabric:${packforgeMixinExtrasVersion}"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.apache.commons:commons-compress:1.27.1"
	testImplementation "com.google.code.gson:gson:2.11.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	exclude "pack.mcmeta"
	exclude "fabric.mod.json"
	inputs.file packforgeRegistryFile
	inputs.file accessWidenerFile
	def properties = [
		"version": project.version,
		"minecraft_dependency": loaderConfig.minecraftDependency,
		"fabric_loader_dependency": loaderConfig.loaderDependency,
		"java_dependency": ">=${javaTarget}",
		"main_mixin_config": mainMixinConfig,
		"client_mixin_config": clientMixinConfig,
		"mixin_compatibility": packforgeMixinCompatibility
	]
	inputs.properties properties

	filesMatching([mainMixinConfig, clientMixinConfig]) {
		expand properties
	}

	doLast {
		def outputDirectory = destinationDir
		packforgeWriteGeneratedResources(outputDirectory)

		def entrypoints = [
			main: ["com.teenkung.packforge.fabric.PackForgeFabric"],
			client: ["com.teenkung.packforge.fabric.PackForgeFabricClient"]
		]
		if (loaderConfig.modMenuEntrypoint) {
			entrypoints.modmenu = ["com.teenkung.packforge.client.config.PackForgeModMenuApi"]
		}
		def metadata = [
			schemaVersion: 1,
			id: "packforge",
			version: project.version.toString(),
			name: "PackForge",
			description: "Faster pack reloads and atlas overflow recovery for large resource packs.",
			authors: ["Teenkung123"],
			contact: [
				homepage: "https://github.com/Teenkung/PackForge",
				sources: "https://github.com/Teenkung/PackForge"
			],
			license: "MIT",
			icon: "assets/packforge/icon.png",
			environment: "client",
			entrypoints: entrypoints,
			mixins: [
				mainMixinConfig,
				[config: clientMixinConfig, environment: "client"]
			],
			accessWidener: "packforge.accesswidener",
			depends: [
				fabricloader: loaderConfig.loaderDependency.toString(),
				minecraft: loaderConfig.minecraftDependency.toString(),
				java: ">=${javaTarget}"
			]
		]
		if (loaderConfig.modMenuEntrypoint) {
			metadata.suggests = [modmenu: "*"]
		}
		def metadataJson = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
		new File(outputDirectory, "fabric.mod.json").setText(metadataJson + System.lineSeparator(), "UTF-8")
	}
}

tasks.named("processClientResources") {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	inputs.file packforgeRegistryFile
	inputs.property "mixin_compatibility", packforgeMixinCompatibility
	filesMatching(clientMixinConfig) {
		expand "mixin_compatibility": packforgeMixinCompatibility
	}
}

if (artifactSmoke) {
	def developmentOutputPaths = providers.provider {
		(sourceSets.main.output.files + sourceSets.client.output.files)
			.collect { it.canonicalPath }
			.toSet()
	}
	tasks.named("runClient") {
		// A packaged smoke must not be able to discover PackForge through Loom's
		// source-set outputs. Fabric Loader should see only the artifact copied
		// into the run directory's mods folder.
		classpath = classpath.filter { candidate ->
			!developmentOutputPaths.get().contains(candidate.canonicalPath)
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaTarget
	options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

tasks.register("benchmarkPackIndex", JavaExec) {
	group = "verification"
	description = "Runs the deterministic, non-gating PackIndex microbenchmark."
	dependsOn tasks.named("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.teenkung.packforge.loader.PackIndexBenchmark"
	args layout.buildDirectory.dir("benchmark").get().asFile.absolutePath,
		java.util.Base64.encoder.encodeToString(groovy.json.JsonOutput.toJson(packforgeBuildPackMetadata(true)).getBytes("UTF-8"))
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaTarget)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaTarget)
	targetCompatibility = JavaVersion.toVersion(javaTarget)
}

jar {
	inputs.property "projectName", project.name
	inputs.property "licenseArtifactIdentity", "packforge-${packforgePlatformId}"
	duplicatesStrategy = DuplicatesStrategy.FAIL
	archiveFileName = "packforge-fabric-${project.version}-mc${packforgeArtifactMinecraft}.jar"

	from(new File(packforgeRepositoryRoot, "LICENSE")) {
		rename { "${it}_packforge-${packforgePlatformId}" }
	}
}

tasks.named("sourcesJar") {
	archiveFileName = "packforge-fabric-${project.version}-mc${packforgeArtifactMinecraft}-sources.jar"
	if (stonecutterDirectNode) {
		dependsOn(stonecutter.tasks.generate["main"])
		eachFile { details ->
			if (details.file.canonicalFile in legacyNativeSources
				|| (!nativeSharedZipActive && details.file.canonicalFile == generatedSharedZipSource)) {
				details.exclude()
			}
		}
	}
}

if (loaderConfig.mappingMode == "named") {
	tasks.named("remapJar") {
		archiveFileName = "packforge-fabric-${project.version}-mc${packforgeArtifactMinecraft}.jar"
	}
	tasks.named("remapSourcesJar") {
		archiveFileName = "packforge-fabric-${project.version}-mc${packforgeArtifactMinecraft}-sources.jar"
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}

if (stonecutterDirectNode) {
	// Retain Phase D's nested-build path as an explicit rollback and parity oracle.
	// The direct build task registered below never depends on this nested task.
	apply from: new File(packforgeRepositoryRoot, "stonecutter-build.gradle")

	def expectedDirectArtifactName = "packforge-fabric-${project.version}-mc${packforgeArtifactMinecraft}.jar"
	// Named mappings finish through Loom remapJar; official mappings publish the
	// configured jar directly and do not create a remapJar task.
	def finalArtifactTask = loaderConfig.mappingMode == 'named' ? tasks.named('remapJar') : tasks.named('jar')
	def directArtifact = finalArtifactTask.flatMap { task -> task.archiveFile }
	def delegatedArtifactForParity = new File(
		packforgePlatformSourceRoot,
		"build/${target.key}/libs/${expectedDirectArtifactName}"
	)
	ext.packforgeStonecutterDirectParity = [
		loaderId: 'Fabric',
		artifactProvider: directArtifact,
		expectedArtifactName: expectedDirectArtifactName,
		delegatedArtifact: delegatedArtifactForParity,
		directBuildDependencies: [tasks.named('build')],
		finalArtifactTask: finalArtifactTask,
		delegatedBuildTaskName: 'buildStonecutterDelegatedNode',
		loaderSpecificChecks: { File directFile, Map<String, List<String>> ignoredEntries ->
			def zip = new java.util.zip.ZipFile(directFile)
			try {
				def metadataEntry = zip.getEntry('fabric.mod.json')
				def capabilitiesEntry = zip.getEntry('packforge-capabilities.properties')
				def requiredEntries = [metadataEntry, capabilitiesEntry, zip.getEntry('packforge.accesswidener'), zip.getEntry(mainMixinConfig), zip.getEntry(clientMixinConfig)]
				if (requiredEntries.any { entry -> entry == null }) {
					throw new GradleException('Direct Fabric artifact is missing required metadata, mixin, or access-widener entries.')
				}
				def metadata = new JsonSlurper().parse(zip.getInputStream(metadataEntry))
				def capabilities = new Properties()
				zip.getInputStream(capabilitiesEntry).withCloseable { input -> capabilities.load(input) }
				if (metadata.id != 'packforge'
					|| metadata.version?.toString() != project.version.toString()
					|| metadata.depends?.minecraft?.toString() != loaderConfig.minecraftDependency.toString()
					|| metadata.depends?.fabricloader?.toString() != loaderConfig.loaderDependency.toString()
					|| capabilities.getProperty('target') != target.key.toString()
					|| capabilities.getProperty('minecraft') != packforgeArtifactMinecraft) {
					throw new GradleException("Direct Fabric artifact metadata does not match registry target '${target.key}'.")
				}
			} finally {
				zip.close()
			}
		}
	]
	apply from: new File(packforgeRepositoryRoot, 'gradle/packforge-stonecutter-direct-parity.gradle')
}
