	splitEnvironmentSourceSets()
	accessWidenerPath = accessWidenerFile

	if (!artifactSmoke) {
		mods {
			"packforge" {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}

	runs {
		client {
			runDir("run/${target.key}")
		}
	}
}

