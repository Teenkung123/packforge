plugins {
	alias(libs.plugins.loom.legacy) apply false
	alias(libs.plugins.loom.modern) apply false
	id 'maven-publish'
}

def targetDefinition = rootProject.packforgeRegistry.targets.find { it.key == project.name }
def loomPluginId = targetDefinition.platforms.fabric.mappingMode == 'named'
	? 'fabric-loom'
	: 'net.fabricmc.fabric-loom'
apply plugin: loomPluginId
loom.splitEnvironmentSourceSets()
apply from: rootProject.file('gradle/node.gradle')

def target = packforgeTarget
def platformConfig = packforgePlatform
def registry = rootProject.packforgeRegistry
def mixinExtrasPolicy = packforgeMixinExtras
def fabricMixinVersion = platformConfig.fabricMixinVersion ?: registry.fabricMixinVersion
def fabricApiVersion = packforgeRuntimeVersion('packforge_fabric_api_version_override', platformConfig.fabricApiVersion)
def accessWidener = rootProject.file(platformConfig.accessWidener)
repositories {
	maven { url = 'https://api.modrinth.com/maven' }
}
loom {
	accessWidenerPath = accessWidener
	mods {
		packforge {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs.client.runDir(packforgeRunDirectory.absolutePath)
}
dependencies {
	minecraft "com.mojang:minecraft:${packforgeRuntimeVersion('packforge_minecraft_version_override', target.minecraftVersion)}"
	if (platformConfig.mappingMode == 'named') {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${platformConfig.loaderVersion}"
		compileOnly "net.fabricmc:sponge-mixin:${fabricMixinVersion}"
		if (platformConfig.modMenuEntrypoint) {
			modCompileOnly "maven.modrinth:modmenu:${platformConfig.modMenuVersion}"
		}
	} else {
		implementation "net.fabricmc:fabric-loader:${platformConfig.loaderVersion}"
		['asm', 'asm-analysis', 'asm-commons', 'asm-tree', 'asm-util'].each { asmModule ->
			runtimeOnly "org.ow2.asm:${asmModule}:${registry.fabricAsmVersion}"
		}
		runtimeOnly "net.fabricmc:sponge-mixin:${fabricMixinVersion}"
		if (platformConfig.modMenuEntrypoint) {
			compileOnly "maven.modrinth:modmenu:${platformConfig.modMenuVersion}"
			add('localRuntime', "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}")
			add('localRuntime', "maven.modrinth:modmenu:${platformConfig.modMenuVersion}")
		}
	}
	if (fabricApiVersion) {
		compileOnly "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
	}
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixinExtrasPolicy.version}"))
	if (mixinExtrasPolicy.provider == 'bundled') {
		include "io.github.llamalad7:mixinextras-fabric:${mixinExtrasPolicy.version}:${mixinExtrasPolicy.classifier}"
	}
}
tasks.named('jar', Jar) {
	from(rootProject.file('LICENSE')) {
		rename { 'LICENSE_packforge-fabric' }
	}
}
def releaseJar = tasks.named(platformConfig.mappingMode == 'named' ? 'remapJar' : 'jar')
releaseJar.configure {
	archiveFileName = packforgeArtifactName
}
ext.packforgeArtifact = releaseJar.flatMap { it.archiveFile }
tasks.named('assemble') {
	dependsOn releaseJar
}
if (target.key == rootProject.packforgeSelectedTarget) {
	publishing.publications {
		mavenJava(MavenPublication) {
			artifactId = 'packforge-fabric'
			// Keep selected-target Maven coordinates without a dependency on :common.
			artifact releaseJar
		}
	}
}

// Local benchmark tooling is optional and is not part of a clean checkout.
def benchmarkObserver = rootProject.file('gradle/benchmark-observer.gradle')
if (benchmarkObserver.isFile()) {
	apply from: benchmarkObserver
}
