import org.gradle.api.file.ConfigurableFileCollection

plugins {
	alias(libs.plugins.loom.legacy) apply false
	alias(libs.plugins.loom.modern) apply false
	id 'maven-publish'
}

def targetData = rootProject.packforgeRegistry.targets.find { it.key == project.name }
apply plugin: targetData.platforms.fabric.mappingMode == 'named' ? 'fabric-loom' : 'net.fabricmc.fabric-loom'
loom.splitEnvironmentSourceSets()
apply from: rootProject.file('gradle/node.gradle')

def target = packforgeTarget
def loader = packforgePlatform
def registry = rootProject.packforgeRegistry
def smoke = packforgeArtifactSmoke
def accessWidener = rootProject.file(loader.accessWidener)
repositories { maven { url = 'https://api.modrinth.com/maven' } }
loom {
	accessWidenerPath = accessWidener
	if (!smoke) {
		mods {
			packforge {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}
	runs.client.runDir(packforgeRunDirectory.absolutePath)
}
dependencies {
	minecraft "com.mojang:minecraft:${packforgeRuntimeVersion('packforge_minecraft_version_override', target.minecraftVersion)}"
	if (loader.mappingMode == 'named') {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${loader.loaderVersion}"
		compileOnly "net.fabricmc:sponge-mixin:${registry.fabricMixinVersion}"
		if (loader.modMenuEntrypoint) modCompileOnly "maven.modrinth:modmenu:${loader.modMenuVersion}"
	} else {
		implementation "net.fabricmc:fabric-loader:${loader.loaderVersion}"
		['asm', 'asm-analysis', 'asm-commons', 'asm-tree', 'asm-util'].each {
			runtimeOnly "org.ow2.asm:${it}:${registry.fabricAsmVersion}"
		}
		runtimeOnly "net.fabricmc:sponge-mixin:${registry.fabricMixinVersion}"
		if (loader.modMenuEntrypoint) {
			compileOnly "maven.modrinth:modmenu:${loader.modMenuVersion}"
			if (!smoke) {
				add('localRuntime', "net.fabricmc.fabric-api:fabric-api:${loader.fabricApiVersion}")
				add('localRuntime', "maven.modrinth:modmenu:${loader.modMenuVersion}")
			}
		}
	}
	if (!smoke && loader.fabricApiVersion) compileOnly "net.fabricmc.fabric-api:fabric-api:${loader.fabricApiVersion}"
	implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${registry.mixinExtrasVersion}"))
	include "io.github.llamalad7:mixinextras-fabric:${registry.mixinExtrasVersion}"
}
if (smoke) {
	def commonOutput = project(':common').sourceSets.main.output
	def commonJarName = project(':common').tasks.named('jar').get().archiveFileName.get()
	tasks.named('runClient') {
		// Copy the declared inputs, not the mutable classpath collection itself.
		def launchClasspath = files(new ArrayList((classpath as ConfigurableFileCollection).from))
		classpath = launchClasspath.minus(sourceSets.main.output).minus(sourceSets.client.output).minus(commonOutput)
			.filter { it.name != commonJarName }
	}
}
tasks.named('jar', Jar) {
	from(rootProject.file('LICENSE')) { rename { "LICENSE_packforge-fabric" } }
}
def finalJar = tasks.named(loader.mappingMode == 'named' ? 'remapJar' : 'jar')
finalJar.configure { archiveFileName = packforgeArtifactName }
ext.packforgeArtifact = finalJar.flatMap { it.archiveFile }
tasks.named('assemble') { dependsOn finalJar }
if (target.key == rootProject.packforgeSelectedTarget) {
	publishing.publications {
		mavenJava(MavenPublication) {
			artifactId = 'packforge-fabric'
			// Keep selected-target Maven coordinates without a dependency on :common.
			artifact finalJar
		}
	}
}
