plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    implementation libs.gson
    implementation libs.asm
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation 'net.minecraftforge:JarJarSelector:0.3.19'
    testRuntimeOnly libs.junit.launcher
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.register('verifyDirectoryHooks', JavaExec) {
    group = 'verification'
    description = 'Validate the Files.find hook for every advertised game using a JSON map of version to mapped JAR.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.teenkung.packforge.verification.DirectoryHookVerifier'
    def manifest = providers.gradleProperty('packforge_directory_hook_manifest')
    args rootProject.file('gradle/minecraft-targets.json').absolutePath
    doFirst {
        args manifest.get()
    }
}
