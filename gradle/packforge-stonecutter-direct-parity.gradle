// Optional standalone-versus-direct parity oracle. The direct leaf task is
// registered by packforge-stonecutter-direct.gradle regardless of parity.
def parityPropertyName = 'packforge_enable_stonecutter_parity'
def parityPropertyValue = providers.gradleProperty(parityPropertyName).getOrNull()
def parityEnabled = false
if (parityPropertyValue != null) {
	if (!(parityPropertyValue.equalsIgnoreCase('true') || parityPropertyValue.equalsIgnoreCase('false'))) {
		throw new GradleException("Gradle property -P${parityPropertyName} must be true or false; found '${parityPropertyValue}'.")
	}
	parityEnabled = parityPropertyValue.toBoolean()
}

def directParity = project.extensions.extraProperties.has('packforgeStonecutterDirectParity')
	? project.extensions.extraProperties.get('packforgeStonecutterDirectParity')
	: null
if (!(directParity instanceof Map)) {
	throw new GradleException("${project.path} must configure packforgeStonecutterDirectParity before applying the parity helper.")
}

def requiredDirectKeys = [
	'loaderId', 'artifactProvider', 'expectedArtifactName', 'directBuildDependencies', 'finalArtifactTask'
]
def missingDirectKeys = requiredDirectKeys.findAll { !directParity.containsKey(it) || directParity[it] == null }
if (!missingDirectKeys.isEmpty()) {
	throw new GradleException("${project.path} direct/parity configuration is missing ${missingDirectKeys}.")
}

// The legacy wrapper is intentionally applied only for explicit parity. A
// normal direct graph therefore has no delegated task during configuration.
if (parityEnabled) {
	apply from: new File(rootProject.projectDir, 'gradle/packforge-stonecutter-legacy-parity.gradle')
}

def requiredParityKeys = ['delegatedArtifact', 'delegatedBuildTaskName']
def missingParityKeys = requiredParityKeys.findAll { !directParity.containsKey(it) || directParity[it] == null }
if (parityEnabled && !missingParityKeys.isEmpty()) {
	throw new GradleException("${project.path} parity configuration is missing ${missingParityKeys}.")
}

def parityLoaderId = directParity.loaderId.toString()
def directArtifact = directParity.artifactProvider
def expectedDirectArtifactName = directParity.expectedArtifactName.toString()
def delegatedArtifactForParity = parityEnabled ? directParity.delegatedArtifact as File : null
def delegatedBuildTask = parityEnabled
	? tasks.named(directParity.delegatedBuildTaskName.toString())
	: null
def directBuild = tasks.named('buildStonecutterDirectNode')
def finalArtifactTask = directParity.finalArtifactTask
def loaderSpecificChecks = directParity.loaderSpecificChecks

def hashStream = { InputStream input ->
	def digest = java.security.MessageDigest.getInstance('SHA-256')
	byte[] buffer = new byte[8192]
	int count
	while ((count = input.read(buffer)) != -1) {
		digest.update(buffer, 0, count)
	}
	java.util.HexFormat.of().formatHex(digest.digest())
}
def hashBytes = { byte[] bytes ->
	def digest = java.security.MessageDigest.getInstance('SHA-256')
	digest.update(bytes)
	java.util.HexFormat.of().formatHex(digest.digest())
}
def normalizedClassHash = { InputStream input ->
	// Direct Stonecutter preprocessing and the legacy wrapper can preserve
	// different source line tables while compiling identical class behavior.
	// Normalize only JVM debug metadata; annotations, fields, methods, and code
	// remain part of the parity comparison.
	// Resolve ASM reflectively because Gradle's embedded ASM is not exposed to
	// Groovy script compilation as a source-level dependency.
	def asmJar = new File(gradle.gradleHomeDir, 'lib').listFiles()?.find { file ->
		file.name.startsWith('asm-') && file.name.endsWith('.jar') && !file.name.startsWith('asm-commons-')
	}
	if (asmJar == null) {
		throw new GradleException('Gradle embedded ASM is required for semantic Stonecutter parity normalization.')
	}
	def asmLoader = new java.net.URLClassLoader([asmJar.toURI().toURL()] as URL[], this.class.classLoader)
	def classReaderType = Class.forName('org.objectweb.asm.ClassReader', true, asmLoader)
	def classWriterType = Class.forName('org.objectweb.asm.ClassWriter', true, asmLoader)
	def classVisitorType = Class.forName('org.objectweb.asm.ClassVisitor', true, asmLoader)
	def reader = classReaderType.getConstructor(InputStream).newInstance(input)
	def writer = classWriterType.getConstructor(Integer.TYPE).newInstance(Integer.valueOf(0))
	def skipDebug = classReaderType.getField('SKIP_DEBUG').getInt(null)
	classReaderType.getMethod('accept', classVisitorType, Integer.TYPE).invoke(reader, writer, Integer.valueOf(skipDebug))
	hashBytes(classWriterType.getMethod('toByteArray').invoke(writer) as byte[])
}
def expectedStonecutterManifestAttributes = [
	'Stonecutter-Plugin-Version': '0.9.7',
	'Stonecutter-Gradle-Version': gradle.gradleVersion,
	'Stonecutter-Node-Project': project.name,
	'Stonecutter-Node-Version': stonecutter.current.version.toString()
]
def normalizedManifestHash = { InputStream input, boolean directManifest ->
	def manifest = new java.util.jar.Manifest(input)
	def normalizeAttributes = { attributes ->
		def normalized = new TreeMap<String, String>()
		attributes.each { key, value -> normalized[key.toString()] = value.toString() }
		normalized
	}
	def mainAttributes = normalizeAttributes(manifest.mainAttributes)
	def actualStonecutterAttributes = mainAttributes.findAll { name, ignored -> name.startsWith('Stonecutter-') }
	def expectedAttributes = directManifest ? expectedStonecutterManifestAttributes : [:]
	if (actualStonecutterAttributes != expectedAttributes) {
		throw new GradleException("${parityLoaderId} artifact manifest Stonecutter attributes mismatch: expected=${expectedAttributes}, actual=${actualStonecutterAttributes}.")
	}
	expectedStonecutterManifestAttributes.keySet().each { name -> mainAttributes.remove(name) }
	def sections = new TreeMap<String, Map<String, String>>()
	manifest.entries.each { name, attributes -> sections[name] = normalizeAttributes(attributes) }
	def canonical = groovy.json.JsonOutput.toJson([main: mainAttributes, sections: sections])
	new ByteArrayInputStream(canonical.getBytes('UTF-8')).withCloseable(hashStream)
}
def inspectArtifact = { File artifact, boolean directManifest ->
	if (!artifact.isFile()) {
		throw new GradleException("Missing ${parityLoaderId} parity artifact: ${artifact}.")
	}
	def entryHashes = new TreeMap<String, List<String>>()
	def zip = new java.util.zip.ZipFile(artifact)
	try {
		zip.entries().each { entry ->
			def hashes = entryHashes.computeIfAbsent(entry.name) { ignored -> [] }
			if (entry.directory) {
				hashes.add('<directory>')
			} else if (entry.name == 'META-INF/MANIFEST.MF') {
				hashes.add(zip.getInputStream(entry).withCloseable { input -> normalizedManifestHash(input, directManifest) })
			} else if (entry.name.endsWith('.class')) {
				hashes.add(zip.getInputStream(entry).withCloseable(normalizedClassHash))
			} else {
				hashes.add(zip.getInputStream(entry).withCloseable(hashStream))
			}
		}
	} finally {
		zip.close()
	}
	def duplicates = entryHashes.findAll { name, hashes -> hashes.size() != 1 }.keySet().toList().sort()
	if (!duplicates.isEmpty()) {
		throw new GradleException("${parityLoaderId} artifact '${artifact.name}' contains duplicate ZIP entries: ${duplicates}.")
	}
	entryHashes.asImmutable()
}

finalArtifactTask.configure {
	if (parityEnabled) {
		mustRunAfter(delegatedBuildTask)
	}
}

tasks.register('verifyStonecutterDirectNode') {
	group = 'verification'
	description = parityEnabled
		? "Compares the direct final ${parityLoaderId} JAR with the standalone artifact by complete ZIP content."
		: "Requires explicit parity opt-in before comparing the direct ${parityLoaderId} JAR with the standalone artifact."
	dependsOn(':validateTargetRegistry')
	if (parityEnabled) {
		dependsOn(delegatedBuildTask)
		dependsOn(directBuild)
	}
	doFirst {
		if (!parityEnabled) {
			throw new GradleException("Stonecutter parity is disabled. Re-run with -P${parityPropertyName}=true to invoke the legacy wrapper parity oracle.")
		}
	}
	doLast {
		def directFile = directArtifact.get().asFile
		def directEntries = inspectArtifact(directFile, true)
		def delegatedEntries = inspectArtifact(delegatedArtifactForParity, false)
		if (directEntries != delegatedEntries) {
			def directNames = directEntries.keySet()
			def delegatedNames = delegatedEntries.keySet()
			def missing = delegatedNames.findAll { name -> !directNames.contains(name) }.sort()
			def extra = directNames.findAll { name -> !delegatedNames.contains(name) }.sort()
			def changed = directNames.intersect(delegatedNames)
				.findAll { name -> directEntries[name] != delegatedEntries[name] }
				.sort()
			throw new GradleException("Direct ${parityLoaderId} artifact differs from standalone artifact: missing=${missing}, extra=${extra}, changed=${changed}.")
		}
		if (loaderSpecificChecks != null) {
			loaderSpecificChecks.call(directFile, directEntries)
		}
		logger.lifecycle("Direct ${parityLoaderId} node parity verified: ${directFile.name} (${directEntries.size()} ZIP entries)")
	}
}
