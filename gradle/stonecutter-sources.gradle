import dev.kikugie.stonecutter.build.StonecutterBuildExtension

// Native prepare tasks preprocess templates; generate tasks expose the resulting Java sources.
def target = packforgeTarget
def loaderId = packforgeLoader
def adapter = target.apiAdapter
def supportedAdapters = ['mc1_20_1', 'mc1_21_1', 'mc1_21_4', 'mc1_21_8', 'mc1_21_11', 'mc26']
if (!(adapter in supportedAdapters) || target.platforms[loaderId] == null) {
	throw new GradleException("Unsupported template node ${project.path}")
}

def stonecutterBuild = extensions.getByType(StonecutterBuildExtension)
def usesUnbakedModel = adapter in ['mc1_21_4', 'mc1_21_8', 'mc1_21_11']
def replacements = [
	[before: 'ResourceLocation', after: 'Identifier', enabled: adapter in ['mc1_21_11', 'mc26']],
	[before: 'ModList.get().isLoaded', after: 'ModList.isLoaded', enabled: adapter == 'mc26'],
	[
		before: 'init(Minecraft.getInstance(), this.width, this.height)',
		after: 'init(this.width, this.height)',
		enabled: adapter == 'mc1_21_11'
	],
	[
		before: 'net.minecraft.client.renderer.block.model.BlockModel',
		after: 'net.minecraft.client.resources.model.UnbakedModel',
		enabled: usesUnbakedModel
	],
	[before: ', BlockModel>', after: ', UnbakedModel>', enabled: usesUnbakedModel],
	[before: 'packforge$batchModels', after: 'packforge$loadBlockModels', enabled: adapter == 'mc1_20_1'],
	[before: 'packforge$batchModels', after: 'packforge$batch', enabled: adapter == 'mc1_21_4'],
	[before: 'packforge$batchModels', after: 'packforge$loadModels', enabled: adapter in ['mc1_21_8', 'mc1_21_11']]
]
replacements.findAll { it.enabled }.each { replacement ->
	stonecutterBuild.replacements.string(true) { spec ->
		spec.replace(replacement.before, replacement.after)
	}
}

def mainGroups = ['all/main']
if (loaderId == 'forge') {
	mainGroups += 'forge/main'
}

def clientGroups = []
if (adapter != 'mc1_20_1') {
	clientGroups += 'all/client'
}
if (adapter != 'mc26') {
	clientGroups += 'legacy/client'
}
if (adapter.startsWith('mc1_21_')) {
	clientGroups += 'v1_21/client'
}

def groupsBySourceSet = loaderId == 'fabric'
	? [main: mainGroups, client: clientGroups]
	: [main: mainGroups + clientGroups]
def templateRoot = rootProject.file('src')
def templatePath = templateRoot.toPath()

// Stonecutter creates its task maps during project evaluation.
afterEvaluate {
	groupsBySourceSet.each { sourceSetName, groups ->
		def cacheDirectory = layout.buildDirectory.dir("stonecutter-cache/packforge/${sourceSetName}")
		def cacheRoot = cacheDirectory.get().asFile
		def cachePath = cacheRoot.toPath()
		def generatedSources = layout.buildDirectory.dir("generated/packforge-stonecutter/${sourceSetName}")
		def templatePatterns = groups.collect { "${it}/java/**/*.java" }

		def prepareSources = stonecutterBuild.tasks.prepare.getOrThrow(sourceSetName)
		prepareSources.configure {
			root.set(templateRoot)
			source.setFrom(fileTree(templateRoot) { include templatePatterns })
			destination.set(cacheDirectory)
		}

		def generateSources = stonecutterBuild.tasks.generate.getOrThrow(sourceSetName)
		generateSources.configure {
			into(generatedSources)
			// Prepare stores changed files only. Include unchanged templates as well.
			exclude { detail ->
				def sourcePath = detail.file.toPath()
				!sourcePath.startsWith(cachePath) && !sourcePath.startsWith(templatePath)
			}
			from(templateRoot) {
				include templatePatterns
				exclude { detail ->
					!detail.directory && new File(cacheRoot, detail.relativePath.pathString).isFile()
				}
			}
			duplicatesStrategy = DuplicatesStrategy.FAIL
		}
		groups.each { group ->
			sourceSets[sourceSetName].java.srcDir(generateSources.map {
				new File(it.destinationDir, "${group}/java")
			})
		}
	}
}
