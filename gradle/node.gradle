// Shared setup for each :<loader>:<target> project. Loader plugins are applied first.
def registry = rootProject.ext.packforgeRegistry
def loaderId = project.parent.name
def target = registry.targets.find { it.key == project.name }
if (target == null || target.platforms[loaderId] == null) {
	throw new GradleException("Invalid PackForge node ${project.path}")
}

def platformConfig = target.platforms[loaderId]
def isSelectedTarget = target.key == rootProject.packforgeSelectedTarget
def defaultRunDirectory = "platform/${loaderId}/run/${target.key}"
def runDirectory = isSelectedTarget
	? providers.gradleProperty('packforge_run_directory').getOrElse(defaultRunDirectory)
	: defaultRunDirectory
ext.packforgeRunDirectory = rootProject.file(runDirectory)
ext.packforgeRuntimeVersion = { String property, String defaultVersion ->
	isSelectedTarget ? providers.gradleProperty(property).getOrElse(defaultVersion) : defaultVersion
}
ext.packforgeTarget = target
ext.packforgePlatform = platformConfig
ext.packforgeLoader = loaderId
ext.packforgeMixinExtras = platformConfig.mixinExtras ?: registry.mixinExtrasPolicies[loaderId]
ext.packforgeArtifactName = "packforge-${loaderId}-${rootProject.version}${platformConfig.versionSuffix}-mc${target.artifactMinecraft}.jar"
version = "${rootProject.version}${platformConfig.versionSuffix}"
group = rootProject.group
layout.buildDirectory = rootProject.layout.buildDirectory.dir("nodes/${loaderId}/${target.key}")

evaluationDependsOn(':common')
def common = project(':common')
def sourceRoots = [
	"versions/${target.apiAdapter}/common",
	"platform/${loaderId}",
	"versions/${target.apiAdapter}/${loaderId}"
]
def clientSourceRoots = sourceRoots + (target.sharedAdapters ?: []).collect { adapter ->
	"versions/${adapter}/common"
}
def sourceDirectories = { roots, sourceSet, kind ->
	roots.collect { sourceRoot -> rootProject.file("${sourceRoot}/src/${sourceSet}/${kind}") }
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(target.javaVersion as int)
	sourceCompatibility = JavaVersion.toVersion(target.javaVersion)
	targetCompatibility = JavaVersion.toVersion(target.javaVersion)
}

sourceSets {
	main {
		java.setSrcDirs(sourceDirectories(sourceRoots, 'main', 'java'))
		resources.setSrcDirs(sourceDirectories(sourceRoots, 'main', 'resources'))
		if (loaderId != 'fabric') {
			java.srcDirs(sourceDirectories(clientSourceRoots, 'client', 'java'))
			resources.srcDirs(sourceDirectories(clientSourceRoots, 'client', 'resources'))
			resources.exclude('fabric.mod.json', 'packforge.accesswidener')
		}
	}
	if (loaderId == 'fabric') {
		client {
			java.setSrcDirs(sourceDirectories(clientSourceRoots, 'client', 'java'))
			resources.setSrcDirs(sourceDirectories(clientSourceRoots, 'client', 'resources'))
			if (!platformConfig.modMenuEntrypoint) {
				java.exclude('com/teenkung/packforge/client/config/PackForgeModMenuApi.java')
			}
		}
	}
	test {
		java.setSrcDirs(sourceDirectories(sourceRoots, 'test', 'java'))
		resources.setSrcDirs(sourceDirectories(sourceRoots, 'test', 'resources'))
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':common')
	testImplementation platform(libs.junit.bom)
	testImplementation libs.junit.jupiter
	testRuntimeOnly libs.junit.launcher
	testRuntimeOnly libs.slf4j.simple
}

tasks.withType(JavaCompile).configureEach {
	options.release = target.javaVersion as int
	options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.named('jar', Jar) {
	archiveFileName = packforgeArtifactName
	from(common.sourceSets.main.output)
}

apply from: rootProject.file('gradle/mod-resources.gradle')
apply from: rootProject.file('gradle/stonecutter-sources.gradle')
