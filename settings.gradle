import groovy.json.JsonSlurper

pluginManagement {
	def pluginRegistry = new JsonSlurper().parse(new File(settingsDir, 'gradle/minecraft-targets.json'))
	def effectiveStonecutterBuildMode = { target, loaderId ->
		(target.platforms[loaderId]?.stonecutterBuildMode
			?: pluginRegistry.stonecutterBuildDefaults?[loaderId]
			?: '<missing>').toString()
	}
	def fabricCells = pluginRegistry.targets.findAll { target -> target.platforms.fabric != null }
	def nonDirectFabricCells = fabricCells.findAll { target ->
		effectiveStonecutterBuildMode(target, 'fabric') != 'direct'
	}
	if (!nonDirectFabricCells.isEmpty()) {
		throw new GradleException("Root Stonecutter Fabric cells must use direct mode; cells=${nonDirectFabricCells*.key}.")
	}
	def fabricLoomVersions = fabricCells
		.collect { target -> target.platforms.fabric?.loomVersion?.toString() }
		.findAll { version -> version != null && !version.isBlank() }
		.toSet()
	if (!fabricCells.isEmpty() && fabricLoomVersions.size() != 1) {
		throw new GradleException("Direct Stonecutter Fabric cells require exactly one registry Loom version; cells=${fabricCells*.key}, found=${fabricLoomVersions.sort()}.")
	}
	def fabricLoomVersion = fabricLoomVersions.isEmpty() ? null : fabricLoomVersions.first()

	repositories {
		gradlePluginPortal()
		mavenCentral()
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.minecraftforge.net' }
		maven { url = 'https://maven.neoforged.net/releases' }
		maven { url = 'https://maven.kikugie.dev/releases' }
	}

	plugins {
		if (fabricLoomVersion != null) {
			id 'fabric-loom' version fabricLoomVersion
			id 'net.fabricmc.fabric-loom' version fabricLoomVersion
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	id 'dev.kikugie.stonecutter' version '0.9.7'
}

def registryFile = file('gradle/minecraft-targets.json')
def registry = new JsonSlurper().parse(registryFile)
if (registry.schemaVersion != 2) {
	throw new GradleException("Unsupported PackForge target registry schema '${registry.schemaVersion}'.")
}
if (!(registry.targets instanceof List) || registry.targets.isEmpty()) {
	throw new GradleException('PackForge target registry must declare at least one build target.')
}

def targetKeys = registry.targets.collect { it.key?.toString() }
if (targetKeys.any { it == null || it.isBlank() } || targetKeys.size() != targetKeys.toSet().size()) {
	throw new GradleException('PackForge target registry keys must be present and unique before Stonecutter project generation.')
}
if (registry.defaultTarget == null || registry.defaultTarget.toString() !in targetKeys) {
	throw new GradleException('PackForge target registry defaultTarget must identify a declared build target.')
}
if (registry.stonecutterVcsTarget == null || registry.stonecutterVcsTarget.toString() !in targetKeys) {
	throw new GradleException('PackForge target registry stonecutterVcsTarget must identify a declared build target.')
}

def expectedStonecutterSourceAnchors = registry.targets.collect { target ->
	if (target.minecraftVersion == null || target.minecraftVersion.toString().isBlank()) {
		throw new GradleException("PackForge target '${target.key}' must declare a Minecraft version for its Stonecutter source anchor.")
	}
	if (target.sourceFamily == null || target.sourceFamily.toString().isBlank()) {
		throw new GradleException("PackForge target '${target.key}' must declare a source family for its Stonecutter source anchor.")
	}
	[target: target.key.toString(), minecraftVersion: target.minecraftVersion.toString(), sourceFamily: target.sourceFamily.toString()]
}
if (expectedStonecutterSourceAnchors.collect { it.target }.size() != expectedStonecutterSourceAnchors.collect { it.target }.toSet().size()) {
	throw new GradleException('Every PackForge build target must resolve to exactly one Stonecutter source anchor.')
}

def loaderIds = new LinkedHashSet<String>()
def allowedStonecutterBuildModes = ['direct'] as Set
def stonecutterBuildDefaults = registry.stonecutterBuildDefaults ?: [:]
if (!(stonecutterBuildDefaults instanceof Map)) {
	throw new GradleException("PackForge stonecutterBuildDefaults must be a loader-to-mode map; found ${stonecutterBuildDefaults.getClass().name}.")
}
def effectiveStonecutterBuildMode = { target, loaderId ->
	(target.platforms[loaderId]?.stonecutterBuildMode
		?: stonecutterBuildDefaults[loaderId]
		?: '<missing>').toString()
}
registry.targets.each { target ->
	if (!(target.platforms instanceof Map) || target.platforms.isEmpty()) {
		throw new GradleException("PackForge target '${target.key}' must declare at least one loader platform.")
	}
	target.platforms.each { loaderId, platform ->
		loaderId = loaderId.toString()
		loaderIds.add(loaderId)
		def buildMode = effectiveStonecutterBuildMode(target, loaderId)
		if (buildMode !in allowedStonecutterBuildModes) {
			throw new GradleException("PackForge target '${target.key}' loader '${loaderId}' has unsupported Stonecutter build mode '${buildMode}'; allowed=${allowedStonecutterBuildModes.sort()}.")
		}
		def directBuildscript = new File(settingsDir, "platform/${loaderId}/build.gradle")
		if (buildMode == 'direct' && !directBuildscript.isFile()) {
			throw new GradleException("PackForge target '${target.key}' loader '${loaderId}' requests direct Stonecutter build without '${directBuildscript}'.")
		}
	}
}
def unknownDefaultLoaders = stonecutterBuildDefaults.keySet().collect { it.toString() }.findAll { it !in loaderIds }.sort()
if (!unknownDefaultLoaders.isEmpty()) {
	throw new GradleException("PackForge stonecutterBuildDefaults has unrecognized loader keys ${unknownDefaultLoaders}; known=${loaderIds.toList().sort()}.")
}
def invalidDefaultModes = stonecutterBuildDefaults.findAll { loaderId, mode -> mode == null || mode.toString() !in allowedStonecutterBuildModes }
if (!invalidDefaultModes.isEmpty()) {
	throw new GradleException("PackForge stonecutterBuildDefaults has unsupported modes ${invalidDefaultModes}; allowed=${allowedStonecutterBuildModes.sort()}.")
}

def expectedStonecutterNodePaths = []
def expectedDirectStonecutterNodePaths = []
stonecutter {
	kotlinController = false
	centralScript = 'stonecutter-build.gradle'
	create(rootProject) {
		loaderIds.each { loaderId ->
			branch(loaderId) {
				registry.targets.findAll { target -> target.platforms[loaderId] != null }.each { target ->
					def targetKey = target.key.toString()
					def nodePath = ":${loaderId}:${targetKey}"
					version(targetKey, target.minecraftVersion.toString()).buildscript("../platform/${loaderId}/build.gradle")
					expectedStonecutterNodePaths.add(nodePath)
					expectedDirectStonecutterNodePaths.add(nodePath)
				}
			}
		}
		vcsVersion = registry.stonecutterVcsTarget.toString()
	}
}

rootProject.name = 'packforge'

def actualLoaderBranches = rootProject.children.collect { it.name }.sort()
def expectedLoaderBranches = loaderIds.toList().sort()
if (actualLoaderBranches != expectedLoaderBranches) {
	throw new GradleException("Stonecutter loader branch mismatch: expected=${expectedLoaderBranches}, actual=${actualLoaderBranches}.")
}
def actualStonecutterNodePaths = rootProject.children.collectMany { loaderBranch ->
	loaderBranch.children.collect { node -> ":${loaderBranch.name}:${node.name}" }
}.sort()
expectedStonecutterNodePaths = expectedStonecutterNodePaths.sort()
if (actualStonecutterNodePaths != expectedStonecutterNodePaths) {
	throw new GradleException("Stonecutter registry node mismatch: expected=${expectedStonecutterNodePaths}, actual=${actualStonecutterNodePaths}.")
}
def actualDistributionCounts = rootProject.children.collectMany { it.children.collect { node -> node.name } }
	.countBy { it }
def expectedDistributionCounts = registry.targets.collectEntries { target ->
	[(target.key.toString()): target.platforms.size()]
}
if (actualDistributionCounts != expectedDistributionCounts) {
	throw new GradleException("Stonecutter target distribution multiplicity mismatch: expected=${expectedDistributionCounts}, actual=${actualDistributionCounts}.")
}

// Stonecutter owns the registry-derived loader branches and target nodes. Keep
// repository-level registry and release aggregation tasks available at root.
gradle.rootProject {
	ext.packforgeStonecutterNodePaths = expectedStonecutterNodePaths.asImmutable()
	ext.packforgeStonecutterDirectNodePaths = expectedDirectStonecutterNodePaths.sort().asImmutable()
	ext.packforgeStonecutterLoaderBranches = expectedLoaderBranches.asImmutable()
	ext.packforgeStonecutterSourceAnchors = expectedStonecutterSourceAnchors.collect { it.asImmutable() }.asImmutable()
	apply from: file('build.gradle')
}

// Loader projects remain independently runnable outside this root graph. Their
// nested wrapper path is retained only for explicit rollback/parity verification.
