pluginManagement {
	 repositories {
		 gradlePluginPortal()
		 maven { url = 'https://maven.kikugie.dev/releases' }
	 }
}

plugins {
	 id 'dev.kikugie.stonecutter' version '0.9.7'
}

stonecutter {
	kotlinController = false
	centralScript = 'stonecutter-build.gradle'
	 create(rootProject) {
		 version 'mc1_21_1', '1.21.1'
		 vcsVersion = 'mc1_21_1'
	 }
}

rootProject.name = 'packforge'

// Stonecutter owns the generated version nodes; keep the repository-level
// registry and release aggregation tasks available on the root project too.
gradle.rootProject {
	apply from: file('build.gradle')
}

// Loader projects are standalone builds invoked by the root aggregation tasks
// through the repository wrapper. Do not include them as composite builds here:
// doing so would make a globally installed Gradle resolve loader plugins before
// the compatible wrapper version gets a chance to run.
