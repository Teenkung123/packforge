import java.nio.file.Files

version = providers.gradleProperty('mod_version').get()
group = providers.gradleProperty('maven_group').get()
ext.packforgeRegistry = gradle.ext.packforgeRegistry

repositories {
	mavenCentral()
}

// The registry owns the release matrix. Runtime aliases use only the selected target.
def targets = packforgeRegistry.targets
def selectedTargetKey = providers.gradleProperty('packforge_target').getOrElse(packforgeRegistry.defaultTarget)
def selectedTarget = targets.find { it.key == selectedTargetKey }
if (selectedTarget == null) {
	throw new GradleException("Unknown target '${selectedTargetKey}'; valid: ${targets*.key}")
}
ext.packforgeSelectedTarget = selectedTargetKey

def targetProjects = targets.collectMany { target ->
	target.platforms.keySet().collect { loader ->
		[target: target, loader: loader, path: ":${loader}:${target.key}"]
	}
}
def selectedTargetProjects = targetProjects.findAll { it.target.key == selectedTargetKey }

configurations {
	verifierRuntime {
		canBeConsumed = false
		canBeResolved = true
		attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
	}
}

dependencies {
	verifierRuntime project(':verification')
}

def verificationClasspath = configurations.verifierRuntime
def registryFile = file('gradle/minecraft-targets.json')
def repositoryDirectory = projectDir
def artifactDirectory = layout.buildDirectory.dir('libs')
def modVersion = version.toString()

def registerArtifactVerification = { String taskName, String targetKey, Object artifactCollection ->
	tasks.register(taskName, JavaExec) {
		group = 'verification'
		description = targetKey == null
			? 'Verifies all supported release JARs in build/libs.'
			: "Verifies the release JARs for ${targetKey}."
		classpath = verificationClasspath
		mainClass = 'com.teenkung.packforge.verification.ArtifactVerifier'
		args registryFile.absolutePath, artifactDirectory.get().asFile.absolutePath, modVersion
		if (targetKey != null) {
			args targetKey
		}
		if (artifactCollection != null) {
			dependsOn artifactCollection
		}
		inputs.file(registryFile)
		inputs.files(fileTree(artifactDirectory) { include '**/packforge-*.jar' })
		inputs.property('modVersion', modVersion)
		outputs.file(layout.buildDirectory.file("verification/${taskName}.ok"))
		doLast {
			outputs.files.singleFile.text = 'verified\n'
		}
	}
}

tasks.register('validateTargetRegistry', JavaExec) {
	group = 'verification'
	description = 'Checks the target registry against source files and supported capabilities.'
	classpath = verificationClasspath
	mainClass = 'com.teenkung.packforge.verification.RegistryValidator'
	args registryFile.absolutePath, repositoryDirectory.absolutePath
	inputs.file(registryFile)
	inputs.files(fileTree('versions') { include '**/*.java', '**/*.json' })
	inputs.files(fileTree('src') { include '**/*.java' })
	outputs.file(layout.buildDirectory.file('verification/registry.ok'))
	doLast {
		outputs.files.singleFile.text = 'verified\n'
	}
}

// Provider-backed collection keeps Gradle aware of the final remap/reobf producers.
def collectAllArtifacts = tasks.register('collectPlatformJars', Copy) {
	group = 'build'
	description = 'Collects the exact full release matrix into build/libs.'
	duplicatesStrategy = DuplicatesStrategy.FAIL
	targetProjects.each { targetProject ->
		from(providers.provider { project(targetProject.path).packforgeArtifact })
	}
	into artifactDirectory
	def expectedNames = targetProjects.collect { targetProject ->
		def platformConfig = targetProject.target.platforms[targetProject.loader]
		"packforge-${targetProject.loader}-${modVersion}${platformConfig.versionSuffix}-mc${targetProject.target.artifactMinecraft}.jar".toString()
	}.toSet()
	inputs.property('expectedArtifactNames', expectedNames.sort())
	doFirst {
		def obsolete = fileTree(artifactDirectory) { include 'packforge-*.jar' }.files.findAll {
			!expectedNames.contains(it.name)
		}
		if (!obsolete.empty) {
			def archiveBase = layout.buildDirectory.dir('superseded-artifacts').get().asFile.toPath()
			Files.createDirectories(archiveBase)
			def archive = Files.createTempDirectory(archiveBase, 'release-')
			obsolete.each { previous ->
				Files.move(previous.toPath(), archive.resolve(previous.name))
			}
			logger.lifecycle("Preserved ${obsolete.size()} superseded artifacts in ${archive}")
		}
	}
}

def verifyAllArtifacts = registerArtifactVerification('verifyAllArtifacts', null, collectAllArtifacts)
registerArtifactVerification('verifyExistingArtifacts', null, null)

tasks.register('buildAllSupported') {
	group = 'build'
	description = 'Builds, tests and verifies all supported artifacts.'
	dependsOn ':common:check', ':verification:test', 'validateTargetRegistry'
	dependsOn targetProjects.collect { "${it.path}:build" }
	dependsOn verifyAllArtifacts
}

tasks.register('build') {
	group = 'build'
	description = 'Builds the complete supported release matrix.'
	dependsOn tasks.named('buildAllSupported')
}

def collectTargetArtifacts = tasks.register('collectTargetJars', Copy) {
	group = 'build'
	description = 'Collects the selected target\'s release JARs into build/libs.'
	duplicatesStrategy = DuplicatesStrategy.FAIL
	selectedTargetProjects.each { targetProject ->
		from(providers.provider { project(targetProject.path).packforgeArtifact })
	}
	into artifactDirectory
}

def verifyTargetArtifacts = registerArtifactVerification('verifyTargetArtifacts', selectedTargetKey, collectTargetArtifacts)

tasks.register('buildTarget') {
	group = 'build'
	description = 'Builds every enabled loader for -Ppackforge_target.'
	dependsOn ':common:check', ':verification:test', 'validateTargetRegistry'
	dependsOn selectedTargetProjects.collect { "${it.path}:build" }
	dependsOn verifyTargetArtifacts
}

def loaderLabels = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge']
loaderLabels.findAll { loader, label -> selectedTarget.platforms[loader] != null }.each { loader, label ->
	tasks.register("run${label}Client") {
		group = 'run'
		description = "Runs the ${label} development client for ${selectedTargetKey}."
		dependsOn ":${loader}:${selectedTargetKey}:runClient"
	}
}

apply from: 'gradle/clean.gradle'
