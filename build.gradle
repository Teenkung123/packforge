					if (!names.contains(requiredClass)) {
						throw new GradleException("${artifact.name} declares ${capability} but is missing implementation class ${requiredClass}.")
					}
				}
				if (contract.anyClasses && !contract.anyClasses.any { names.contains(it) }) {
					throw new GradleException("${artifact.name} declares ${capability} but is missing every supported implementation class: ${contract.anyClasses.join(', ')}.")
				}
				(contract.mainMixins ?: []).each { requiredMixin ->
					if (!(mainMixin.mixins ?: []).contains(requiredMixin)) {
						throw new GradleException("${artifact.name} declares ${capability} but does not register main mixin ${requiredMixin}.")
					}
				}
				(contract.clientMixins ?: []).each { requiredMixin ->
					if (!(clientMixin.client ?: []).contains(requiredMixin)) {
						throw new GradleException("${artifact.name} declares ${capability} but does not register client mixin ${requiredMixin}.")
					}
				}
				if (contract.anyClientMixins && !contract.anyClientMixins.any { (clientMixin.client ?: []).contains(it) }) {
					throw new GradleException("${artifact.name} declares ${capability} but does not register any supported client mixin: ${contract.anyClientMixins.join(', ')}.")
				}
			}
		}

		def coreClass = archive.getEntry("com/teenkung/packforge/PackForgeCore.class")
		if (coreClass == null) {
			throw new GradleException("${artifact.name} is missing PackForgeCore.class.")
		}
		def header = archive.getInputStream(coreClass).withCloseable { it.readNBytes(8) }
		def actualMajor = (Byte.toUnsignedInt(header[6]) << 8) | Byte.toUnsignedInt(header[7])
		def expectedMajor = [17: 61, 21: 65, 25: 69][target.javaVersion as int]
		if (actualMajor != expectedMajor) {
			throw new GradleException("${artifact.name} uses class-file major ${actualMajor}; expected ${expectedMajor}.")
		}

		if (platform.id == "fabric") {
			def fabricMetadata = new JsonSlurper().parseText(readZipText(archive, "fabric.mod.json"))
			def expectedFabricDepends = [
				fabricloader: loader.loaderDependency.toString(),
				minecraft: loader.minecraftDependency.toString(),
				java: ">=${target.javaVersion}"
			]
			if (fabricMetadata.depends != expectedFabricDepends) {
				throw new GradleException("${artifact.name} has incorrect Fabric dependencies; only Fabric Loader, Minecraft, and Java may be required.")
			}
			if (loader.modMenuEntrypoint
				&& (fabricMetadata.entrypoints.modmenu != ["com.teenkung.packforge.client.config.PackForgeModMenuApi"]
					|| fabricMetadata.suggests.modmenu != "*"
					|| !names.contains("com/teenkung/packforge/client/config/PackForgeModMenuApi.class"))) {
				throw new GradleException("${artifact.name} has incomplete optional Mod Menu configuration integration.")
			}
			def accessWidener = readZipText(archive, "packforge.accesswidener").readLines().first().trim().split(/\s+/).toList()
			def expectedNamespace = target.legacyApi ? "intermediary" : "official"
			if (accessWidener != ["accessWidener", "v2", expectedNamespace]) {
				throw new GradleException("${artifact.name} has access-widener header '${accessWidener.join(' ')}', expected namespace '${expectedNamespace}'.")
			}
		} else if (platform.id == "forge") {
			def modsToml = readZipText(archive, metadataDescriptor)
			if (!modsToml.contains("versionRange=\"${loader.versionRange}\"")
				|| !modsToml.contains("versionRange=\"${loader.minecraftVersionRange}\"")) {
				throw new GradleException("${artifact.name} has incorrect Forge dependency ranges.")
			}
			if (target.minecraftVersion == "1.20.1") {
				def legacyRefmaps = []
				[mainMixinConfig, clientMixinConfig].each { mixinPath ->
					def mixin = new JsonSlurper().parseText(readZipText(archive, mixinPath.toString()))
					if (!(mixin.refmap instanceof String) || mixin.refmap.isBlank() || archive.getEntry(mixin.refmap) == null) {
						throw new GradleException("${artifact.name} is missing the generated legacy Forge Mixin refmap for ${mixinPath}.")
					}
					def refmapText = readZipText(archive, mixin.refmap)
					def intermediarySelector = refmapText =~ /\b(?:method|field)_[0-9]+\b/
					if (intermediarySelector.find()) {
						throw new GradleException("${artifact.name} retains unmapped intermediary selector '${intermediarySelector.group()}' in ${mixin.refmap}.")
					}
					legacyRefmaps << new JsonSlurper().parseText(refmapText)
				}

				def legacyMappings = legacyRefmaps.collect { it.mappings ?: [:] }.inject([:]) { merged, mappings ->
					merged.putAll(mappings as Map)
					merged
				}
				def reloadMappings = legacyMappings["com/teenkung/packforge/mixin/observe/SimpleReloadInstanceMixin"] as Map
				def remappedStateFactoryHook = reloadMappings?.find { selector, mapped ->
					selector.toString().startsWith("Lnet/minecraft/server/packs/resources/SimpleReloadInstance\$StateFactory;create(")
						&& mapped.toString().contains(";m_")
				}
				if (remappedStateFactoryHook == null || !reloadMappings.containsKey("<init>")) {
					throw new GradleException("${artifact.name} is missing the remapped structural SimpleReloadInstance constructor/StateFactory hook required by Forge 1.20.1.")
				}

				def spriteMappings = legacyMappings["com/teenkung/packforge/client/mixin/atlas/SpriteLoaderMixin"] as Map
				def remappedAtlasHook = spriteMappings?.get("loadAndStitch")?.toString()
				if (remappedAtlasHook == null || !remappedAtlasHook.contains(";m_")) {
					throw new GradleException("${artifact.name} is missing the remapped structural SpriteLoader loadAndStitch hook required by Forge 1.20.1.")
				}
			}
		} else if (platform.id == "neoforge") {
			def modsToml = readZipText(archive, metadataDescriptor)
			if (!modsToml.contains("versionRange=\"${loader.versionRange}\"")
				|| !modsToml.contains("versionRange=\"${loader.minecraftVersionRange}\"")) {
				throw new GradleException("${artifact.name} has incorrect NeoForge dependency ranges.")
			}
		}
	}
}
def nestedCommand = { platform, target, taskName ->
	def usesNeoForgeWrapper = platform.id == "neoforge"
	def launcher = usesNeoForgeWrapper
		? (isWindows ? ["platform/neoforge/gradlew.bat"] : ["bash", "platform/neoforge/gradlew"])
		: [gradlew]
	launcher + ["-p", platform.path, "-Ppackforge_target=${target.key}", taskName]
}

def handwrittenProductionJava = files(
	fileTree("common") {
		include "src/main/java/**/*.java"
		include "src/client/java/**/*.java"
	},
	fileTree("platform") {
		include "*/src/main/java/**/*.java"
		include "*/src/client/java/**/*.java"
	},
	fileTree("versions") {
		include "**/src/main/java/**/*.java"
		include "**/src/client/java/**/*.java"
	}
)
def sourceMetricsBuildJson = layout.buildDirectory.file("reports/source-metrics/source-metrics.json")
def sourceMetricsBuildMarkdown = layout.buildDirectory.file("reports/source-metrics/source-metrics.md")
def sourceMetricsCheckpointJson = file("docs/stonecutter-refactor/source-metrics-current.json")
def sourceMetricsCheckpointMarkdown = file("docs/stonecutter-refactor/source-metrics-current.md")
def reportSourceMetrics = tasks.register("reportSourceMetrics") {
	group = "verification"
	description = "Reports deterministic handwritten-source, ownership, build-branch, renderer, and publication metrics."
	inputs.file(registryFile)
	outputs.files(sourceMetricsBuildJson, sourceMetricsBuildMarkdown)
	outputs.upToDateWhen { false }

	doLast {
		def countLoc = { File source ->
			source.readLines("UTF-8").count { line -> !line.trim().isEmpty() }
		}
		def normalizeJavaBlock = { File source ->
			source.getText("UTF-8")
				.replaceAll(/(?s)\/\*.*?\*\//, "")
				.replaceAll(/(?m)\/\/.*$/, "")
				.replaceAll(/\s+/, "")
		}
		def hashText = { String text ->
			MessageDigest.getInstance("SHA-256")
				.digest(text.getBytes("UTF-8"))
				.encodeHex()
				.toString()
		}
		def sourceLayer = { String relativePath, boolean bridge ->
			if (relativePath.startsWith("common/")) {
				return "neutralCommon"
			}
			if (relativePath.startsWith("platform/")
				|| relativePath.matches("versions/[^/]+/(?:fabric|forge|neoforge)/src/.*")) {
				return "loaderCommon"
			}
			if (bridge) {
				return "exactVersionBridge"
			}
			return "versionCommon"
		}
		def rows = handwrittenProductionJava.files
			.collect { source ->
				def relativePath = project.relativePath(source).replace('\\', '/')
				def bridge = relativePath.startsWith("platform/")
					|| (relativePath.startsWith("versions/") && relativePath.contains("/mixin/"))
					|| relativePath.matches("versions/[^/]+/(?:fabric|forge|neoforge)/src/.*")
					|| relativePath.matches(".*/com/teenkung/packforge/(?:fabric|forge|neoforge)/.*")
					|| (source.name ==~ /.*(?:Bridge|Compat|Accessor|Invoker)\.java/)
				[
					file: source,
					path: relativePath,
					loc: countLoc(source),
					bridge: bridge,
					rawHash: hashText(source.getText("UTF-8")),
					normalizedHash: relativePath.startsWith("versions/")
						? hashText(normalizeJavaBlock(source))
						: null,
					layer: sourceLayer(relativePath, bridge)
				]
			}
			.sort { left, right -> left.path <=> right.path }

		def exactDuplicateGroups = rows
			.groupBy { row -> row.rawHash }
			.values()
			.findAll { group -> group.size() > 1 }
			.collect { group -> group.sort { left, right -> left.path <=> right.path } }
			.sort { left, right -> left.first().path <=> right.first().path }
		def quickPackInternalReferencePaths = rows
			.findAll { row ->
				def source = file(row.path)
				def text = source.getText("UTF-8")
				text.contains("me.drex.quickpack") || text.contains("me/drex/quickpack")
			}
			.collect { row -> row.path }
		def versionRows = rows.findAll { row -> row.normalizedHash != null }
		def duplicateGroups = versionRows
			.groupBy { row -> row.normalizedHash }
			.values()
			.findAll { group -> group.size() > 1 }
			.collect { group -> group.sort { left, right -> left.path <=> right.path } }
			.sort { left, right -> left.first().path <=> right.first().path }
		int duplicateFiles = duplicateGroups.sum(0) { group -> group.size() }
		int duplicateSurplusLoc = duplicateGroups.sum(0) { group ->
			group.drop(1).sum(0) { row -> row.loc }
		}
		int productionLoc = rows.sum(0) { row -> row.loc }
		int bridgeLoc = rows.findAll { row -> row.bridge }.sum(0) { row -> row.loc }
		int bridgeFiles = rows.count { row -> row.bridge }
		int supportedExactTargets = registry.releaseCells.size()
		def locPerTarget = supportedExactTargets == 0
			? BigDecimal.ZERO
			: (productionLoc / supportedExactTargets).setScale(2, BigDecimal.ROUND_HALF_UP)
		def bridgePercent = productionLoc == 0
			? BigDecimal.ZERO
			: (bridgeLoc * 100 / productionLoc).setScale(2, BigDecimal.ROUND_HALF_UP)
		def sourceLayers = ["neutralCommon", "versionCommon", "loaderCommon", "exactVersionBridge"]
			.collectEntries { layer ->
				def layerRows = rows.findAll { row -> row.layer == layer }
				[(layer): [
					files: layerRows.size(),
					loc: layerRows.sum(0) { row -> row.loc }
				]]
			}

		def buildScriptFiles = files(
			file("build.gradle"),
			file("settings.gradle"),
			file("stonecutter.gradle"),
			file("stonecutter-build.gradle"),
			fileTree("gradle") { include "**/*.gradle" },
			fileTree("platform") { include "*/build.gradle" }
		).files.findAll { it.isFile() }.sort { left, right ->
			project.relativePath(left) <=> project.relativePath(right)
		}
		int targetKeyReferences = 0
		int targetVersionReferences = 0
		int targetKeyLiteralReferences = 0
		int targetBranchLines = 0
		int platformTargetKeyReferences = 0
		def targetLiteralPattern = ~/\bmc(?:1_[0-9_]+|26(?:_[0-9_]+)?)\b/
		buildScriptFiles.each { script ->
			boolean platformScript = project.relativePath(script).replace('\\', '/').startsWith("platform/")
			script.readLines("UTF-8").each { line ->
				int lineTargetKeyReferences = (line =~ /\btarget\.key\b/).findAll().size()
				int lineTargetVersionReferences = (line =~ /\btarget\.(?:minecraftVersion|id)\b/).findAll().size()
				int lineTargetKeyLiteralReferences = (line =~ targetLiteralPattern).findAll().size()
				targetKeyReferences += lineTargetKeyReferences
				targetVersionReferences += lineTargetVersionReferences
				targetKeyLiteralReferences += lineTargetKeyLiteralReferences
				if (platformScript) {
					platformTargetKeyReferences += lineTargetKeyReferences
				}
				if ((lineTargetKeyReferences > 0 || lineTargetVersionReferences > 0 || lineTargetKeyLiteralReferences > 0)
					&& line ==~ /.*(?:\bif\b|\bswitch\b|\bcase\b|\?.*:).*/) {
					targetBranchLines++
				}
			}
		}

		def configScreenFiles = rows.findAll { row ->
			row.path.matches("versions/[^/]+/common/src/client/java/.+/PackForgeConfigScreen(?:Base)?\\.java")
		}
		def configScreenAdapters = configScreenFiles
			.findAll { row -> row.file.getText("UTF-8").contains("extends PackForgeConfigScreenBase") }
			.collect { row -> row.path }
		def configScreenRendererBodies = configScreenFiles
			.findAll { row -> !configScreenAdapters.contains(row.path) }
			.collect { row -> row.path }
		def exactLoaderCells = registry.releaseCells.sum(0) { cell -> cell.loaderAvailability.size() }
		def capabilityOwnership = capabilityContract.keySet().collect { it.toString() }.sort().collectEntries { capability ->
			def contract = capabilityContract[capability]
			def implementationClasses = []
			implementationClasses.addAll((contract.classes ?: []).collect { it.toString() })
			implementationClasses.addAll((contract.anyClasses ?: []).collect { it.toString() })
			def mixinHooks = []
			mixinHooks.addAll((contract.mainMixins ?: []).collect { "main:${it}" })
			mixinHooks.addAll((contract.clientMixins ?: []).collect { "client:${it}" })
			mixinHooks.addAll((contract.anyClientMixins ?: []).collect { "client-any:${it}" })
			[(capability): [
				policyOwner: "common/src/main/java/com/teenkung/packforge/config/FeaturePolicy.java",
				implementationClasses: implementationClasses.sort(),
				mixinHooks: mixinHooks.sort()
			]]
		}

		int conditionalBlocks = 0
		int maxConditionalBlockLines = 0
		def oversizedConditionalBlocks = []
		rows.each { row ->
			int depth = 0
			int blockLines = 0
			int blockStart = 0
			row.file.readLines("UTF-8").eachWithIndex { line, index ->
				def trimmed = line.trim()
				if (trimmed ==~ /\/\/\?\s*if\b.*/) {
					if (depth == 0) {
						conditionalBlocks++
						blockLines = 0
						blockStart = index + 1
					}
					depth++
				} else if (trimmed ==~ /\/\/\?\s*}\s*/) {
					depth--
					if (depth < 0) {
						throw new GradleException("${row.path}:${index + 1} closes a Stonecutter block that was not opened.")
					}
					if (depth == 0) {
						maxConditionalBlockLines = Math.max(maxConditionalBlockLines, blockLines)
						if (blockLines > 40) {
							oversizedConditionalBlocks << "${row.path}:${blockStart} (${blockLines} lines)"
						}
					}
				} else if (depth > 0) {
					blockLines++
				}
			}
			if (depth != 0) {
				throw new GradleException("${row.path} contains an unclosed Stonecutter conditional block.")
			}
		}

		def duplicateReductionPercent = duplicateGroups.isEmpty()
			? new BigDecimal("100.00")
			: ((20 - duplicateGroups.size()) * 100 / 20).setScale(2, BigDecimal.ROUND_HALF_UP)
		def metrics = [
			schemaVersion: 1,
			generatedBy: "reportSourceMetrics",
			exclusions: [
				tests: true,
				generatedSources: true,
				buildOutput: true,
				documentation: true,
				vendoredThirdParty: true,
				generatedLoc: 0,
				generatedPolicy: "All build/generated/Stonecutter output lies outside handwritten source roots."
			],
			production: [
				files: rows.size(),
				nonblankLoc: productionLoc,
				bridgeFiles: bridgeFiles,
				bridgeLoc: bridgeLoc,
				bridgePercent: bridgePercent,
				locPerExactRelease: locPerTarget,
				layerPrecedence: ["neutralCommon", "loaderCommon", "exactVersionBridge", "versionCommon"],
				aggregateBridgePolicy: "Bridge totals include loader-owned bridge/compat files plus non-loader exact-version bridges.",
				layers: sourceLayers
			],
			duplicates: [
				exactGroups: exactDuplicateGroups.collect { group -> group.collect { row -> row.path } },
				normalizedVersionGroups: duplicateGroups.collect { group -> group.collect { row -> row.path } },
				normalizedFiles: duplicateFiles,
				normalizedSurplusLoc: duplicateSurplusLoc,
				baselineNormalizedGroups: 20,
				baselineNormalizedSurplusLoc: 2375,
				normalizedGroupReductionPercent: duplicateReductionPercent
			],
			buildBranches: [
				targetKeyReferences: targetKeyReferences,
				platformTargetKeyReferences: platformTargetKeyReferences,
				targetVersionReferences: targetVersionReferences,
				targetKeyLiteralReferences: targetKeyLiteralReferences,
				targetConditionalLines: targetBranchLines
			],
			configuration: [
				rendererBodyCount: configScreenRendererBodies.size(),
				rendererBodies: configScreenRendererBodies,
				rendererAdapterCount: configScreenAdapters.size(),
				rendererAdapters: configScreenAdapters
			],
			matrix: [
				exactReleaseCells: supportedExactTargets,
				exactLoaderCells: exactLoaderCells,
				registeredBuildTargets: targets.size(),
				publicationArtifacts: expectedArtifactNames.size(),
				publicationArtifactNames: expectedArtifactNames
			],
			stonecutter: [
				conditionalBlocks: conditionalBlocks,
				maxConditionalBlockLines: maxConditionalBlockLines
			],
			compatibility: [
				quickPackInternalReferencePaths: quickPackInternalReferencePaths
			],
			capabilityOwnership: capabilityOwnership
		]

		def metricsJson = sourceMetricsBuildJson.get().asFile
		def metricsMarkdown = sourceMetricsBuildMarkdown.get().asFile
		def metricsDirectory = metricsJson.parentFile
		metricsDirectory.mkdirs()
		def metricsJsonText = JsonOutput.prettyPrint(JsonOutput.toJson(metrics))
			.readLines()
			.findAll { !it.trim().isEmpty() }
			.join("\n")
		metricsJson.setText(metricsJsonText + "\n", "UTF-8")
		def layerRows = sourceLayers.collect { layer, counts -> "| `${layer}` | ${counts.files} | ${counts.loc} |" }.join("\n")
		def capabilityRows = capabilityOwnership.collect { capability, ownership ->
			def classes = ownership.implementationClasses.isEmpty() ? "None" : ownership.implementationClasses.collect { "`${it}`" }.join("<br>")
			def mixins = ownership.mixinHooks.isEmpty() ? "None" : ownership.mixinHooks.collect { "`${it}`" }.join("<br>")
			"| `${capability}` | `${ownership.policyOwner}` | ${classes} | ${mixins} |"
		}.join("\n")
		def exactDuplicateRows = exactDuplicateGroups.isEmpty()
			? "None."
			: (0..<exactDuplicateGroups.size()).collect { index -> "${index + 1}. " + exactDuplicateGroups[index].collect { "`${it.path}`" }.join(", ") }.join("\n")
		def normalizedDuplicateRows = duplicateGroups.isEmpty()
			? "None."
			: (0..<duplicateGroups.size()).collect { index -> "${index + 1}. " + duplicateGroups[index].collect { "`${it.path}`" }.join(", ") }.join("\n")
		def humanReport = """# Current source metrics

Generated deterministically by `./gradlew.bat reportSourceMetrics`. The checked-in copy is refreshed only with `updateSourceMetricsCheckpoint` at a verified stable checkpoint. Tests, generated sources, build output, documentation, and vendored third-party code are excluded.

## Summary

| Metric | Value |
|---|---:|
| Production Java files | ${rows.size()} |
| Production nonblank LOC | ${productionLoc} |
| Bridge files | ${bridgeFiles} |
| Bridge LOC | ${bridgeLoc} (${bridgePercent}%) |
| Exact duplicate groups | ${exactDuplicateGroups.size()} |
| Normalized version duplicate groups | ${duplicateGroups.size()} |
| Platform `target.key` references | ${platformTargetKeyReferences} |
| Target-key/version conditional lines | ${targetBranchLines} |
| Configuration renderer bodies | ${configScreenRendererBodies.size()} |
| Configuration renderer adapters | ${configScreenAdapters.size()} |
| Exact release cells | ${supportedExactTargets} |
| Exact loader cells | ${exactLoaderCells} |
| Registered build targets | ${targets.size()} |
| Publication artifacts | ${expectedArtifactNames.size()} |
| Quick Pack implementation references | ${quickPackInternalReferencePaths.size()} |

## Source layers

| Layer | Files | Nonblank LOC |
|---|---:|---:|
${layerRows}

Classification is exclusive and precedence-ordered: root `common` is neutral common; platform and version-loader directories are loader common; remaining version-local mixin/bridge/compat paths are exact-version bridges; all other Minecraft-facing version source is version common. Aggregate bridge files/LOC include loader-owned bridge/compat files as well as the non-loader `exactVersionBridge` layer.

## Duplicate groups

### Exact

${exactDuplicateRows}

### Comment/whitespace-normalized version files

${normalizedDuplicateRows}

## Configuration renderer bodies

${configScreenRendererBodies.isEmpty() ? "None." : configScreenRendererBodies.collect { "- `${it}`" }.join("\n")}

## Configuration renderer adapters

${configScreenAdapters.isEmpty() ? "None." : configScreenAdapters.collect { "- `${it}`" }.join("\n")}

## Capability ownership

| Capability | Policy owner | Implementation proof classes | Mixin hooks |
|---|---|---|---|
${capabilityRows}
"""
		metricsMarkdown.setText(humanReport.stripIndent().replace("\r\n", "\n").replace("\r", "\n"), "UTF-8")

		println("PackForge source metrics")
		println("productionFiles=${rows.size()}")
		println("productionLoc=${productionLoc}")
		println("bridgeFiles=${bridgeFiles}")
		println("bridgeLoc=${bridgeLoc}")
		println("bridgePercent=${bridgePercent}")
		println("exactDuplicateGroups=${exactDuplicateGroups.size()}")
		println("normalizedDuplicateBlocks=${duplicateGroups.size()}")
		println("normalizedDuplicateFiles=${duplicateFiles}")
		println("normalizedDuplicateSurplusLoc=${duplicateSurplusLoc}")
		println("baselineNormalizedDuplicateBlocks=20")
		println("baselineNormalizedDuplicateSurplusLoc=2375")
		println("normalizedDuplicateBlockReductionPercent=${duplicateReductionPercent}")
		println("generatedLocExcluded=0")
		println("generatedExclusionPolicy=all build/generated/Stonecutter output lies outside handwritten source roots")
		println("supportedExactTargetCount=${supportedExactTargets}")
		println("exactLoaderCellCount=${exactLoaderCells}")
		println("registeredBuildTargetCount=${targets.size()}")
		println("publicationArtifactCount=${expectedArtifactNames.size()}")
		println("platformTargetKeyReferences=${platformTargetKeyReferences}")
		println("targetVersionReferences=${targetVersionReferences}")
		println("targetConditionalLines=${targetBranchLines}")
		println("configScreenRendererBodies=${configScreenRendererBodies.size()}")
		println("configScreenRendererAdapters=${configScreenAdapters.size()}")
		println("quickPackInternalReferences=${quickPackInternalReferencePaths.size()}")
		println("productionLocPerSupportedTarget=${locPerTarget}")
		println("stonecutterConditionalBlocks=${conditionalBlocks}")
		println("maxStonecutterConditionalBlockLines=${maxConditionalBlockLines}")
		println("metricsJson=${project.relativePath(metricsJson)}")
		println("metricsReport=${project.relativePath(metricsMarkdown)}")

		if (!exactDuplicateGroups.isEmpty()) {
			def details = exactDuplicateGroups.collect { group -> group.collect { row -> row.path }.join(", ") }.join("; ")
			throw new GradleException("Byte-identical production source files remain: ${details}")
		}
		if (!quickPackInternalReferencePaths.isEmpty()) {
			throw new GradleException("Production code must not reference Quick Pack implementation classes: ${quickPackInternalReferencePaths.join(', ')}")
		}
		if (!duplicateGroups.isEmpty()) {
			def details = duplicateGroups.collect { group -> group.collect { row -> row.path }.join(", ") }.join("; ")
			throw new GradleException("Normalized duplicate production classes remain across version families: ${details}")
		}
		if (bridgeLoc * 2 >= productionLoc) {
			throw new GradleException("Version/loader bridges must remain a minority of handwritten production LOC.")
		}
		if (!oversizedConditionalBlocks.isEmpty()) {
			throw new GradleException("Stonecutter conditional blocks exceed 40 lines: ${oversizedConditionalBlocks.join(', ')}")
		}
	}
}

tasks.register("updateSourceMetricsCheckpoint") {
	group = "verification"
	description = "Refreshes the checked-in source-metrics snapshot at a verified stable checkpoint."
	dependsOn reportSourceMetrics
	inputs.files(sourceMetricsBuildJson, sourceMetricsBuildMarkdown)
	outputs.files(sourceMetricsCheckpointJson, sourceMetricsCheckpointMarkdown)
	doLast {
		sourceMetricsCheckpointJson.parentFile.mkdirs()
		sourceMetricsCheckpointJson.setText(sourceMetricsBuildJson.get().asFile.getText("UTF-8"), "UTF-8")
		sourceMetricsCheckpointMarkdown.setText(sourceMetricsBuildMarkdown.get().asFile.getText("UTF-8"), "UTF-8")
		println("sourceMetricsCheckpoint=${project.relativePath(sourceMetricsCheckpointJson)}")
		println("sourceMetricsCheckpointReport=${project.relativePath(sourceMetricsCheckpointMarkdown)}")
	}
}

