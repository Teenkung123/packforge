version = project.mod_version
group = project.maven_group

def gradlew = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ? "gradlew.bat" : "./gradlew"
def platformBuilds = [
	"Fabric": "platform/fabric",
	"NeoForge": "platform/neoforge",
	"Forge": "platform/forge"
]

platformBuilds.each { platformName, platformPath ->
	tasks.register("build${platformName}Platform", Exec) {
		group = "build"
		description = "Builds the ${platformName} PackForge jar."
		commandLine gradlew, "-p", platformPath, "build"
	}

	tasks.register("run${platformName}Client", Exec) {
		group = "run"
		description = "Runs a ${platformName} Minecraft client with PackForge loaded."
		commandLine gradlew, "-p", platformPath, "runClient"
	}
}

tasks.register("collectPlatformJars", Copy) {
	group = "build"
	description = "Collects all platform jars into root build/libs."
	dependsOn platformBuilds.keySet().collect { platformName ->
		tasks.named("build${platformName}Platform")
	}

	from("platform/fabric/build/libs") {
		include "packforge-fabric-${project.version}.jar"
	}
	from("platform/neoforge/build/libs") {
		include "packforge-neoforge-${project.version}.jar"
	}
	from("platform/forge/build/libs") {
		include "packforge-forge-${project.version}.jar"
	}
	into layout.buildDirectory.dir("libs")
}

tasks.register("build") {
	group = "build"
	description = "Builds all platform jars."
	dependsOn tasks.named("collectPlatformJars")
}

tasks.register("clean") {
	group = "build"
	description = "Cleans root and platform build outputs."
	doLast {
		delete layout.buildDirectory
		platformBuilds.values().each { platformPath ->
			delete file("${platformPath}/build")
		}
	}
}
