def compareNumericVersions = { left, right ->
	def leftParts = left.toString().tokenize('.').collect { it as int }
	def rightParts = right.toString().tokenize('.').collect { it as int }
	int length = Math.max(leftParts.size(), rightParts.size())
	for (int index = 0; index < length; index++) {
		int leftPart = index < leftParts.size() ? leftParts[index] : 0
		int rightPart = index < rightParts.size() ? rightParts[index] : 0
		if (leftPart != rightPart) {
			return leftPart <=> rightPart
		}
	}
	return 0
}

