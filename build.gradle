version = providers.gradleProperty('mod_version').get()
group = providers.gradleProperty('maven_group').get()
ext.packforgeRegistry = gradle.ext.packforgeRegistry
repositories { mavenCentral() }

def targets = packforgeRegistry.targets
def selectedKey = providers.gradleProperty('packforge_target').getOrElse(packforgeRegistry.defaultTarget)
def selected = targets.find { it.key == selectedKey }
ext.packforgeSelectedTarget = selectedKey
if (selected == null) throw new GradleException("Unknown target '${selectedKey}'; valid: ${targets*.key}")
def nodes = targets.collectMany { target ->
	target.platforms.keySet().collect { loader -> [target: target, loader: loader, path: ":${loader}:${target.key}"] }
}
configurations {
	verifierRuntime {
		canBeConsumed = false
		canBeResolved = true
		attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
	}
}
dependencies { verifierRuntime project(':verification') }
def verificationClasspath = configurations.verifierRuntime
def registryFile = file('gradle/minecraft-targets.json')
def repositoryDirectory = projectDir
def artifactDirectory = layout.buildDirectory.dir('libs')
def modVersion = version.toString()
def registerVerification = { String name, String targetKey, Object collection ->
	tasks.register(name, JavaExec) {
		group = 'verification'
		classpath = verificationClasspath
		mainClass = 'com.teenkung.packforge.verification.ArtifactVerifier'
		args registryFile.absolutePath, artifactDirectory.get().asFile.absolutePath, modVersion
		if (targetKey != null) args targetKey
		if (collection != null) dependsOn collection
		inputs.file(registryFile)
		inputs.files(fileTree(artifactDirectory) { include '**/packforge-*.jar' })
		inputs.property('modVersion', modVersion)
		outputs.file(layout.buildDirectory.file("verification/${name}.ok"))
		doLast { outputs.files.singleFile.text = 'verified\n' }
	}
}
tasks.register('validateTargetRegistry', JavaExec) {
	group = 'verification'
	classpath = verificationClasspath
	mainClass = 'com.teenkung.packforge.verification.RegistryValidator'
	args registryFile.absolutePath, repositoryDirectory.absolutePath
	inputs.file(registryFile)
	inputs.files(fileTree('versions') { include '**/*.java', '**/*.json' })
	inputs.files(fileTree('src') { include '**/*.java' })
	outputs.file(layout.buildDirectory.file('verification/registry.ok'))
	doLast { outputs.files.singleFile.text = 'verified\n' }
}

// Provider-backed collection keeps Gradle aware of the final remap/reobf producers.
def collect = tasks.register('collectPlatformJars', Copy) {
	group = 'build'
	description = 'Collects the exact full release matrix into build/libs.'
	duplicatesStrategy = DuplicatesStrategy.FAIL
	nodes.each { node ->
		from(providers.provider { project(node.path).packforgeArtifact })
	}
	into layout.buildDirectory.dir('libs')
}
def verifyAll = registerVerification('verifyAllArtifacts', null, collect)
registerVerification('verifyExistingArtifacts', null, null)
tasks.register('buildAllSupported') {
	group = 'build'
	description = 'Builds, tests and verifies all supported artifacts.'
	dependsOn ':common:check', ':verification:test', 'validateTargetRegistry', nodes.collect { "${it.path}:build" }, verifyAll
}
tasks.register('build') { group = 'build'; dependsOn tasks.named('buildAllSupported') }
def selectedNodes = nodes.findAll { it.target.key == selectedKey }
def collectTarget = tasks.register('collectTargetJars', Copy) {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	selectedNodes.each { node -> from(providers.provider { project(node.path).packforgeArtifact }) }
	into artifactDirectory
}
def verifyTarget = registerVerification('verifyTargetArtifacts', selectedKey, collectTarget)
tasks.register('benchmarkPackIndex') {
	group = 'verification'
	description = 'Runs the selected target PackIndex microbenchmark on Fabric.'
	dependsOn ":fabric:${selectedKey}:benchmarkPackIndex"
}
tasks.register('buildTarget') {
	group = 'build'
	description = 'Builds every enabled loader for -Ppackforge_target.'
	dependsOn ':common:check', ':verification:test', 'validateTargetRegistry', selectedNodes.collect { "${it.path}:build" }, verifyTarget
}
[fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge'].findAll { loader, label -> selected.platforms[loader] != null }.each { loader, label ->
	tasks.register("run${label}Client") {
		group = 'run'
		dependsOn ":${loader}:${selectedKey}:runClient"
	}
}
tasks.register('clean', Delete) {
	group = 'build'
	delete layout.buildDirectory
	dependsOn ':common:clean', ':verification:clean'
}
