tasks.register("verifyAllArtifacts") {
	group = "verification"
	description = "Verifies every published PackForge artifact."
	dependsOn publishedTargets.collect { verificationTasksByTarget[it.key] }
	doLast {
		def outputDirectory = layout.buildDirectory.dir("libs").get().asFile
		def actualArtifactNames = fileTree(outputDirectory) {
			include "packforge-*.jar"
		}.files.collect { it.name }.sort()
		if (actualArtifactNames != expectedArtifactNames) {
			def missing = expectedArtifactNames - actualArtifactNames
			def stale = actualArtifactNames - expectedArtifactNames
			throw new GradleException("Expected exactly ${expectedArtifactNames.size()} current release artifacts; missing=${missing}, stale=${stale}.")
		}
	}
}

tasks.register("verifyExistingArtifacts") {
	group = "verification"
	description = "Verifies the already-collected registry-derived release set without rebuilding child projects."
	doLast {
		publishedTargets.each { target ->
			platformBuilds.findAll { targetSupports(target, it) }.each { platform ->
				verifyArtifact(target, platform, layout.buildDirectory.file("libs/${artifactName(target, platform)}").get().asFile)
			}
		}
		def outputDirectory = layout.buildDirectory.dir("libs").get().asFile
		def actualArtifactNames = fileTree(outputDirectory) {
			include "packforge-*.jar"
		}.files.collect { it.name }.sort()
		if (actualArtifactNames != expectedArtifactNames) {
			def missing = expectedArtifactNames - actualArtifactNames
			def stale = actualArtifactNames - expectedArtifactNames
			throw new GradleException("Expected exactly ${expectedArtifactNames.size()} current release artifacts; missing=${missing}, stale=${stale}.")
		}
	}
}

tasks.register("verifyReleaseManifest", Exec) {
	group = "verification"
	description = "Verifies the existing registry-derived release manifest without regenerating it."
	dependsOn tasks.named("verifyExistingArtifacts")
	commandLine "python", "scripts/Generate-ReleaseManifest.py", "--verify-existing",
		"--artifacts-dir", layout.buildDirectory.dir("libs").get().asFile,
		"--output-dir", layout.buildDirectory.dir("libs/release").get().asFile
}

platformBuilds.findAll { targetSupports(selectedTarget, it) }.each { platform ->
	tasks.register("run${platform.name}TargetClient") {
		group = "run"
		description = "Runs the ${platform.name} client for the target selected by -Ppackforge_target."
		dependsOn tasks.named("run${platform.name}${selectedTarget.taskSuffix}Client")
	}
}

buildTasksByPlatform.values().each { platformTasks ->
	def previous = null
	platformTasks.each { taskProvider ->
		if (previous != null) {
			def previousTask = previous
			taskProvider.configure { mustRunAfter previousTask }
		}
		previous = taskProvider
	}
}

tasks.register("collectPlatformJars", Copy) {
	group = "build"
	description = "Collects the selected target's platform jars into root build/libs."
	def selectedBuildTasks = platformBuilds.findAll { targetSupports(selectedTarget, it) }.collect {
		tasks.named("build${it.name}Platform")
	}
	dependsOn selectedBuildTasks
	duplicatesStrategy = DuplicatesStrategy.FAIL
	platformBuilds.findAll { targetSupports(selectedTarget, it) }.each { platform ->
		from(artifactSourceDirectory(selectedTarget, platform)) {
			include artifactName(selectedTarget, platform)
		}
	}
	into layout.buildDirectory.dir("libs")
}

tasks.register("buildLegacySupported") {
	group = "build"
	description = "Builds all exact legacy Minecraft targets."
	dependsOn publishedTargets.findAll { it.legacyApi }.collect { buildTasksByTarget[it.key] }
}

tasks.register("buildCurrentSupported") {
	group = "build"
	description = "Builds the current Minecraft target matrix."
	dependsOn publishedTargets.findAll { !it.legacyApi }.collect { buildTasksByTarget[it.key] }
}

tasks.register("buildAllSupported") {
	group = "build"
	description = "Builds every published PackForge target and platform."
	dependsOn publishedTargets.collect { buildTasksByTarget[it.key] }
}

tasks.register("build") {
	group = "build"
	description = "Builds every supported PackForge artifact."
	dependsOn tasks.named("buildAllSupported")
}

tasks.register("clean") {
	group = "build"
	description = "Cleans root and platform build outputs."
	dependsOn stonecutterDirectNodePaths.collect { nodePath -> "${nodePath}:clean" }
	doLast {
		delete layout.buildDirectory
		platformBuilds.each { platform -> delete file("${platform.path}/build") }
	}
}
