def targetPropertyArgs = { target ->
	[
		"packforge_mc_key": target.key,
		"packforge_mc_target": target.minecraftVersion,
		"minecraft_version": target.minecraftVersion,
		"minecraft_dependency_min": target.minecraftDependencyMin,
		"minecraft_dependency_max": target.minecraftDependencyMax,
		"minecraft_version_range": target.minecraftVersionRange,
		"loader_version": target.loaderVersion,
		"fabric_loader_dependency_min": target.fabricLoaderDependencyMin,
		"fabric_api_version": target.fabricApiVersion,
		"loom_version": target.loomVersion,
		"forge_version": target.forgeVersion,
		"forge_version_range": target.forgeVersionRange,
		"neoforge_version": target.neoforgeVersion,
		"neoforge_version_range": target.neoforgeVersionRange
	].collect { name, value -> "-P${name}=${value}" }
}

def defaultTarget = supportedMinecraftTargets.find { it.key == "mc26_1_2" }

platformBuilds.each { platform ->
	tasks.register("build${platform.name}Platform", Exec) {
		group = "build"
		description = "Builds the ${platform.name} PackForge jar for the default Minecraft target."
		commandLine([gradlew, "-p", platform.path] + targetPropertyArgs(defaultTarget) + ["build"])
	}

	tasks.register("run${platform.name}Client", Exec) {
		group = "run"
		description = "Runs a ${platform.name} Minecraft client with PackForge loaded for the default Minecraft target."
		commandLine([gradlew, "-p", platform.path] + targetPropertyArgs(defaultTarget) + ["runClient"])
	}
}

supportedMinecraftTargets.each { target ->
	def platformTasksForTarget = []

	platformBuilds.each { platform ->
		def taskName = "build${platform.name}${target.taskSuffix}Platform"
		def buildTask = tasks.register(taskName, Exec) {
			group = "build"
			description = "Builds the ${platform.name} PackForge jar for Minecraft ${target.minecraftVersion}."
			commandLine([gradlew, "-p", platform.path] + targetPropertyArgs(target) + ["build"])
		}
		platformTasksForTarget << buildTask
	}

	tasks.register("collect${target.taskSuffix}PlatformJars", Copy) {
		group = "build"
		description = "Collects all PackForge jars for Minecraft ${target.minecraftVersion} into root build/libs."
		dependsOn platformTasksForTarget

		platformBuilds.each { platform ->
			from("${platform.path}/build/libs") {
				include "packforge-${platform.id}-${project.version}-mc${target.minecraftVersion}.jar"
			}
		}
		into layout.buildDirectory.dir("libs")
	}

	tasks.register("build${target.taskSuffix}") {
		group = "build"
		description = "Builds all PackForge platform jars for Minecraft ${target.minecraftVersion}."
		dependsOn tasks.named("collect${target.taskSuffix}PlatformJars")
	}
}

platformBuilds.each { platform ->
	def previous = null
	supportedMinecraftTargets.each { target ->
		def taskProvider = tasks.named("build${platform.name}${target.taskSuffix}Platform")
		if (previous != null) {
			def previousTask = previous
			taskProvider.configure { mustRunAfter previousTask }
		}
		previous = taskProvider
	}
}

tasks.register("collectPlatformJars", Copy) {
	group = "build"
	description = "Collects default-target platform jars into root build/libs."
	dependsOn platformBuilds.collect { platform -> tasks.named("build${platform.name}Platform") }

	platformBuilds.each { platform ->
		from("${platform.path}/build/libs") {
			include "packforge-${platform.id}-${project.version}-mc${defaultTarget.minecraftVersion}.jar"
		}
	}
	into layout.buildDirectory.dir("libs")
}

tasks.register("buildAllSupported") {
	group = "build"
	description = "Builds all PackForge platform jars for all supported Minecraft targets."
	dependsOn supportedMinecraftTargets.collect { target -> tasks.named("build${target.taskSuffix}") }
}

tasks.register("build") {
	group = "build"
	description = "Builds all supported PackForge platform jars."
	dependsOn tasks.named("buildAllSupported")
}

tasks.register("clean") {
	group = "build"
	description = "Cleans root and platform build outputs."
	doLast {
		delete layout.buildDirectory
		platformBuilds.each { platform ->
			delete file("${platform.path}/build")
		}
	}
}
