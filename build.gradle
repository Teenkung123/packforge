}.sort()

def readZipText = { ZipFile archive, String path ->
	def entry = archive.getEntry(path)
	if (entry == null) {
		throw new GradleException("Artifact is missing '${path}'.")
	}
	archive.getInputStream(entry).withCloseable { input ->
		new String(input.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
	}
}

def readZipBytes = { ZipFile archive, String path ->
	def entry = archive.getEntry(path)
	if (entry == null) {
		throw new GradleException("Artifact is missing '${path}'.")
	}
	archive.getInputStream(entry).withCloseable { input -> input.readAllBytes() }
}

def inspectWrapOperationTargets = { byte[] classBytes ->
	// Read only the annotation structures needed here, without depending on
	// Gradle's internal ASM classpath.
	def input = new java.io.DataInputStream(new java.io.ByteArrayInputStream(classBytes))
	def state = [count: 0, targets: [:]]
	def constantPool
	def readUtf8 = { int index ->
		def value = constantPool[index]
		if (!(value instanceof String)) {
			throw new GradleException("FilePackResources class has invalid constant-pool UTF-8 index ${index}.")
		}
		value
	}
	def skipFully = { java.io.DataInputStream stream, int length ->
		int remaining = length
		while (remaining > 0) {
			int skipped = stream.skipBytes(remaining)
			if (skipped <= 0) {
				stream.readByte()
				skipped = 1
			}
			remaining -= skipped
		}
	}
	def consumeAnnotation
	def consumeElementValue
	consumeElementValue = { java.io.DataInputStream stream, int tag, boolean insideWrapOperation ->
		switch (tag) {
			case 66: case 67: case 68: case 70: case 73: case 74: case 83: case 90: case 115:
				stream.readUnsignedShort()
				break
			case 101:
				stream.readUnsignedShort()
				stream.readUnsignedShort()
				break
			case 99:
				stream.readUnsignedShort()
				break
			case 64:
				consumeAnnotation(stream, insideWrapOperation)
				break
			case 91:
				int valueCount = stream.readUnsignedShort()
				valueCount.times { consumeElementValue(stream, stream.readUnsignedByte(), insideWrapOperation) }
				break
			default:
				throw new GradleException("FilePackResources class has unsupported annotation element tag ${tag}.")
		}
	}
	consumeAnnotation = { java.io.DataInputStream stream, boolean insideWrapOperation ->
		def annotationDescriptor = readUtf8(stream.readUnsignedShort())
		def isWrapOperation = annotationDescriptor == "Lcom/llamalad7/mixinextras/injector/wrapoperation/WrapOperation;"
		def operationScoped = insideWrapOperation || isWrapOperation
		if (isWrapOperation) {
			state.count++
		}
		int pairCount = stream.readUnsignedShort()
		pairCount.times {
			def elementName = readUtf8(stream.readUnsignedShort())
			int tag = stream.readUnsignedByte()
			if (operationScoped
				&& annotationDescriptor == "Lorg/spongepowered/asm/mixin/injection/At;"
				&& elementName == "target" && tag == 115) {
				def target = readUtf8(stream.readUnsignedShort())
				state.targets[target] = (state.targets[target] ?: 0) + 1
			} else {
				consumeElementValue(stream, tag, operationScoped)
			}
		}
	}
	try {
		if (java.lang.Integer.toUnsignedLong(input.readInt()) != 0xCAFEBABEL) {
			throw new GradleException("FilePackResources class has an invalid class-file header.")
		}
		input.readUnsignedShort()
		input.readUnsignedShort()
		int constantPoolCount = input.readUnsignedShort()
		constantPool = new Object[constantPoolCount]
		for (int index = 1; index < constantPoolCount; index++) {
			switch (input.readUnsignedByte()) {
				case 1:
					byte[] bytes = new byte[input.readUnsignedShort()]
					input.readFully(bytes)
					constantPool[index] = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
					break
				case 3: case 4:
					input.readInt()
					break
				case 5: case 6:
					input.readLong()
					index++
					break
				case 7: case 8: case 16: case 19: case 20:
					input.readUnsignedShort()
					break
				case 9: case 10: case 11: case 12: case 17: case 18:
					input.readUnsignedShort()
					input.readUnsignedShort()
					break
				case 15:
					input.readUnsignedByte()
					input.readUnsignedShort()
					break
				default:
					throw new GradleException("FilePackResources class has an unsupported constant-pool tag.")
			}
		}
		input.readUnsignedShort()
		input.readUnsignedShort()
		input.readUnsignedShort()
		int interfaceCount = input.readUnsignedShort()
		interfaceCount.times { input.readUnsignedShort() }
		def skipMembers = {
			int memberCount = input.readUnsignedShort()
			memberCount.times {
				input.readUnsignedShort()
				input.readUnsignedShort()
				input.readUnsignedShort()
				int attributeCount = input.readUnsignedShort()
				attributeCount.times {
					input.readUnsignedShort()
					int length = input.readInt()
					skipFully(input, length)
				}
			}
		}
		skipMembers()
		int methodCount = input.readUnsignedShort()
		methodCount.times {
			input.readUnsignedShort()
			input.readUnsignedShort()
			input.readUnsignedShort()
			int attributeCount = input.readUnsignedShort()
			attributeCount.times {
				def attributeName = readUtf8(input.readUnsignedShort())
				int length = input.readInt()
				if (attributeName == "RuntimeVisibleAnnotations" || attributeName == "RuntimeInvisibleAnnotations") {
					byte[] annotationBytes = new byte[length]
					input.readFully(annotationBytes)
					def annotationInput = new java.io.DataInputStream(new java.io.ByteArrayInputStream(annotationBytes))
					int annotationCount = annotationInput.readUnsignedShort()
					annotationCount.times { consumeAnnotation(annotationInput, false) }
				} else {
					skipFully(input, length)
				}
			}
		}
		state
	} finally {
		input.close()
	}
}

def verifyArtifact = { target, platform, File artifact ->
	if (!artifact.isFile()) {
		throw new GradleException("Expected PackForge artifact was not produced: ${artifact}")
	}
	def loader = target.platforms[platform.id]
	new ZipFile(artifact).withCloseable { archive ->
		def names = archive.entries().toList().collect { it.name }
		def duplicates = names.countBy { it }.findAll { name, count -> count > 1 }.keySet()
		if (!duplicates.isEmpty()) {
			throw new GradleException("${artifact.name} contains duplicate entries: ${duplicates.sort().join(', ')}")
		}

		def forbiddenBridgePaths = [
			"com/teenkung/packforge/mixin/loader/SharedZipFileAccessBridge.class",
			"com/teenkung/packforge/loader/SharedZipFileAccessBridge.class"
		]
		def forbiddenBridge = forbiddenBridgePaths.find { names.contains(it) }
		if (forbiddenBridge != null) {
			throw new GradleException("${artifact.name} packages the shared ZIP bridge at a forbidden path: ${forbiddenBridge}")
		}
		if (target.key != "mc1_20_1"
			&& !names.contains("com/teenkung/packforge/internal/loader/SharedZipFileAccessBridge.class")) {
			throw new GradleException("${artifact.name} is missing the shared ZIP access bridge outside its Mixin package.")
		}
		[
			"com/teenkung/packforge/client/config/PackForgeConfigScreen.class",
			"com/teenkung/packforge/client/mixin/config/PackSelectionScreenMixin.class",
			"assets/packforge/lang/en_us.json",
			"assets/packforge/textures/gui/sprites/config_cog.png"
		].each { requiredPath ->
			if (!names.contains(requiredPath)) {
				throw new GradleException("${artifact.name} is missing configuration-menu entry '${requiredPath}'.")
			}
		}

		def expectedMixinExtras = "mixinextras-${platform.id}-${registry.mixinExtrasVersion}.jar"
		def nestedMixinExtras = names.find { it.endsWith("/${expectedMixinExtras}") }
		if (nestedMixinExtras == null) {
			throw new GradleException("${artifact.name} does not embed pinned MixinExtras ${registry.mixinExtrasVersion}.")
		}

		def packMetadata = new JsonSlurper().parseText(readZipText(archive, "pack.mcmeta")).pack
		if (target.packMetadata.schema == "single") {
			if ((packMetadata.pack_format as int) != (target.packMetadata.packFormat as int)) {
				throw new GradleException("${artifact.name} has the wrong resource-pack format.")
			}
		} else {
			def actualMin = packMetadata.min_format.collect { it as int }
			def actualMax = packMetadata.max_format.collect { it as int }
			def expectedMin = target.packMetadata.minFormat.collect { it as int }
			def expectedMax = target.packMetadata.maxFormat.collect { it as int }
			if (actualMin != expectedMin || actualMax != expectedMax) {
				throw new GradleException("${artifact.name} has the wrong resource-pack format range.")
			}
		}

		def capabilities = new Properties()
		archive.getInputStream(archive.getEntry("packforge-capabilities.properties")).withCloseable { capabilities.load(it) }
		if (capabilities.getProperty("target") != target.key
			|| capabilities.getProperty("minecraft") != target.artifactMinecraft
			|| capabilities.getProperty("maturity") != loader.maturity
			|| capabilities.getProperty("beta") != (loader.maturity == "beta").toString()
			|| capabilities.getProperty("capabilities") != target.capabilities.join(",")) {
			throw new GradleException("${artifact.name} contains stale target capability metadata.")
		}

		[target.mixinConfigs.main, target.mixinConfigs.client].each { mixinPath ->
			def mixin = new JsonSlurper().parseText(readZipText(archive, mixinPath.toString()))
			if (mixin.compatibilityLevel != target.mixinCompatibility) {
				throw new GradleException("${artifact.name} has an incorrect mixin compatibility level in ${mixinPath}.")
			}
		}
		def clientMixin = new JsonSlurper().parseText(readZipText(archive, target.mixinConfigs.client.toString()))
		def mainMixin = new JsonSlurper().parseText(readZipText(archive, target.mixinConfigs.main.toString()))
		if ((mainMixin.mixins ?: []).contains("loader.CompositePackResourcesMixin")
			|| names.contains("com/teenkung/packforge/mixin/loader/CompositePackResourcesMixin.class")) {
			throw new GradleException("${artifact.name} retains the removed broad CompositePackResources mixin.")
		}
		if (target.key != "mc1_20_1"
			&& !(mainMixin.mixins ?: []).contains("loader.SharedZipFileAccessMixin")) {
			throw new GradleException("${artifact.name} is missing the SharedZipFileAccess bridge mixin required by FilePackResourcesMixin.")
		}
		def filePackMixinEntry = archive.getEntry("com/teenkung/packforge/mixin/loader/FilePackResourcesMixin.class")
		if (filePackMixinEntry == null) {
			throw new GradleException("${artifact.name} is missing the operation-level FilePackResources mixin.")
		}
		def filePackBytes = readZipBytes(archive, "com/teenkung/packforge/mixin/loader/FilePackResourcesMixin.class")
		def filePackConstants = new String(filePackBytes, java.nio.charset.StandardCharsets.ISO_8859_1)
		def ioSupplierNamespace = platform.id == "fabric" && target.legacyApi ? "intermediary" : "named/official"
		def ioSupplierOwner = ioSupplierNamespace == "intermediary"
			? "Lnet/minecraft/class_7367;"
			: "Lnet/minecraft/server/packs/resources/IoSupplier;"
		def ioSupplierTarget = "${ioSupplierOwner}create(Ljava/util/zip/ZipFile;Ljava/util/zip/ZipEntry;)${ioSupplierOwner}".toString()
		def expectedOperationTargets = [
			"Ljava/util/zip/ZipFile;getEntry(Ljava/lang/String;)Ljava/util/zip/ZipEntry;": 1,
			"Ljava/util/zip/ZipFile;entries()Ljava/util/Enumeration;": 2,
			(ioSupplierTarget): 2
		]
		def operationAudit = inspectWrapOperationTargets(filePackBytes)
		def unexpectedOperationTargets = operationAudit.targets.findAll { targetDescriptor, actualCount ->
			!expectedOperationTargets.containsKey(targetDescriptor)
			|| expectedOperationTargets[targetDescriptor] != actualCount
		}
		def missingOperationTargets = expectedOperationTargets.findAll { targetDescriptor, expectedCount ->
			(operationAudit.targets[targetDescriptor] ?: 0) != expectedCount
		}
		if (operationAudit.count != expectedOperationTargets.values().sum()
			|| !unexpectedOperationTargets.isEmpty()
			|| !missingOperationTargets.isEmpty()) {
			throw new GradleException("${artifact.name} FilePackResources mixin has incorrect @WrapOperation targets for ${ioSupplierNamespace} namespace: ${operationAudit.targets}.")
		}
		if (!filePackConstants.contains("Lcom/llamalad7/mixinextras/injector/wrapoperation/WrapOperation;")) {
			throw new GradleException("${artifact.name} FilePackResources mixin is missing the @WrapOperation marker.")
		}
		if (filePackConstants.contains("CallbackInfoReturnable")
			|| filePackConstants.contains("Lcom/llamalad7/mixinextras/injector/wrapmethod/WrapMethod;")) {
			throw new GradleException("${artifact.name} FilePackResources mixin retains a broad public-method replacement hook.")
		}
		if (!clientMixin.client.contains("config.PackSelectionScreenMixin")) {
			throw new GradleException("${artifact.name} does not register the resource-pack configuration button mixin.")
		}
		def configuredMixinClasses = [
			[config: target.mixinConfigs.main.toString(), packageName: mainMixin.package, entries: mainMixin.mixins ?: []],
			[config: target.mixinConfigs.client.toString(), packageName: clientMixin.package, entries: clientMixin.client ?: []]
		]
		configuredMixinClasses.each { mixinConfig ->
			mixinConfig.entries.each { mixinName ->
				def classPath = "${mixinConfig.packageName.toString().replace('.', '/')}/${mixinName.toString().replace('.', '/')}.class"
				def classEntry = archive.getEntry(classPath)
				if (classEntry == null) {
					throw new GradleException("${artifact.name} registers ${mixinName} in ${mixinConfig.config} but does not package ${classPath}.")
				}
				if (platform.id != "fabric") {
					def classConstants = archive.getInputStream(classEntry).withCloseable { input ->
						new String(input.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
					}
					def intermediarySelector = classConstants =~ /\b(?:method|field)_[0-9]+\b/
					if (intermediarySelector.find()) {
						throw new GradleException("${artifact.name} packages Fabric intermediary selector '${intermediarySelector.group()}' in configured mixin ${mixinName}.")
					}
				}
			}
		}
		capabilityContract.each { capability, contract ->
			if (target.capabilities.contains(capability)) {
				(contract.classes ?: []).each { requiredClass ->
					if (!names.contains(requiredClass)) {
						throw new GradleException("${artifact.name} declares ${capability} but is missing implementation class ${requiredClass}.")
					}
				}
				if (contract.anyClasses && !contract.anyClasses.any { names.contains(it) }) {
					throw new GradleException("${artifact.name} declares ${capability} but is missing every supported implementation class: ${contract.anyClasses.join(', ')}.")
				}
				(contract.mainMixins ?: []).each { requiredMixin ->
					if (!(mainMixin.mixins ?: []).contains(requiredMixin)) {
						throw new GradleException("${artifact.name} declares ${capability} but does not register main mixin ${requiredMixin}.")
					}
				}
				(contract.clientMixins ?: []).each { requiredMixin ->
					if (!(clientMixin.client ?: []).contains(requiredMixin)) {
						throw new GradleException("${artifact.name} declares ${capability} but does not register client mixin ${requiredMixin}.")
					}
				}
				if (contract.anyClientMixins && !contract.anyClientMixins.any { (clientMixin.client ?: []).contains(it) }) {
					throw new GradleException("${artifact.name} declares ${capability} but does not register any supported client mixin: ${contract.anyClientMixins.join(', ')}.")
				}
			}
		}

		def coreClass = archive.getEntry("com/teenkung/packforge/PackForgeCore.class")
		if (coreClass == null) {
			throw new GradleException("${artifact.name} is missing PackForgeCore.class.")
		}
		def header = archive.getInputStream(coreClass).withCloseable { it.readNBytes(8) }
		def actualMajor = (Byte.toUnsignedInt(header[6]) << 8) | Byte.toUnsignedInt(header[7])
		def expectedMajor = [17: 61, 21: 65, 25: 69][target.javaVersion as int]
		if (actualMajor != expectedMajor) {
			throw new GradleException("${artifact.name} uses class-file major ${actualMajor}; expected ${expectedMajor}.")
		}

		if (platform.id == "fabric") {
			def fabricMetadata = new JsonSlurper().parseText(readZipText(archive, "fabric.mod.json"))
			def expectedFabricDepends = [
				fabricloader: loader.loaderDependency.toString(),
				minecraft: loader.minecraftDependency.toString(),
				java: ">=${target.javaVersion}"
			]
			if (fabricMetadata.depends != expectedFabricDepends) {
				throw new GradleException("${artifact.name} has incorrect Fabric dependencies; only Fabric Loader, Minecraft, and Java may be required.")
			}
			if (loader.modMenuEntrypoint
				&& (fabricMetadata.entrypoints.modmenu != ["com.teenkung.packforge.client.config.PackForgeModMenuApi"]
					|| fabricMetadata.suggests.modmenu != "*"
					|| !names.contains("com/teenkung/packforge/client/config/PackForgeModMenuApi.class"))) {
				throw new GradleException("${artifact.name} has incomplete optional Mod Menu configuration integration.")
			}
			def accessWidener = readZipText(archive, "packforge.accesswidener").readLines().first().trim().split(/\s+/).toList()
			def expectedNamespace = target.legacyApi ? "intermediary" : "official"
			if (accessWidener != ["accessWidener", "v2", expectedNamespace]) {
				throw new GradleException("${artifact.name} has access-widener header '${accessWidener.join(' ')}', expected namespace '${expectedNamespace}'.")
			}
		} else if (platform.id == "forge") {
			def modsToml = readZipText(archive, "META-INF/mods.toml")
			if (!modsToml.contains("versionRange=\"${loader.versionRange}\"")
				|| !modsToml.contains("versionRange=\"${loader.minecraftVersionRange}\"")) {
				throw new GradleException("${artifact.name} has incorrect Forge dependency ranges.")
			}
			if (target.minecraftVersion == "1.20.1") {
				def legacyRefmaps = []
				[target.mixinConfigs.main, target.mixinConfigs.client].each { mixinPath ->
					def mixin = new JsonSlurper().parseText(readZipText(archive, mixinPath.toString()))
					if (!(mixin.refmap instanceof String) || mixin.refmap.isBlank() || archive.getEntry(mixin.refmap) == null) {
						throw new GradleException("${artifact.name} is missing the generated legacy Forge Mixin refmap for ${mixinPath}.")
					}
					def refmapText = readZipText(archive, mixin.refmap)
					def intermediarySelector = refmapText =~ /\b(?:method|field)_[0-9]+\b/
					if (intermediarySelector.find()) {
						throw new GradleException("${artifact.name} retains unmapped intermediary selector '${intermediarySelector.group()}' in ${mixin.refmap}.")
					}
					legacyRefmaps << new JsonSlurper().parseText(refmapText)
				}

				def legacyMappings = legacyRefmaps.collect { it.mappings ?: [:] }.inject([:]) { merged, mappings ->
					merged.putAll(mappings as Map)
					merged
				}
				def reloadMappings = legacyMappings["com/teenkung/packforge/mixin/observe/SimpleReloadInstanceMixin"] as Map
				def remappedStateFactoryHook = reloadMappings?.find { selector, mapped ->
					selector.toString().startsWith("Lnet/minecraft/server/packs/resources/SimpleReloadInstance\$StateFactory;create(")
						&& mapped.toString().contains(";m_")
				}
				if (remappedStateFactoryHook == null || !reloadMappings.containsKey("<init>")) {
					throw new GradleException("${artifact.name} is missing the remapped structural SimpleReloadInstance constructor/StateFactory hook required by Forge 1.20.1.")
				}

				def spriteMappings = legacyMappings["com/teenkung/packforge/client/mixin/atlas/SpriteLoaderMixin"] as Map
				def remappedAtlasHook = spriteMappings?.get("loadAndStitch")?.toString()
				if (remappedAtlasHook == null || !remappedAtlasHook.contains(";m_")) {
					throw new GradleException("${artifact.name} is missing the remapped structural SpriteLoader loadAndStitch hook required by Forge 1.20.1.")
				}
			}
		} else if (platform.id == "neoforge") {
			def modsToml = readZipText(archive, "META-INF/neoforge.mods.toml")
			if (!modsToml.contains("versionRange=\"${loader.versionRange}\"")
				|| !modsToml.contains("versionRange=\"${loader.minecraftVersionRange}\"")) {
				throw new GradleException("${artifact.name} has incorrect NeoForge dependency ranges.")
			}
		}
	}
}
def nestedCommand = { platform, target, taskName ->
	[gradlew, "-p", platform.path, "-Ppackforge_target=${target.key}", taskName]
}

tasks.register("validateTargetRegistry") {
	group = "verification"
	description = "Validates the PackForge target registry and adapter declarations."
	inputs.file registryFile
	inputs.files(fileTree("versions") {
		include "**/*Mixin.java"
		include "**/packforge.fabric.mixins.json"
	})
	doLast {
	if (registry.defaultTarget == null || !targetKeys.contains(registry.defaultTarget)) {
		throw new GradleException("defaultTarget must identify a declared PackForge target.")
	}
	def undeclaredContracts = targets
		.collectMany { target -> target.capabilities }
		.toSet()
		.findAll { capability -> !capabilityContract.containsKey(capability) }
	if (!undeclaredContracts.isEmpty()) {
		throw new GradleException("PackForge target registry contains capabilities without artifact contracts: ${undeclaredContracts.sort().join(', ')}")
	}
		["mixinExtrasVersion", "fabricAsmVersion", "fabricMixinVersion"].each { field ->
			if (registry[field] == null) {
				throw new GradleException("PackForge target registry is missing '${field}'.")
			}
		}
		targets.each { target ->
			["key", "taskSuffix", "minecraftVersion", "artifactMinecraft", "apiAdapter", "javaVersion", "legacyApi", "packMetadata", "mixinConfigs", "capabilities", "platforms"].each { field ->
				if (target[field] == null) {
					throw new GradleException("PackForge target '${target.key}' is missing '${field}'.")
				}
			}
			if (target.platforms.isEmpty()) {
				throw new GradleException("PackForge target '${target.key}' must enable at least one platform.")
			}
			target.platforms.keySet().each { platformId ->
				if (!platformBuilds.any { it.id == platformId }) {
					throw new GradleException("PackForge target '${target.key}' declares unknown platform '${platformId}'.")
				}
			}
			if (!(target.packMetadata.schema in ["single", "range"])) {
				throw new GradleException("PackForge target '${target.key}' has unsupported pack metadata schema '${target.packMetadata.schema}'.")
			}
			target.platforms.each { platformId, loader ->
				["maturity", "versionSuffix"].each { field ->
					if (loader[field] == null) {
						throw new GradleException("PackForge target '${target.key}' platform '${platformId}' is missing '${field}'.")
					}
				}
				if (!(loader.maturity in ["beta", "stable"])) {
					throw new GradleException("PackForge target '${target.key}' platform '${platformId}' has unsupported maturity '${loader.maturity}'.")
				}
				if (loader.maturity == "beta" && !loader.versionSuffix.toString().matches(/-beta\.\d+/)) {
					throw new GradleException("Beta target '${target.key}' platform '${platformId}' must use an explicit -beta.N suffix.")
				}
				if (loader.maturity == "stable" && !loader.versionSuffix.toString().isEmpty()) {
					throw new GradleException("Stable target '${target.key}' platform '${platformId}' must not use a prerelease suffix.")
				}
				if (target.legacyApi && platformId == "fabric" && loader.minecraftDependency != "=${target.minecraftVersion}") {
					throw new GradleException("Legacy Fabric target '${target.key}' must declare exact Minecraft compatibility.")
				}
				if (target.legacyApi && platformId in ["forge", "neoforge"] && loader.minecraftVersionRange != "[${target.minecraftVersion}]") {
					throw new GradleException("Legacy ${platformId} target '${target.key}' must declare an exact singleton Minecraft range.")
				}
				if (platformId == "fabric" && loader.loaderDependency != ">=${loader.loaderVersion}") {
					throw new GradleException("Fabric target '${target.key}' must compile against its declared minimum Loader version.")
				}
				if (platformId == "forge") {
					def forgeBuildVersion = loader.version.toString().substring(loader.version.toString().lastIndexOf("-") + 1)
					if (!loader.versionRange.toString().startsWith("[${forgeBuildVersion},")) {
						throw new GradleException("Forge target '${target.key}' must compile against the lower bound of its declared Forge range.")
					}
				}
				if (platformId == "neoforge" && !loader.versionRange.toString().startsWith("[${loader.version},")) {
					throw new GradleException("NeoForge target '${target.key}' must compile against the lower bound of its declared NeoForge range.")
				}
				if (platformId == "fabric"
					&& (!(loader.modMenuVersion instanceof String)
						|| loader.modMenuVersion.isBlank()
						|| !(loader.fabricApiVersion instanceof String)
						|| loader.fabricApiVersion.isBlank()
						|| loader.modMenuEntrypoint != true)) {
					throw new GradleException("Fabric target '${target.key}' must provide optional Mod Menu integration and its development-runtime Fabric API version.")
				}
			}
		}

		def mixinSources = fileTree("versions") { include "**/*Mixin.java" }.files
		mixinSources.each { source ->
			def sourceText = source.getText("UTF-8")
			def rawSelector = sourceText =~ /\b(?:method|field)_[0-9]+\b/
			if (rawSelector.find()) {
				throw new GradleException("${source} contains raw intermediary selector '${rawSelector.group()}'.")
			}
		}
		def filePackSources = []
		targets.each { target ->
			def adapterSources = fileTree("versions/${target.apiAdapter}") {
				include "**/FilePackResourcesMixin.java"
			}.files
			if (adapterSources.size() != 1) {
				throw new GradleException("Target ${target.key} must own exactly one FilePackResources mixin; found ${adapterSources.size()}.")
			}
			filePackSources.addAll(adapterSources)
		}
		filePackSources.each { source ->
			def sourceText = source.getText("UTF-8")
			if (!sourceText.contains("@WrapOperation")
				|| sourceText.contains("@WrapMethod")
				|| sourceText.contains("CallbackInfoReturnable")
				|| sourceText.contains("cancellable = true")) {
				throw new GradleException("${source} must use operation-level hooks without broad cancellable public-method replacement.")
			}
			def expectedAnchors = [
				"ZipFile;getEntry(Ljava/lang/String;)Ljava/util/zip/ZipEntry;": 1,
				"ZipFile;entries()Ljava/util/Enumeration;": 2,
				"IoSupplier;create(Ljava/util/zip/ZipFile;Ljava/util/zip/ZipEntry;)": 2
			]
			expectedAnchors.each { anchor, expectedCount ->
				int actualCount = sourceText.count(anchor)
				if (actualCount != expectedCount) {
					throw new GradleException("${source} must contain ${expectedCount} '${anchor}' operation anchors; found ${actualCount}.")
				}
			}
		}
		fileTree("versions") { include "**/packforge.fabric.mixins.json" }.files.each { descriptor ->
			if (descriptor.getText("UTF-8").contains("CompositePackResourcesMixin")) {
				throw new GradleException("${descriptor} still registers the removed CompositePackResources mixin.")
			}
		}
	}
}

platformBuilds.each { platform ->
	if (targetSupports(selectedTarget, platform)) {
		tasks.register("build${platform.name}Platform", Exec) {
			group = "build"
			description = "Builds the ${platform.name} PackForge jar for ${selectedTarget.artifactMinecraft}."
			dependsOn tasks.named("validateTargetRegistry")
			commandLine nestedCommand(platform, selectedTarget, "build")
		}

		tasks.register("run${platform.name}Client", Exec) {
			group = "run"
			description = "Runs the ${platform.name} client for ${selectedTarget.artifactMinecraft}."
			dependsOn tasks.named("validateTargetRegistry")
			commandLine nestedCommand(platform, selectedTarget, "runClient")
		}
	}
}

def buildTasksByTarget = [:]
def buildTasksByPlatform = platformBuilds.collectEntries { [(it.id): []] }
def verificationTasksByTarget = [:]

targets.each { target ->
	def targetBuildTasks = []

	platformBuilds.findAll { targetSupports(target, it) }.each { platform ->
		def buildTask = tasks.register("build${platform.name}${target.taskSuffix}Platform", Exec) {
			group = "build"
			description = "Builds the ${platform.name} PackForge jar for ${target.artifactMinecraft}."
			dependsOn tasks.named("validateTargetRegistry")
			commandLine nestedCommand(platform, target, "build")
		}
		targetBuildTasks << buildTask
		buildTasksByPlatform[platform.id] << buildTask

		tasks.register("run${platform.name}${target.taskSuffix}Client", Exec) {
			group = "run"
			description = "Runs the ${platform.name} client for ${target.artifactMinecraft}."
			dependsOn tasks.named("validateTargetRegistry")
			commandLine nestedCommand(platform, target, "runClient")
		}
	}

	def collectTask = tasks.register("collect${target.taskSuffix}PlatformJars", Copy) {
		group = "build"
		description = "Collects PackForge ${target.artifactMinecraft} jars into root build/libs."
		dependsOn targetBuildTasks
		duplicatesStrategy = DuplicatesStrategy.FAIL

		platformBuilds.findAll { targetSupports(target, it) }.each { platform ->
			from("${platform.path}/build/${target.key}/libs") {
				include artifactName(target, platform)
			}
		}
		into layout.buildDirectory.dir("libs")
	}

	def verifyTask = tasks.register("verify${target.taskSuffix}Artifacts") {
		group = "verification"
		description = "Validates filenames, metadata, mappings, duplicates, and Java level for ${target.artifactMinecraft}."
		dependsOn collectTask
		doLast {
			platformBuilds.findAll { targetSupports(target, it) }.each { platform ->
				verifyArtifact(target, platform, layout.buildDirectory.file("libs/${artifactName(target, platform)}").get().asFile)
			}
		}
	}
	verificationTasksByTarget[target.key] = verifyTask

	def aggregateTask = tasks.register("build${target.taskSuffix}") {
		group = "build"
		description = "Builds all PackForge platform jars for ${target.artifactMinecraft}."
		dependsOn verifyTask
	}
	buildTasksByTarget[target.key] = aggregateTask
}

tasks.register("buildTarget") {
	group = "build"
	description = "Builds every enabled platform for the target selected by -Ppackforge_target."
	dependsOn buildTasksByTarget[selectedTarget.key]
}

tasks.register("benchmarkPackIndex", Exec) {
	group = "verification"
	description = "Runs the selected target's deterministic PackIndex microbenchmark on Fabric."
	dependsOn tasks.named("validateTargetRegistry")
	def fabric = platformBuilds.find { it.id == "fabric" }
	commandLine nestedCommand(fabric, selectedTarget, "benchmarkPackIndex")
}

tasks.register("verifyTargetArtifacts") {
	group = "verification"
	description = "Verifies every artifact for the target selected by -Ppackforge_target."
	dependsOn verificationTasksByTarget[selectedTarget.key]
}

tasks.register("verifyAllArtifacts") {
	group = "verification"
	description = "Verifies every declared PackForge artifact."
	dependsOn verificationTasksByTarget.values()
	doLast {
		def outputDirectory = layout.buildDirectory.dir("libs").get().asFile
		def actualArtifactNames = fileTree(outputDirectory) {
			include "packforge-*.jar"
		}.files.collect { it.name }.sort()
		if (actualArtifactNames != expectedArtifactNames) {
			def missing = expectedArtifactNames - actualArtifactNames
			def stale = actualArtifactNames - expectedArtifactNames
			throw new GradleException("Expected exactly ${expectedArtifactNames.size()} current release artifacts; missing=${missing}, stale=${stale}.")
		}
	}
}

tasks.register("verifyExistingArtifacts") {
	group = "verification"
	description = "Verifies the already-collected 17-artifact release set without rebuilding child projects."
	doLast {
		targets.each { target ->
			platformBuilds.findAll { targetSupports(target, it) }.each { platform ->
				verifyArtifact(target, platform, layout.buildDirectory.file("libs/${artifactName(target, platform)}").get().asFile)
			}
		}
		def outputDirectory = layout.buildDirectory.dir("libs").get().asFile
		def actualArtifactNames = fileTree(outputDirectory) {
			include "packforge-*.jar"
		}.files.collect { it.name }.sort()
		if (actualArtifactNames != expectedArtifactNames) {
			def missing = expectedArtifactNames - actualArtifactNames
			def stale = actualArtifactNames - expectedArtifactNames
			throw new GradleException("Expected exactly ${expectedArtifactNames.size()} current release artifacts; missing=${missing}, stale=${stale}.")
		}
	}
}

platformBuilds.findAll { targetSupports(selectedTarget, it) }.each { platform ->
	tasks.register("run${platform.name}TargetClient") {
		group = "run"
		description = "Runs the ${platform.name} client for the target selected by -Ppackforge_target."
		dependsOn tasks.named("run${platform.name}${selectedTarget.taskSuffix}Client")
	}
}

buildTasksByPlatform.values().each { platformTasks ->
	def previous = null
	platformTasks.each { taskProvider ->
		if (previous != null) {
			def previousTask = previous
			taskProvider.configure { mustRunAfter previousTask }
		}
		previous = taskProvider
	}
}

tasks.register("collectPlatformJars", Copy) {
	group = "build"
	description = "Collects the selected target's platform jars into root build/libs."
	def selectedBuildTasks = platformBuilds.findAll { targetSupports(selectedTarget, it) }.collect {
		tasks.named("build${it.name}Platform")
	}
	dependsOn selectedBuildTasks
	duplicatesStrategy = DuplicatesStrategy.FAIL
	platformBuilds.findAll { targetSupports(selectedTarget, it) }.each { platform ->
		from("${platform.path}/build/${selectedTarget.key}/libs") {
			include artifactName(selectedTarget, platform)
		}
	}
	into layout.buildDirectory.dir("libs")
}

tasks.register("buildLegacySupported") {
	group = "build"
	description = "Builds all exact legacy Minecraft targets."
	dependsOn targets.findAll { it.legacyApi }.collect { buildTasksByTarget[it.key] }
}

tasks.register("buildCurrentSupported") {
	group = "build"
	description = "Builds the current Minecraft target matrix."
	dependsOn targets.findAll { !it.legacyApi }.collect { buildTasksByTarget[it.key] }
}

tasks.register("buildAllSupported") {
	group = "build"
	description = "Builds every declared PackForge target and platform."
	dependsOn targets.collect { buildTasksByTarget[it.key] }
}

tasks.register("build") {
	group = "build"
	description = "Builds every supported PackForge artifact."
	dependsOn tasks.named("buildAllSupported")
}

tasks.register("clean") {
	group = "build"
	description = "Cleans root and platform build outputs."
	doLast {
		delete layout.buildDirectory
		platformBuilds.each { platform -> delete file("${platform.path}/build") }
	}
}
