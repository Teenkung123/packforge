		}
		def filePackBytes = readZipBytes(archive, "com/teenkung/packforge/mixin/loader/FilePackResourcesMixin.class")
		def filePackConstants = new String(filePackBytes, java.nio.charset.StandardCharsets.ISO_8859_1)
		def ioSupplierNamespace = platform.id == "fabric" && target.legacyApi ? "intermediary" : "named/official"
		def ioSupplierOwner = ioSupplierNamespace == "intermediary"
			? "Lnet/minecraft/class_7367;"
