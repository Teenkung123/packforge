tasks.register("validateTargetRegistry") {
	group = "verification"
	description = "Validates the PackForge target registry and adapter declarations."
	dependsOn validateImplementationContracts
	dependsOn validateStonecutterDirectContract
	dependsOn reportSourceMetrics
	inputs.file registryFile
	inputs.files(fileTree("versions") {
		include "**/*Mixin.java"
		include "**/packforge.fabric.mixins.json"
	})
	doLast {
	if (registry.defaultTarget == null || !targetKeys.contains(registry.defaultTarget)) {
		throw new GradleException("defaultTarget must identify a declared PackForge target.")
	}
	if (registry.stonecutterVcsTarget == null || !targetKeys.contains(registry.stonecutterVcsTarget)) {
		throw new GradleException("stonecutterVcsTarget must identify a declared PackForge target.")
	}
	if (!(registry.releaseSequence instanceof List)
		|| registry.releaseSequence != requiredStableReleaseSequence) {
		throw new GradleException("Registry releaseSequence must exactly contain the checked-in 1.20.1-26.2 stable release sequence.")
	}
	if (!(registry.releaseCells instanceof List)
		|| registry.releaseCells.size() != requiredStableReleaseSequence.size()
		|| registry.releaseCells.collect { it.id } != requiredStableReleaseSequence) {
		throw new GradleException("Registry releaseCells must contain one row for every exact stable release in releaseSequence.")
	}
	if (!(registry.sourceFamilies instanceof List)
		|| registry.sourceFamilies.collect { it.id } != requiredSourceFamilyIds) {
		throw new GradleException("Registry sourceFamilies must contain the canonical twelve-family order.")
	}
	if (!(registry.sharedJavaSources instanceof List) || registry.sharedJavaSources.isEmpty()) {
		throw new GradleException("Registry sharedJavaSources must declare canonical cross-family source ownership.")
	}
	def sharedSourceIds = registry.sharedJavaSources.collect { source -> source.id }
	def sharedSourcePaths = registry.sharedJavaSources.collect { source -> source.path }
	if (sharedSourceIds.any { it == null || it.toString().isBlank() }
		|| sharedSourceIds.size() != sharedSourceIds.toSet().size()) {
		throw new GradleException("Registry sharedJavaSources IDs must be present and unique.")
	}
	if (sharedSourcePaths.any { it == null || it.toString().isBlank() }
		|| sharedSourcePaths.size() != sharedSourcePaths.toSet().size()) {
		throw new GradleException("Registry sharedJavaSources paths must be present and unique.")
	}
	def canonicalSharedRoot = file("versions/shared").canonicalFile.toPath()
	registry.sharedJavaSources.each { source ->
		["id", "path", "sourceSet", "targets"].each { field ->
			if (source[field] == null) {
				throw new GradleException("Shared Java source '${source.id ?: '<unknown>'}' is missing '${field}'.")
			}
		}
		if (!(source.sourceSet in ["main", "client"])) {
			throw new GradleException("Shared Java source '${source.id}' has invalid sourceSet '${source.sourceSet}'.")
		}
		def sourcePath = source.path.toString().replace('\\', '/')
		def sourceFile = file(sourcePath).canonicalFile
		if (!sourceFile.toPath().startsWith(canonicalSharedRoot)
			|| !sourcePath.contains("/src/${source.sourceSet}/java/")
			|| !sourceFile.isFile()) {
			throw new GradleException("Shared Java source '${source.id}' must be an existing ${source.sourceSet} Java file under versions/shared: ${source.path}")
		}
		if (!(source.targets instanceof List)
			|| source.targets.isEmpty()
			|| source.targets.any { targetKey -> !targetKeys.contains(targetKey.toString()) }) {
			throw new GradleException("Shared Java source '${source.id}' references an undeclared target.")
		}
		if (source.platforms != null) {
			if (!(source.platforms instanceof List)
				|| source.platforms.isEmpty()
				|| source.platforms.any { platformId -> !(platformId in ["fabric", "forge", "neoforge"]) }) {
				throw new GradleException("Shared Java source '${source.id}' has invalid platform filters.")
			}
			source.targets.each { targetKey ->
				def sharedTarget = targets.find { target -> target.key == targetKey }
				if (source.platforms.any { platformId -> sharedTarget.platforms[platformId] == null }) {
					throw new GradleException("Shared Java source '${source.id}' selects a loader unavailable on target '${targetKey}'.")
				}
			}
		}
	}
	def declaredTargetKeys = targetKeys as Set
	registry.sourceFamilies.each { family ->
		["id", "minecraftAnchor", "mandatoryExactReleases", "maturity", "supportGuarantee", "javaVersion", "loaderAvailability", "targetKeys", "quickPackProfile", "compatibilityProfiles", "buildStatus"].each { field ->
			if (family[field] == null) {
				throw new GradleException("Registry source family '${family.id}' is missing '${field}'.")
			}
		}
		def expectedFamilyMaturity = family.id == "mc26" ? "stable" : "beta"
		if (family.maturity != expectedFamilyMaturity) {
			throw new GradleException("Source family '${family.id}' must remain ${expectedFamilyMaturity}.")
		}
		if (!(family.mandatoryExactReleases instanceof List) || family.mandatoryExactReleases.isEmpty()) {
			throw new GradleException("Source family '${family.id}' must declare exact releases.")
		}
		if (!(family.targetKeys instanceof List) || family.targetKeys.any { !declaredTargetKeys.contains(it.toString()) }) {
			throw new GradleException("Source family '${family.id}' references an undeclared target.")
		}
		if (family.quickPackProfile.toString().isBlank()
			|| !(family.compatibilityProfiles instanceof List)
			|| !family.compatibilityProfiles.contains("base")) {
			throw new GradleException("Source family '${family.id}' has incomplete compatibility profiles.")
		}
		def familyCells = registry.releaseCells.findAll { it.sourceFamily == family.id }.collect { it.id }
		if (familyCells != family.mandatoryExactReleases) {
			throw new GradleException("Source family '${family.id}' exact-release ledger does not match releaseCells.")
		}
	}
	registry.releaseCells.each { cell ->
		["id", "minecraftAnchor", "sourceFamily", "artifactFamily", "targetKey", "javaVersion", "maturity", "supportGuarantee", "loaderAvailability", "buildStatus"].each { field ->
			if (cell[field] == null) {
				throw new GradleException("Registry release cell '${cell.id}' is missing '${field}'.")
			}
		}
		def expectedMaturity = cell.id.startsWith("26.") ? "stable" : "beta"
		if (cell.maturity != expectedMaturity) {
			throw new GradleException("Release cell '${cell.id}' must remain ${expectedMaturity}.")
		}
		if (!(cell.loaderAvailability instanceof List) || cell.loaderAvailability.isEmpty()) {
			throw new GradleException("Release cell '${cell.id}' must declare at least one loader.")
		}
		if (!requiredSourceFamilyIds.contains(cell.sourceFamily.toString())) {
			throw new GradleException("Release cell '${cell.id}' references an unknown source family '${cell.sourceFamily}'.")
		}
		def cellTarget = targets.find { it.key == cell.targetKey }
		if (cellTarget == null) {
			throw new GradleException("Release cell '${cell.id}' references undeclared target '${cell.targetKey}'.")
		}
		if (!cellTarget.requiredExactSmokeVersions.contains(cell.id.toString())) {
			throw new GradleException("Release cell '${cell.id}' is not included in target '${cell.targetKey}' exact smoke declarations.")
		}
		if ((cell.javaVersion as int) != (cellTarget.javaVersion as int)) {
			throw new GradleException("Release cell '${cell.id}' has a stale Java level for '${cell.targetKey}'.")
		}
		if (cell.loaderAvailability.any { !cellTarget.loaderAvailability.contains(it) }) {
			throw new GradleException("Release cell '${cell.id}' declares a loader unavailable on target '${cell.targetKey}'.")
		}
		def exactLoaderVersions = cellTarget.requiredExactSmokeLoaderVersions ?: [:]
		def releaseLoaderVersions = exactLoaderVersions[cell.id.toString()] ?: [:]
		cell.loaderAvailability.findAll { it in ["forge", "neoforge"] }.each { loaderId ->
			if (cell.id != cellTarget.minecraftVersion
				&& releaseLoaderVersions[loaderId] == null) {
				throw new GradleException("Release cell '${cell.id}' is missing its exact ${loaderId} production-smoke coordinate on target '${cell.targetKey}'.")
			}
		}
	}
	if (registry.registryPolicy?.pre26Maturity != "beta"
		|| registry.registryPolicy?.mc26Maturity != "stable"
		|| registry.registryPolicy?.noCrossMaturityArtifacts != true
		|| registry.registryPolicy?.exactReleaseRowsRequired != true) {
		throw new GradleException("Registry maturity and exact-release policy is incomplete or unsafe.")
	}
	def undeclaredContracts = targets
		.collectMany { target -> target.capabilities }
		.toSet()
		.findAll { capability -> !capabilityContract.containsKey(capability) }
	if (!undeclaredContracts.isEmpty()) {
		throw new GradleException("PackForge target registry contains capabilities without artifact contracts: ${undeclaredContracts.sort().join(', ')}")
	}
		["mixinExtrasVersion", "mixinExtrasFabricLoaderMinimum", "fabricAsmVersion", "fabricMixinVersion"].each { field ->
			if (registry[field] == null) {
				throw new GradleException("PackForge target registry is missing '${field}'.")
			}
		}
		targets.each { target ->
			["key", "id", "taskSuffix", "minecraftAnchor", "minecraftRange", "minecraftVersion", "artifactMinecraft", "sourceFamily", "artifactFamily", "javaVersion", "mixinCompatibility", "mappingMode", "packFormatRange", "loaderAvailability", "loaderBuildVersions", "maturity", "supportGuarantee", "requiredExactSmokeVersions", "artifactMetadataRange", "quickPack", "compatibilityProfiles", "apiAdapter", "legacyApi", "packMetadata", "mixinConfigs", "capabilities", "platforms"].each { field ->
				if (target[field] == null) {
					throw new GradleException("PackForge target '${target.key}' is missing '${field}'.")
				}
			}
			if (target.id != target.key) {
				throw new GradleException("PackForge target '${target.key}' must use the same value for id and key during schema v2 migration.")
			}
			def expectedTargetMaturity = target.minecraftVersion.toString().startsWith("26.") ? "stable" : "beta"
			if (target.maturity != expectedTargetMaturity) {
				throw new GradleException("PackForge target '${target.key}' must remain ${expectedTargetMaturity}.")
			}
			if (target.loaderAvailability.sort() != target.platforms.keySet().toList().sort()) {
				throw new GradleException("PackForge target '${target.key}' loaderAvailability must match its declared platforms.")
			}
			if (!(target.requiredExactSmokeVersions instanceof List) || target.requiredExactSmokeVersions.isEmpty()) {
				throw new GradleException("PackForge target '${target.key}' must declare exact smoke versions.")
			}
			if (!(target.compatibilityProfiles instanceof List) || !target.compatibilityProfiles.contains("base")) {
				throw new GradleException("PackForge target '${target.key}' must declare the base compatibility profile.")
			}
			def capabilityFloors = target.capabilityMinimumMinecraft ?: [:]
			if (!(capabilityFloors instanceof Map)) {
				throw new GradleException("PackForge target '${target.key}' capabilityMinimumMinecraft must be a map.")
			}
			capabilityFloors.each { capability, minimum ->
				if (!target.capabilities.contains(capability.toString())) {
					throw new GradleException("PackForge target '${target.key}' floors undeclared capability '${capability}'.")
				}
				if (!(minimum.toString() ==~ /\d+(?:\.\d+)*/)
					|| !target.requiredExactSmokeVersions.contains(minimum.toString())) {
					throw new GradleException("PackForge target '${target.key}' capability '${capability}' has invalid floor '${minimum}'.")
				}
			}
			def mixinFloors = target.mixinMinimumMinecraft ?: [:]
			if (!(mixinFloors instanceof Map)) {
				throw new GradleException("PackForge target '${target.key}' mixinMinimumMinecraft must be a map.")
			}
			if (!mixinFloors.isEmpty()) {
				def configuredMixins = [] as Set
				[target.mixinConfigs.main, target.mixinConfigs.client].each { descriptorName ->
					def descriptorFiles = fileTree("versions/${target.apiAdapter}/common") {
						include "**/${descriptorName}"
					}.files
					if (descriptorFiles.size() != 1) {
						throw new GradleException("PackForge target '${target.key}' cannot resolve mixin descriptor '${descriptorName}' for floor validation.")
					}
					def descriptor = new JsonSlurper().parse(descriptorFiles.first())
					(descriptor.mixins ?: []).each { configuredMixins << "${descriptor.package}.${it}".toString() }
					(descriptor.client ?: []).each { configuredMixins << "${descriptor.package}.${it}".toString() }
				}
				mixinFloors.each { mixin, minimum ->
					if (!(minimum.toString() ==~ /\d+(?:\.\d+)*/)
						|| !target.requiredExactSmokeVersions.contains(minimum.toString())) {
						throw new GradleException("PackForge target '${target.key}' mixin '${mixin}' has invalid floor '${minimum}'.")
					}
					if (!configuredMixins.any { it.endsWith(mixin.toString()) }) {
						throw new GradleException("PackForge target '${target.key}' floors unconfigured mixin '${mixin}'.")
					}
				}
			}
			if (target.platforms.isEmpty()) {
				throw new GradleException("PackForge target '${target.key}' must enable at least one platform.")
			}
			target.platforms.keySet().each { platformId ->
				if (!platformBuilds.any { it.id == platformId }) {
					throw new GradleException("PackForge target '${target.key}' declares unknown platform '${platformId}'.")
				}
			}
			if (!(target.packMetadata.schema in ["single", "supported-range", "range"])) {
				throw new GradleException("PackForge target '${target.key}' has unsupported pack metadata schema '${target.packMetadata.schema}'.")
			}
			target.platforms.each { platformId, loader ->
				["maturity", "versionSuffix"].each { field ->
					if (loader[field] == null) {
						throw new GradleException("PackForge target '${target.key}' platform '${platformId}' is missing '${field}'.")
					}
				}
				if (!(loader.maturity in ["beta", "stable"])) {
					throw new GradleException("PackForge target '${target.key}' platform '${platformId}' has unsupported maturity '${loader.maturity}'.")
				}
				if (loader.maturity == "beta" && !loader.versionSuffix.toString().matches(/-beta\.\d+/)) {
					throw new GradleException("Beta target '${target.key}' platform '${platformId}' must use an explicit -beta.N suffix.")
				}
				if (loader.maturity == "stable" && !loader.versionSuffix.toString().isEmpty()) {
					throw new GradleException("Stable target '${target.key}' platform '${platformId}' must not use a prerelease suffix.")
				}
				def exactLegacyTarget = target.legacyApi && target.requiredExactSmokeVersions.size() == 1
				if (exactLegacyTarget && platformId == "fabric" && loader.minecraftDependency != "=${target.minecraftVersion}") {
					throw new GradleException("Legacy Fabric target '${target.key}' must declare exact Minecraft compatibility.")
				}
				if (loader.mixinCompatibility != null
					&& !(loader.mixinCompatibility in ["JAVA_17", "JAVA_21", "JAVA_25"])) {
					throw new GradleException("PackForge target '${target.key}' platform '${platformId}' has unsupported mixin compatibility '${loader.mixinCompatibility}'.")
				}
				if (loader.mixinConfigs != null) {
					["main", "client"].each { field ->
						if (loader.mixinConfigs[field] == null || loader.mixinConfigs[field].toString().isBlank()) {
							throw new GradleException("PackForge target '${target.key}' platform '${platformId}' mixinConfigs is missing '${field}'.")
						}
					}
				}
				if (exactLegacyTarget && platformId in ["forge", "neoforge"] && loader.minecraftVersionRange != "[${target.minecraftVersion}]") {
					throw new GradleException("Legacy ${platformId} target '${target.key}' must declare an exact singleton Minecraft range.")
				}
				if (platformId == "fabric" && loader.loaderDependency != ">=${loader.loaderVersion}") {
					throw new GradleException("Fabric target '${target.key}' must compile against its declared minimum Loader version.")
				}
				if (platformId == "fabric"
					&& compareNumericVersions(loader.loaderVersion, registry.mixinExtrasFabricLoaderMinimum) < 0) {
					throw new GradleException("Fabric target '${target.key}' Loader ${loader.loaderVersion} is below MixinExtras ${registry.mixinExtrasVersion} minimum ${registry.mixinExtrasFabricLoaderMinimum}.")
				}
				if (platformId == "forge") {
					def forgeBuildVersion = loader.version.toString().substring(loader.version.toString().lastIndexOf("-") + 1)
					if (loader.rangeCompileAnchor != true && !loader.versionRange.toString().startsWith("[${forgeBuildVersion},")) {
						throw new GradleException("Forge target '${target.key}' must compile against the lower bound of its declared Forge range.")
					}
					if (loader.joptSimpleRuntimeVersion != null
						&& !(loader.joptSimpleRuntimeVersion.toString() ==~ /\d+\.\d+\.\d+/)) {
						throw new GradleException("Forge target '${target.key}' has invalid joptSimpleRuntimeVersion '${loader.joptSimpleRuntimeVersion}'.")
					}
				} else if (loader.joptSimpleRuntimeVersion != null) {
					throw new GradleException("Non-Forge target '${target.key}' platform '${platformId}' cannot declare joptSimpleRuntimeVersion.")
				}
				if (platformId == "neoforge" && loader.rangeCompileAnchor != true && !loader.versionRange.toString().startsWith("[${loader.version},")) {
					throw new GradleException("NeoForge target '${target.key}' must compile against the lower bound of its declared NeoForge range.")
				}
				if (platformId == "fabric"
					&& (!(loader.modMenuVersion instanceof String)
						|| loader.modMenuVersion.isBlank()
						|| !(loader.fabricApiVersion instanceof String)
						|| loader.fabricApiVersion.isBlank()
						|| loader.modMenuEntrypoint != true)) {
					throw new GradleException("Fabric target '${target.key}' must provide optional Mod Menu integration and its development-runtime Fabric API version.")
				}
			}
		}
		def expectedForgeJoptSimpleRuntimeVersions = [mc1_21_1: "5.0.4", mc1_21_4: "5.0.4"]
		def actualForgeJoptSimpleRuntimeVersions = targets
			.findAll { target -> target.platforms.forge?.joptSimpleRuntimeVersion != null }
			.collectEntries { target ->
				[(target.key.toString()): target.platforms.forge.joptSimpleRuntimeVersion.toString()]
			}
		if (actualForgeJoptSimpleRuntimeVersions != expectedForgeJoptSimpleRuntimeVersions) {
			throw new GradleException("Forge JOptSimple runtime overrides must match the validated registry exceptions: expected=${expectedForgeJoptSimpleRuntimeVersions}, actual=${actualForgeJoptSimpleRuntimeVersions}.")
		}

		def mixinSources = fileTree("versions") { include "**/*Mixin.java" }.files
		mixinSources.each { source ->
			def sourceText = source.getText("UTF-8")
			def rawSelector = sourceText =~ /\b(?:method|field)_[0-9]+\b/
			if (rawSelector.find()) {
				throw new GradleException("${source} contains raw intermediary selector '${rawSelector.group()}'.")
			}
		}
		def sharedSourceTargets = [
			"FilePackResourcesMixin.java": ["mc1_20_5", "mc1_20_6", "mc1_21", "mc1_21_1", "mc1_21_2", "mc1_21_3", "mc1_21_4", "mc1_21_5", "mc1_21_6", "mc1_21_7", "mc1_21_8", "mc1_21_9", "mc1_21_10"],
			"ReloadableResourceManagerMixin.java": ["mc1_20_5", "mc1_20_6", "mc1_21", "mc1_21_1", "mc1_21_2", "mc1_21_3", "mc1_21_4", "mc1_21_5", "mc1_21_6", "mc1_21_7", "mc1_21_8", "mc1_21_9", "mc1_21_10"],
			"SharedZipFileAccessMixin.java": ["mc1_20_5", "mc1_20_6", "mc1_21", "mc1_21_1", "mc1_21_2", "mc1_21_3", "mc1_21_4", "mc1_21_5", "mc1_21_6", "mc1_21_7", "mc1_21_8", "mc1_21_9", "mc1_21_10"]
		]
		def registeredSharedSources = { target, fileName, sourceSet ->
			registry.sharedJavaSources.findAll { source ->
				target.key in source.targets
					&& source.sourceSet == sourceSet
					&& file(source.path.toString()).name == fileName
			}.collect { source -> file(source.path.toString()) }
		}
		def effectiveTargetJavaSources = { target, fileName ->
			def roots = [file("versions/${target.apiAdapter}")]
			if (target.key in (sharedSourceTargets[fileName] ?: [])) {
				roots << file("versions/mc1_21_shared/common/src/main/java")
			}
			def sources = roots.collectMany { root ->
				fileTree(root) { include "**/${fileName}" }.files
			}
			sources.addAll(registeredSharedSources(target, fileName, "main"))
			sources.unique { it.canonicalPath }
		}
		def sharedClientTargets = ["mc1_20_5", "mc1_20_6", "mc1_21", "mc1_21_1", "mc1_21_2", "mc1_21_3", "mc1_21_4", "mc1_21_5", "mc1_21_6", "mc1_21_7", "mc1_21_8", "mc1_21_9", "mc1_21_10"]
		def effectiveTargetClientSources = { target, fileName ->
			def roots = [file("versions/${target.apiAdapter}")]
			if (target.key in sharedClientTargets) {
				roots << file("versions/mc1_21_shared/common/src/client/java")
			}
			def sources = roots.collectMany { root ->
				fileTree(root) { include "**/${fileName}" }.files
			}
			sources.addAll(registeredSharedSources(target, fileName, "client"))
			sources.unique { it.canonicalPath }
		}
		sharedClientTargets.each { targetKey ->
			def target = targets.find { it.key == targetKey }
			def clientSources = effectiveTargetClientSources(target, "PackForgeClient.java")
			if (clientSources.size() != 1) {
				throw new GradleException("Target ${target.key} must own exactly one PackForgeClient bootstrap; found ${clientSources.size()}.")
			}
		}
		def filePackSources = []
		targets.each { target ->
			def adapterSources = effectiveTargetJavaSources(target, "FilePackResourcesMixin.java")
			if (adapterSources.size() != 1) {
				throw new GradleException("Target ${target.key} must own exactly one FilePackResources mixin; found ${adapterSources.size()}.")
			}
			filePackSources.addAll(adapterSources)
		}
		filePackSources.each { source ->
			def sourceText = source.getText("UTF-8")
			if (!sourceText.contains("@WrapOperation")
				|| sourceText.contains("@WrapMethod")
				|| sourceText.contains("CallbackInfoReturnable")
				|| sourceText.contains("cancellable = true")) {
				throw new GradleException("${source} must use operation-level hooks without broad cancellable public-method replacement.")
			}
			if ((sourceText =~ /(?s)@Local(?:\([^)]*\))?[^{}]*Operation</).find()) {
				throw new GradleException("${source} places MixinExtras sugar before the @WrapOperation Operation parameter; sugar parameters must be trailing.")
			}
			def expectedAnchors = [
				"getResource(Ljava/lang/String;)Lnet/minecraft/server/packs/resources/IoSupplier;": 2,
				"ZipFile;getEntry(Ljava/lang/String;)Ljava/util/zip/ZipEntry;": 1,
				"ZipFile;entries()Ljava/util/Enumeration;": 2,
				"IoSupplier;create(Ljava/util/zip/ZipFile;Ljava/util/zip/ZipEntry;)": 2
			]
			expectedAnchors.each { anchor, expectedCount ->
				int actualCount = sourceText.count(anchor)
				if (actualCount != expectedCount) {
					throw new GradleException("${source} must contain ${expectedCount} '${anchor}' operation anchors; found ${actualCount}.")
				}
			}
		}
		def reloadManagerSources = []
		targets.each { target ->
			def adapterSources = effectiveTargetJavaSources(target, "ReloadableResourceManagerMixin.java")
			if (adapterSources.size() != 1) {
				throw new GradleException("Target ${target.key} must own exactly one ReloadableResourceManager mixin; found ${adapterSources.size()}.")
			}
			reloadManagerSources.addAll(adapterSources)
		}
		reloadManagerSources.each { source ->
			def sourceText = source.getText("UTF-8")
			def expectedWrapper = ~'(?s)private\\s+ReloadInstance\\s+packforge\\$createReload\\(\\s*Executor\\s+preparationExecutor,\\s*Executor\\s+reloadExecutor,\\s*CompletableFuture<Unit>\\s+initialStage,\\s*List<PackResources>\\s+packs,\\s*Operation<ReloadInstance>\\s+original\\s*\\)'
			if (!(sourceText =~ expectedWrapper).find()
				|| !sourceText.contains("original.call(preparationExecutor, reloadExecutor, initialStage, packs)")) {
				throw new GradleException("${source} must mirror the four createReload arguments before Operation and forward them in order.")
			}
		}
		def modernSpriteLoader = file("versions/mc26/common/src/client/java/com/teenkung/packforge/client/mixin/atlas/SpriteLoaderMixin.java")
		def modernSpriteLoaderText = modernSpriteLoader.getText("UTF-8")
		def expectedLoadAndStitchWrapper = ~'(?s)packforge\\$associateAtlasState\\(\\s*ResourceManager\\s+resourceManager,\\s*Identifier\\s+atlasId,\\s*int\\s+mipLevel,\\s*Executor\\s+executor,\\s*Set<MetadataSectionType<\\?>>\\s+additional,\\s*Operation<CompletableFuture<SpriteLoader\\.Preparations>>\\s+original\\s*\\)'
		if (!(modernSpriteLoaderText =~ expectedLoadAndStitchWrapper).find()
			|| !modernSpriteLoaderText.contains("original.call(resourceManager, atlasId, mipLevel, executor, additional)")) {
			throw new GradleException("${modernSpriteLoader} must mirror the mc26 loadAndStitch arguments before Operation and forward them in order.")
		}
		if (!modernSpriteLoaderText.contains("private static CompletableFuture<List<SpriteContents>> packforge\$decodeBounded(")) {
			throw new GradleException("${modernSpriteLoader} must keep the runSpriteSuppliers @WrapMethod handler static.")
		}
		def legacy121SpriteLoader = file("versions/mc1_21_shared/common/src/client/java/com/teenkung/packforge/client/mixin/atlas/SpriteLoaderMixin.java")
		def legacy121SpriteLoaderText = legacy121SpriteLoader.getText("UTF-8")
		def legacy121LoadAndStitchDescriptor = "loadAndStitch(Lnet/minecraft/server/packs/resources/ResourceManager;Lnet/minecraft/resources/ResourceLocation;ILjava/util/concurrent/Executor;Ljava/util/Collection;)Ljava/util/concurrent/CompletableFuture;"
		if (!legacy121SpriteLoaderText.contains("method = \"${legacy121LoadAndStitchDescriptor}\"")) {
			throw new GradleException("${legacy121SpriteLoader} must target the five-argument loadAndStitch overload explicitly.")
		}
		fileTree("versions") { include "**/packforge.fabric.mixins.json" }.files.each { descriptor ->
			if (descriptor.getText("UTF-8").contains("CompositePackResourcesMixin")) {
				throw new GradleException("${descriptor} still registers the removed CompositePackResources mixin.")
			}
		}
	}
}

ext.packforgeReadmePublicationContract = [
	readmeFile: file("README.md"),
	artifactCount: expectedArtifactNames.size(),
	targetKeys: publishedTargets.collect { it.key.toString() }.sort().asImmutable()
]
apply from: file("gradle/packforge-readme-publication.gradle")

if (!rootProject.ext.has('packforgeStonecutterNodePaths')) {
	throw new GradleException('Settings did not provide the registry-derived Stonecutter node paths.')
}
if (!rootProject.ext.has('packforgeStonecutterDirectNodePaths')) {
	throw new GradleException('Settings did not provide the registry-derived direct Stonecutter node paths.')
}
def stonecutterNodePaths = rootProject.ext.packforgeStonecutterNodePaths as List
def stonecutterDirectNodePaths = (rootProject.ext.packforgeStonecutterDirectNodePaths as List)*.toString().sort()
def stonecutterSourceAnchors = rootProject.ext.packforgeStonecutterSourceAnchors as List
def stonecutterValidationPreparationTasks = stonecutterNodePaths.collectMany { nodePath ->
	["stonecutterPrepare", "stonecutterPrepareTest"].collect { taskName ->
		"${nodePath}:${taskName}"
	}
}
tasks.named("validateTargetRegistry") {
	dependsOn stonecutterValidationPreparationTasks
}

tasks.register("validateStonecutterRegistry") {
	group = "verification"
	description = "Validates the registry-derived Stonecutter loader branches and target-node bijection."
	dependsOn tasks.named("validateTargetRegistry")
	doLast {
		def expectedDirectNodePaths = targets.collectMany { target ->
			platformBuilds.findAll { platform ->
				targetSupports(target, platform) && stonecutterBuildMode(target, platform) == "direct"
			}.collect { platform -> stonecutterNodePath(target, platform) }
		}.sort()
		if (stonecutterDirectNodePaths != expectedDirectNodePaths) {
			throw new GradleException("Stonecutter direct-node ledger mismatch: expected=${expectedDirectNodePaths}, actual=${stonecutterDirectNodePaths}.")
		}
		if (expectedDirectNodePaths != stonecutterNodePaths*.toString().sort()) {
			throw new GradleException("Every root Stonecutter cell must use direct mode: direct=${expectedDirectNodePaths.size()}, total=${stonecutterNodePaths.size()}.")
		}
		def expectedNodeCount = targets.sum { target -> target.platforms.size() } as int
		if (stonecutterNodePaths.size() != expectedNodeCount
			|| stonecutterNodePaths.size() != stonecutterNodePaths.toSet().size()) {
			throw new GradleException("Stonecutter node ledger mismatch: expected=${expectedNodeCount}, actual=${stonecutterNodePaths.size()}.")
		}
		def expectedSourceAnchors = targets.collect { target ->
			[target: target.key.toString(), minecraftVersion: target.minecraftVersion.toString(), sourceFamily: target.sourceFamily.toString()]
		}
		if (stonecutterSourceAnchors != expectedSourceAnchors
			|| stonecutterSourceAnchors.collect { it.target }.size() != stonecutterSourceAnchors.collect { it.target }.toSet().size()) {
			throw new GradleException("Stonecutter source-anchor ledger mismatch: expected=${expectedSourceAnchors}, actual=${stonecutterSourceAnchors}.")
		}
		def actualDistributionCounts = stonecutterNodePaths.collect { it.toString().tokenize(':').last() }.countBy { it }
		def expectedDistributionCounts = targets.collectEntries { target -> [(target.key.toString()): target.platforms.size()] }
		if (actualDistributionCounts != expectedDistributionCounts) {
			throw new GradleException("Stonecutter distribution ledger mismatch: expected=${expectedDistributionCounts}, actual=${actualDistributionCounts}.")
		}
		def exactLoaderCellCount = registry.releaseCells.sum { cell -> cell.loaderAvailability.size() } as int
		println("Stonecutter registry graph valid: branches=${rootProject.ext.packforgeStonecutterLoaderBranches.size()}, sourceAnchors=${stonecutterSourceAnchors.size()}, distributions=${stonecutterNodePaths.size()}, exactLoaderCells=${exactLoaderCellCount}")
	}
}

tasks.register("printResolvedMatrix") {
	group = "verification"
	description = "Prints the complete registry-derived exact-release and artifact matrix as JSON."
	dependsOn tasks.named("validateTargetRegistry")
	doLast {
		def resolvedTargets = targets.collect { target ->
			[
				id: target.id,
				minecraftAnchor: target.minecraftAnchor,
				minecraftRange: target.minecraftRange,
				sourceFamily: target.sourceFamily,
				artifactFamily: target.artifactFamily,
				maturity: target.maturity,
				javaVersion: target.javaVersion,
				requiredExactSmokeVersions: target.requiredExactSmokeVersions,
				platforms: target.platforms.collectEntries { platformId, loader ->
					[(platformId): [
						maturity: loader.maturity,
						artifactMinecraft: (loader.artifactMinecraft ?: target.artifactMinecraft).toString(),
						mixinCompatibility: (loader.mixinCompatibility ?: target.mixinCompatibility).toString(),
						versionSuffix: loader.versionSuffix
					]]
				}
			]
		}
		println(JsonOutput.prettyPrint(JsonOutput.toJson([
			schemaVersion: registry.schemaVersion,
			policy: registry.registryPolicy,
			releaseSequence: registry.releaseSequence,
			releaseCells: registry.releaseCells,
			sourceFamilies: registry.sourceFamilies,
			sharedJavaSources: registry.sharedJavaSources,
			targets: resolvedTargets
		])))
	}
}

def registerPlatformBuildTask = { String taskName, target, platform ->
	def buildMode = stonecutterBuildMode(target, platform)
	if (buildMode != "direct") {
		throw new GradleException("Root public build task '${taskName}' requires direct Stonecutter mode for ${stonecutterNodePath(target, platform)}; found '${buildMode}'.")
	}
	return tasks.register(taskName) {
		group = "build"
		description = "Builds the ${platform.name} PackForge jar for ${target.artifactMinecraft} directly in the Stonecutter graph."
		dependsOn tasks.named("validateTargetRegistry")
		dependsOn "${stonecutterNodePath(target, platform)}:buildStonecutterDirectNode"
	}
}

platformBuilds.each { platform ->
	if (targetSupports(selectedTarget, platform)) {
		registerPlatformBuildTask("build${platform.name}Platform", selectedTarget, platform)

		tasks.register("run${platform.name}Client", Exec) {
			group = "run"
			description = "Runs the ${platform.name} client for ${selectedTarget.artifactMinecraft}."
			dependsOn tasks.named("validateTargetRegistry")
			commandLine nestedCommand(platform, selectedTarget, "runClient")
		}
	}
}

def buildTasksByTarget = [:]
def buildTasksByPlatform = platformBuilds.collectEntries { [(it.id): []] }
def verificationTasksByTarget = [:]
def directStructuralVerificationTasks = []

targets.each { target ->
	def targetBuildTasks = []

	platformBuilds.findAll { targetSupports(target, it) }.each { platform ->
		def buildTask = registerPlatformBuildTask("build${platform.name}${target.taskSuffix}Platform", target, platform)
		targetBuildTasks << buildTask
		buildTasksByPlatform[platform.id] << buildTask
		if (stonecutterBuildMode(target, platform) == "direct") {
			def directCollectTask = tasks.register("collect${platform.name}${target.taskSuffix}DirectJar", Copy) {
				group = "build"
				description = "Collects the direct ${platform.name} artifact for ${target.artifactMinecraft} into root build/libs."
				dependsOn buildTask
				duplicatesStrategy = DuplicatesStrategy.FAIL
				from(artifactSourceDirectory(target, platform)) {
					include artifactName(target, platform)
				}
				into layout.buildDirectory.dir("libs")
			}
			def directArtifactVerification = tasks.register("verify${platform.name}${target.taskSuffix}DirectArtifact") {
				group = "verification"
				description = "Validates the collected direct ${platform.name} artifact for ${target.artifactMinecraft}."
				dependsOn directCollectTask
				doLast {
					verifyArtifact(target, platform, layout.buildDirectory.file("libs/${artifactName(target, platform)}").get().asFile)
				}
			}
			directStructuralVerificationTasks << directArtifactVerification
		}

		tasks.register("run${platform.name}${target.taskSuffix}Client", Exec) {
			group = "run"
			description = "Runs the ${platform.name} client for ${target.artifactMinecraft}."
			dependsOn tasks.named("validateTargetRegistry")
			commandLine nestedCommand(platform, target, "runClient")
		}
	}

	def collectTask = tasks.register("collect${target.taskSuffix}PlatformJars", Copy) {
		group = "build"
		description = "Collects PackForge ${target.artifactMinecraft} jars into root build/libs."
		dependsOn targetBuildTasks
		duplicatesStrategy = DuplicatesStrategy.FAIL

		platformBuilds.findAll { targetSupports(target, it) }.each { platform ->
			from(artifactSourceDirectory(target, platform)) {
				include artifactName(target, platform)
			}
		}
		into layout.buildDirectory.dir("libs")
	}

	def verifyTask = tasks.register("verify${target.taskSuffix}Artifacts") {
		group = "verification"
		description = "Validates filenames, metadata, mappings, duplicates, and Java level for ${target.artifactMinecraft}."
		dependsOn collectTask
		doLast {
			platformBuilds.findAll { targetSupports(target, it) }.each { platform ->
				verifyArtifact(target, platform, layout.buildDirectory.file("libs/${artifactName(target, platform)}").get().asFile)
			}
		}
	}
	verificationTasksByTarget[target.key] = verifyTask

	def aggregateTask = tasks.register("build${target.taskSuffix}") {
		group = "build"
		description = "Builds all PackForge platform jars for ${target.artifactMinecraft}."
		dependsOn verifyTask
	}
	buildTasksByTarget[target.key] = aggregateTask
}

def directStonecutterBuildTaskPaths = stonecutterDirectNodePaths.collect { "${it}:buildStonecutterDirectNode" }
def directStonecutterParityTaskPaths = stonecutterDirectNodePaths.collect { "${it}:verifyStonecutterDirectNode" }
def directFabricNodePaths = stonecutterDirectNodePaths.findAll { it.startsWith(':fabric:') }
def directNeoForgeNodePaths = stonecutterDirectNodePaths.findAll { it.startsWith(':neoforge:') }
def neoForgeBuildGate = directNeoForgeNodePaths.isEmpty()
	? null
	: gradle.sharedServices.registerIfAbsent('packforgeNeoForgeBuildGate', PackForgeNeoForgeBuildGate) {
		maxParallelUsages.set(1)
	}
gradle.projectsEvaluated {
	directFabricNodePaths.eachWithIndex { nodePath, index ->
		if (index > 0) {
			project(nodePath).tasks.named('buildStonecutterDirectNode').configure {
				mustRunAfter("${directFabricNodePaths[index - 1]}:buildStonecutterDirectNode")
			}
			project(nodePath).tasks.named('verifyStonecutterDirectNode').configure {
				mustRunAfter("${directFabricNodePaths[index - 1]}:verifyStonecutterDirectNode")
			}
		}
	}

	if (neoForgeBuildGate != null) {
		def directNeoForgeProjects = directNeoForgeNodePaths.collect { nodePath -> project(nodePath) }
		directNeoForgeProjects.each { neoForgeProject ->
			neoForgeProject.tasks.configureEach { currentTask ->
				currentTask.usesService(neoForgeBuildGate)
			}
		}
		def isNeoForgeBuildPipelineTask = { currentTask ->
			!currentTask.name.startsWith('stonecutter')
				&& currentTask.name !in ['buildStonecutterDelegatedNode', 'verifyStonecutterDirectNode']
		}
		directNeoForgeProjects.eachWithIndex { neoForgeProject, index ->
			neoForgeProject.tasks.matching(isNeoForgeBuildPipelineTask).configureEach { currentTask ->
				directNeoForgeProjects.take(index).each { earlierProject ->
					currentTask.mustRunAfter(earlierProject.tasks.matching(isNeoForgeBuildPipelineTask))
				}
			}
		}
	}
}

