def artifactMetadataDescriptor = { target, platform ->
	if (platform.id == "neoforge" && target.key in ["mc1_20_2", "mc1_20_3", "mc1_20_4"]) {
		return "META-INF/mods.toml"
	}
	platform.id == "neoforge" ? "META-INF/neoforge.mods.toml" : "META-INF/mods.toml"
}

def verifyArtifact = { target, platform, File artifact ->
	if (!artifact.isFile()) {
		throw new GradleException("Expected PackForge artifact was not produced: ${artifact}")
	}
	def loader = target.platforms[platform.id]
	def mixinConfigs = artifactMixinConfigs(target, platform)
	def mainMixinConfig = mixinConfigs.main.toString()
	def clientMixinConfig = mixinConfigs.client.toString()
	def metadataDescriptor = artifactMetadataDescriptor(target, platform)
	new ZipFile(artifact).withCloseable { archive ->
		def names = archive.entries().toList().collect { it.name }
		def duplicates = names.countBy { it }.findAll { name, count -> count > 1 }.keySet()
		if (!duplicates.isEmpty()) {
			throw new GradleException("${artifact.name} contains duplicate entries: ${duplicates.sort().join(', ')}")
		}

		def forbiddenBridgePaths = [
			"com/teenkung/packforge/mixin/loader/SharedZipFileAccessBridge.class",
			"com/teenkung/packforge/loader/SharedZipFileAccessBridge.class"
		]
		def forbiddenBridge = forbiddenBridgePaths.find { names.contains(it) }
		if (forbiddenBridge != null) {
			throw new GradleException("${artifact.name} packages the shared ZIP bridge at a forbidden path: ${forbiddenBridge}")
		}
		if (target.key != "mc1_20_1"
			&& !names.contains("com/teenkung/packforge/internal/loader/SharedZipFileAccessBridge.class")) {
			throw new GradleException("${artifact.name} is missing the shared ZIP access bridge outside its Mixin package.")
		}
		[
			"com/teenkung/packforge/client/config/PackForgeConfigScreen.class",
			"com/teenkung/packforge/client/mixin/config/PackSelectionScreenMixin.class",
			"assets/packforge/lang/en_us.json",
			"assets/packforge/textures/gui/sprites/config_cog.png"
		].each { requiredPath ->
			if (!names.contains(requiredPath)) {
				throw new GradleException("${artifact.name} is missing configuration-menu entry '${requiredPath}'.")
			}
		}

		def expectedMixinExtras = "mixinextras-${platform.id}-${registry.mixinExtrasVersion}.jar"
		def nestedMixinExtras = names.find { it.endsWith("/${expectedMixinExtras}") }
		if (nestedMixinExtras == null) {
			throw new GradleException("${artifact.name} does not embed pinned MixinExtras ${registry.mixinExtrasVersion}.")
		}

		def packMetadata = new JsonSlurper().parseText(readZipText(archive, "pack.mcmeta")).pack
		if (target.packMetadata.schema == "single") {
			if ((packMetadata.pack_format as int) != (target.packMetadata.packFormat as int)) {
				throw new GradleException("${artifact.name} has the wrong resource-pack format.")
			}
		} else if (target.packMetadata.schema == "supported-range") {
			def actualRange = packMetadata.supported_formats.collect { it as int }
			def expectedRange = [target.packMetadata.minFormat, target.packMetadata.maxFormat].collect { it as int }
			if ((packMetadata.pack_format as int) != (target.packMetadata.packFormat as int)
				|| actualRange != expectedRange) {
				throw new GradleException("${artifact.name} has the wrong legacy resource-pack format range.")
			}
		} else {
			def actualMin = packMetadata.min_format.collect { it as int }
			def actualMax = packMetadata.max_format.collect { it as int }
			def expectedMin = target.packMetadata.minFormat.collect { it as int }
			def expectedMax = target.packMetadata.maxFormat.collect { it as int }
			if (actualMin != expectedMin || actualMax != expectedMax) {
				throw new GradleException("${artifact.name} has the wrong resource-pack format range.")
			}
		}

		def capabilities = new Properties()
		archive.getInputStream(archive.getEntry("packforge-capabilities.properties")).withCloseable { capabilities.load(it) }
		def expectedCapabilityProperties = [
			target: target.key.toString(),
			minecraft: artifactMinecraftFor(target, platform),
			maturity: loader.maturity.toString(),
			beta: (loader.maturity == "beta").toString(),
			capabilities: target.capabilities.join(",")
		]
		(target.capabilityMinimumMinecraft ?: [:]).each { capability, minimum ->
			expectedCapabilityProperties["capabilityFloor.${capability}".toString()] = minimum.toString()
		}
		(target.mixinMinimumMinecraft ?: [:]).each { mixin, minimum ->
			expectedCapabilityProperties["mixinFloor.${mixin}".toString()] = minimum.toString()
		}
		def actualCapabilityProperties = capabilities.stringPropertyNames().collectEntries { key ->
			[(key): capabilities.getProperty(key)]
		}
		if (actualCapabilityProperties != expectedCapabilityProperties) {
			throw new GradleException("${artifact.name} contains stale target capability metadata.")
		}

		def expectedMixinCompatibility = (loader.mixinCompatibility ?: target.mixinCompatibility).toString()
		[mainMixinConfig, clientMixinConfig].each { mixinPath ->
			def mixin = new JsonSlurper().parseText(readZipText(archive, mixinPath.toString()))
			if (mixin.compatibilityLevel != expectedMixinCompatibility) {
				throw new GradleException("${artifact.name} has an incorrect mixin compatibility level in ${mixinPath}.")
			}
		}
		def clientMixin = new JsonSlurper().parseText(readZipText(archive, clientMixinConfig))
		def mainMixin = new JsonSlurper().parseText(readZipText(archive, mainMixinConfig))
		def expectedMainMixinPlugin = "com.teenkung.packforge.QuickPackMixinPlugin"
		def expectedClientMixinPlugin = target.apiAdapter == "mc26"
			? "com.teenkung.packforge.client.mixin.compat.GuiCompatMixinPlugin"
			: expectedMainMixinPlugin
		if (mainMixin.plugin != expectedMainMixinPlugin || clientMixin.plugin != expectedClientMixinPlugin) {
			throw new GradleException("${artifact.name} is missing the expected version-selection mixin plugins.")
		}
		def forbiddenPluginConstants = [
			"quick-pack",
			"me/drex/quickpack/",
			"net/minecraftforge/fml/ModList",
			"net/neoforged/fml/ModList",
			"ForgeModListCompat"
