def isWindows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
def gradlew = isWindows ? "gradlew.bat" : "./gradlew"
def resolvePowerShellExecutable = {
	def executableNames = isWindows
		? ["pwsh.exe", "pwsh", "powershell.exe", "powershell"]
		: ["pwsh", "powershell"]
	def pathValue = System.getenv("PATH") ?: System.getenv("Path") ?: ""
	def pathEntries = pathValue
		.split(java.util.regex.Pattern.quote(File.pathSeparator))
		.collect { entry -> entry.trim().replaceAll(/^"(.*)"$/, '$1') }
		.findAll { entry -> !entry.isBlank() }
	def executable = executableNames
		.collectMany { executableName -> pathEntries.collect { entry -> new File(entry, executableName) } }
		.find { candidate -> candidate.isFile() && (isWindows || candidate.canExecute()) }
	if (executable == null) {
		throw new GradleException("PackForge static validation requires PowerShell; searched ${executableNames} on PATH.")
	}
	executable.canonicalPath
}
def resolvePythonExecutable = {
	def executableNames = isWindows ? ["python.exe", "python", "py.exe", "py"] : ["python3", "python"]
	def pathValue = System.getenv("PATH") ?: System.getenv("Path") ?: ""
	def pathEntries = pathValue
		.split(java.util.regex.Pattern.quote(File.pathSeparator))
		.collect { entry -> entry.trim().replaceAll(/^"(.*)"$/, '$1') }
		.findAll { entry -> !entry.isBlank() }
	def executable = executableNames
		.collectMany { executableName -> pathEntries.collect { entry -> new File(entry, executableName) } }
		.find { candidate -> candidate.isFile() && (isWindows || candidate.canExecute()) }
	if (executable == null) {
		throw new GradleException("PackForge fixture validation requires Python; searched ${executableNames} on PATH.")
	}
	executable.canonicalPath
}
