import groovy.json.JsonOutput

// Opt-in, build-only observer. Apply after a node's loader dependencies are configured.
// No production task depends on these tasks or includes their output.
if (project.name != 'mc26_1_to_26_2') return
def observerLoader = project.parent.name
def observerVersion = packforgeRuntimeVersion('packforge_minecraft_version_override', packforgeTarget.minecraftVersion)
def observerRoot = rootProject.file('benchmarks/correctness')
def observerOutput = rootProject.layout.buildDirectory.dir("benchmarks/correctness/${observerLoader}/${observerVersion}")
def observerCompile = tasks.register('compileTextureCorrectness', JavaCompile) {
    source fileTree(new File(observerRoot, 'src/main/java')) { include '**/*.java' }
    if (observerLoader != 'fabric') source fileTree(new File(observerRoot, "src/${observerLoader}/java")) { include '**/*.java' }
    classpath = sourceSets.main.compileClasspath
    if (sourceSets.findByName('client') != null) classpath += sourceSets.client.compileClasspath
    destinationDirectory = observerOutput.map { it.dir('classes') }
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    options.release = 25
    options.compilerArgs += ['-proc:none']
    options.encoding = 'UTF-8'
}
def observerMetadata = tasks.register('generateTextureCorrectnessMetadata') {
    inputs.property('loader', observerLoader)
    inputs.property('minecraftVersion', observerVersion)
    outputs.dir(observerOutput.map { it.dir('metadata') })
    doLast {
        def directory = observerOutput.get().dir('metadata').asFile
        directory.mkdirs()
        new File(directory, 'pack.mcmeta').text = JsonOutput.prettyPrint(JsonOutput.toJson([
            pack: [description: 'Texture Pixel Correctness Capture', min_format: [84, 0], max_format: [88, 0]]
        ]))
        if (observerLoader == 'fabric') {
            new File(directory, 'fabric.mod.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: 1, id: 'texture_correctness', version: '2.0.0',
                name: 'Texture Pixel Correctness Capture', environment: 'client', license: 'MIT',
                mixins: ['texture-correctness.mixins.json'],
                depends: [fabricloader: '>=0.19.2', minecraft: observerVersion, java: '>=25']
            ]))
        } else {
            def meta = new File(directory, 'META-INF')
            meta.mkdirs()
            def filename = observerLoader == 'forge' ? 'mods.toml' : 'neoforge.mods.toml'
            def dependency = observerLoader == 'forge' ? 'mandatory=true' : 'type="required"'
            new File(meta, filename).text = """modLoader="javafml"
loaderVersion="[1,)"
license="MIT"
[[mods]]
modId="texture_correctness"
version="2.0.0"
displayName="Texture Pixel Correctness Capture"
description="Standalone test-only in-memory texture pixel hashing."
[[dependencies.texture_correctness]]
modId="minecraft"
${dependency}
versionRange="[${observerVersion}]"
ordering="NONE"
side="CLIENT"
""" + (observerLoader == 'neoforge' ? '\n[[mixins]]\nconfig="texture-correctness.mixins.json"\n' : '')
        }
    }
}
tasks.register('textureCorrectnessJar', Jar) {
    group = 'verification'
    description = 'Build independent exact-version texture correctness capture (not a release artifact).'
    archiveFileName = "texture-correctness-${observerLoader}-${observerVersion}.jar"
    destinationDirectory = observerOutput
    from(observerCompile.flatMap { it.destinationDirectory })
    from(observerMetadata)
    from(new File(observerRoot, 'src/main/resources'))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    if (observerLoader == 'forge') manifest.attributes('MixinConfigs': 'texture-correctness.mixins.json')
}
