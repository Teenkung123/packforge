import groovy.json.JsonSlurper

def packforgeRoot = rootProject.projectDir.canonicalFile
def registry = new JsonSlurper().parse(new File(packforgeRoot, 'gradle/minecraft-targets.json'))
def currentTargetKey = stonecutter.current.project.toString()
def currentMinecraft = stonecutter.current.version.toString()
def nodePathSegments = project.path.tokenize(':')
if (nodePathSegments.size() != 2 || nodePathSegments.last() != currentTargetKey) {
	throw new GradleException("Stonecutter node path '${project.path}' does not match target metadata '${currentTargetKey}'.")
}
def currentLoader = nodePathSegments.first()
def currentTarget = registry.targets.find { it.key.toString() == currentTargetKey }
if (currentTarget == null) {
	throw new GradleException("Stonecutter target '${currentTargetKey}' is not registered in PackForge's target registry.")
}
if (currentTarget.minecraftVersion.toString() != currentMinecraft) {
	throw new GradleException("Stonecutter target '${currentTargetKey}' version mismatch: registry=${currentTarget.minecraftVersion}, node=${currentMinecraft}.")
}

def currentPlatformPath = "platform/${currentLoader}"
def currentPlatformDirectory = new File(packforgeRoot, currentPlatformPath).canonicalFile
if (currentTarget.platforms[currentLoader] == null
	|| !new File(currentPlatformDirectory, 'settings.gradle').isFile()
	|| !new File(currentPlatformDirectory, 'build.gradle').isFile()) {
	throw new GradleException("Stonecutter node '${project.path}' does not map to an available PackForge loader cell: target=${currentTargetKey}, loader=${currentLoader}, available=${currentTarget.platforms.keySet()}.")
}
def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def localWrapper = new File(currentPlatformDirectory, isWindows ? 'gradlew.bat' : 'gradlew')
def delegatedWrapper = (localWrapper.isFile()
	? localWrapper
	: new File(packforgeRoot, isWindows ? 'gradlew.bat' : 'gradlew')).canonicalFile

def versionProperties = new Properties()
new File(packforgeRoot, 'gradle.properties').withInputStream { versionProperties.load(it) }
def modVersion = versionProperties.getProperty('mod_version')
if (modVersion == null || modVersion.isBlank()) {
	throw new GradleException("PackForge gradle.properties must define mod_version for Stonecutter artifact checks.")
}

def loader = currentTarget.platforms[currentLoader]
def artifactMinecraft = (loader.artifactMinecraft ?: currentTarget.artifactMinecraft).toString()
def artifactName = "packforge-${currentLoader}-${modVersion}${loader.versionSuffix}-mc${artifactMinecraft}.jar"
def delegatedArtifact = new File(packforgeRoot, "${currentPlatformPath}/build/${currentTarget.key}/libs/${artifactName}")

def delegatedBuildTask = tasks.register('buildStonecutterDelegatedNode', Exec) {
	group = 'build'
	description = "Builds the delegated ${currentLoader} artifact for Stonecutter target ${currentTarget.key}."
	workingDir(packforgeRoot)
	doFirst {
		project.delete(delegatedArtifact)
	}
	def arguments = [delegatedWrapper.absolutePath, '-p', currentPlatformPath,
		"-Ppackforge_target=${currentTarget.key}", 'build', '--no-daemon', '--stacktrace']
	if (isWindows) {
		commandLine(['cmd', '/c'] + arguments)
	} else {
		commandLine(['sh'] + arguments)
	}
}

def outputDirectory = layout.buildDirectory.dir("stonecutter/${currentTarget.key}/${currentLoader}/libs")

tasks.register('buildStonecutterCurrentTarget') {
	group = 'build'
	description = "Builds the ${currentLoader} distribution selected by Stonecutter (${currentTarget.key}) without re-entering the root aggregator."
	dependsOn(delegatedBuildTask)
}

tasks.register('verifyStonecutterCurrentTarget') {
	group = 'verification'
	description = "Builds and verifies the registry target selected by Stonecutter (${currentTarget.key})."
	dependsOn(':validateTargetRegistry')
	dependsOn('buildStonecutterCurrentTarget')
	doLast {
		def output = outputDirectory.get().asFile
		project.delete(output)
		output.mkdirs()
		if (!delegatedArtifact.isFile()) {
			throw new GradleException("Stonecutter node ${project.path} did not produce ${delegatedArtifact}.")
		}
		copy {
			from(delegatedArtifact)
			into(output)
		}
		def actual = output.listFiles()?.findAll { it.name.endsWith('.jar') }*.name?.sort() ?: []
		if (actual != [artifactName]) {
			throw new GradleException("Stonecutter node ${project.path} artifact set mismatch: expected=${[artifactName]}, actual=${actual}.")
		}
		logger.lifecycle("Stonecutter node artifact verified: ${actual.join(', ')}")
	}
}
